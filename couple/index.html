<style>
/* Trang danh sách người (tác giả / couple): cùng một ngôn ngữ với phần còn lại
   của web — token của cz.css, chỉ nâng nhịp chữ và khoảng thở. */
.people { max-width: 1120px; margin: auto; padding: 0 24px 72px; }
.people .crumb { padding: 26px 0 0; font-size: 12.5px; color: var(--dim); }
.people .crumb a { color: var(--dim); text-decoration: none; }
.people .crumb a:hover { color: var(--txt); }
.people .crumb b { color: var(--mut); font-weight: 600; }
.people .phead { display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px 28px; padding: 10px 0 16px; margin: 0 0 22px; border-bottom: 1px solid var(--bd); }
.people .pname { min-width: 0; }
.people #ppTitle { font-family: var(--font-head); font-weight: 600; letter-spacing: -.022em;
  font-size: clamp(28px, 3.4vw, 38px); line-height: 1.06; margin: 0; overflow-wrap: anywhere; }
.people .sub { color: var(--mut); font-size: 13.5px; line-height: 1.5; margin: 7px 0 0; }
.people .sub b { color: var(--txt); font-weight: 600; }
.people .search { max-width: 320px; flex: 0 1 320px; margin: 0; }
.people .search[hidden] { display: none; }
.people .search input { font-size: 14px; }
@media (max-width: 720px) {
  .people { padding: 0 16px 56px; }
  .people .phead { flex-direction: column; align-items: stretch; gap: 16px; padding-bottom: 14px; }
  .people .search { max-width: none; flex: 1 1 auto; }
}
</style>
</head>
<body data-personal-follow-only>
<header id="hdr"></header>
<main class="people">
  <nav class="crumb" id="crumb"><a href="/">Trang chủ</a> <span>›</span> <b>Couple</b></nav>
  <header class="phead">
    <div class="pname">
      <h1 id="ppTitle">Couple</h1>
      <p class="sub" id="ppSub">Đang tải…</p>
    </div>
    <label class="search" id="ppQWrap" hidden><span data-ic="search"></span><input id="ppQ" placeholder="Tìm theo tên…" autocomplete="off" spellcheck="false" aria-label="Tìm theo tên"></label>
  </header>
  <div class="grid pgrid" id="ppGrid"></div>
</main>
<footer id="ftr"></footer><button id="toTop" aria-label="Lên đầu trang"></button>
