name = "chuseoz-cms"
main = "cms.js"
compatibility_date = "2025-01-01"

# Kênh đăng + số liệu xếp hạng: mọi thứ nằm trong KV, sửa là web thấy ngay —
# không commit GitHub, không build, và KHÔNG cần Firebase.
#
# 1) Tạo KV namespace:   npx wrangler kv namespace create CZ_KV
# 2) Dán id trả về vào đây (bắt buộc — để nguyên "DAN_ID_KV_VAO_DAY" thì deploy báo lỗi)
#    hoặc chạy:          npx wrangler kv namespace create CZ_KV --binding CZ_KV
# 3) Đặt khoá quản trị:  npx wrangler secret put ADMIN_KEY        (≥ 24 ký tự)
# 4) Đặt khoá phiên:     npx wrangler secret put SESSION_SECRET   (≥ 32 ký tự)
# 5) Đặt email quản trị: npx wrangler secret put ADMIN_EMAILS      (phân cách bằng dấu phẩy)
# 6) Đặt Client ID:      npx wrangler secret put GOOGLE_CLIENT_ID (nếu dùng Google trực tiếp)
# 7) Deploy:             npx wrangler deploy
[[kv_namespaces]]
binding = "CZ_KV"
id = "c1e0e450c37f4a0abf804bf354c412d9"

[vars]
# ⚠ ĐỪNG XOÁ DÒNG SUPABASE_URL BÊN DƯỚI.
# `npx wrangler deploy` thay TOÀN BỘ biến THƯỜNG của Worker bằng đúng nội dung
# [vars] của tệp này: biến đặt tay trên dashboard (Settings → Variables and
# Secrets) sẽ BỊ XOÁ sau mỗi lần deploy. Secret (ADMIN_KEY, SESSION_SECRET,
# SUPABASE_SERVICE_ROLE…) thì wrangler GIỮ, còn biến thường thì không.
# Sự cố 23/09: SUPABASE_URL đặt tay → deploy 1.16.0 xoá mất → Worker mất chỗ đọc
# dữ liệu lớn (overflow) → cả 63 bộ không đọc được (502/404) dù /api/health vẫn
# báo version mới. Chi tiết: BAO-CAO-SU-CO-DEPLOY-MAT-BIEN-SUPABASE.md
# Đây là URL CÔNG KHAI của project (web cũng nhúng nó trong cz-config.js), không
# phải secret — ghi vào đây là đúng chỗ.
SUPABASE_URL = "https://hnyzrkdlmvelbgcowztk.supabase.co"
BLOG = "https://chuseoz.blogspot.com"
# Chỉ cho các web thật gọi Worker; preview *.ssochuz.pages.dev cũng được nhận diện.
# Nếu có custom domain, thêm nó vào danh sách này rồi deploy lại.
# Cả hai hostname đều đang được dùng cho trang quản trị; nếu thiếu chuseoz.pages.dev,
# trình duyệt chặn /api/admin/reports ở bước CORS preflight và admin chỉ báo Failed to fetch.
ALLOW_ORIGIN = "https://ssochuz.pages.dev,https://chuseoz.pages.dev,https://chuseoz.blogspot.com"
# Gốc dựng link chương trong GET /feed.xml (RSS). Có custom domain thì đổi cả hai chỗ rồi deploy lại.
SITE_BASE = "https://ssochuz.pages.dev"
# Khoá CÔNG KHAI VAPID cho Web Push (không nhạy cảm — web cũng nhúng key này).
# Khoá RIÊNG đặt bằng: npx wrangler secret put VAPID_PRIVATE  (không ghi vào file này)
VAPID_PUBLIC = "BDzU2yh_uWzhaTZ6HZe3s-aLk6w5BnKCv5gTzUZYNjTyObcAlJa5GnZGrbfwHeOdUpDistwMgMaKvnmqLiXzobs"

# Cron rút dần hàng đợi push "ra chương mới" — mỗi 10 phút, mỗi lần tối đa 45 tin.
[triggers]
crons = ["*/10 * * * *"]

# TUỲ CHỌN — overflow book/img ra khỏi KV (free, không bắt buộc).
# Không cấu hình thì Worker vẫn ghi full JSON vào KV như cũ.
# 0) Bìa truyện (POST /api/img kind=cover): Worker PUT lên Storage bucket public
#    `covers` (cùng SUPABASE_URL + SUPABASE_SERVICE_ROLE). Free 1 GB, không
#    unlimited. Bucket tự tạo lần upload đầu nếu chưa có. Ảnh chương vẫn KV.
# 1) Supabase Postgres (bảng ssochuz_blobs). Secret KHÔNG đưa ra trình duyệt:
#      npx wrangler secret put SUPABASE_SERVICE_ROLE
#    SQL một lần (SQL Editor):
#      create table if not exists public.ssochuz_blobs (
#        key text primary key,
#        value text not null,
#        mime text,
#        updated_at timestamptz default now()
#      );
#      alter table public.ssochuz_blobs enable row level security;
#    (Worker dùng service role, RLS vẫn chặn anon.)
# 2) Cloudflare R2 — 10 GB free. Bỏ comment sau khi tạo bucket:
# [[r2_buckets]]
# binding = "CZ_R2"
# bucket_name = "ssochuz-blobs"
# TUỲ CHỌN — chỉ dùng cho POST /api/stats/import-firebase (kéo số liệu CŨ về KV 1 lần).
# Lượt đọc/bình chọn mới do Worker tự đếm trên KV, không gọi tới Firebase.
FIREBASE_PROJECT = "chuseoz-library"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "PRIVATE_BOOKS"
class_name = "PrivateBooks"

[[migrations]]
tag = "private-books-v1"
new_sqlite_classes = ["PrivateBooks"]

[[durable_objects.bindings]]
name = "MEMBER_SPACES"
class_name = "MemberSpaces"

[[migrations]]
tag = "member-spaces-v1"
new_sqlite_classes = ["MemberSpaces"]
