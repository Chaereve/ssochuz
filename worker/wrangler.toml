name = "chuseoz-cms"
main = "worker/cms.js"
compatibility_date = "2025-01-01"

# Kênh đăng mới: dữ liệu nằm trong KV, sửa là web thấy ngay — không commit GitHub, không build.
#
# 1) Tạo KV namespace:   npx wrangler kv namespace create CZ_KV
# 2) Dán id trả về vào đây (hoặc chạy: npx wrangler kv namespace create CZ_KV --binding CZ_KV)
# 3) Đặt khoá quản trị:  npx wrangler secret put ADMIN_KEY
# 4) Deploy:             npx wrangler deploy
[[kv_namespaces]]
binding = "CZ_KV"
id = "DAN_ID_KV_VAO_DAY"

[vars]
BLOG = "https://chuseoz.blogspot.com"
FIREBASE_PROJECT = "chuseoz-library"
# Đổi thành domain web của bạn để chặt CORS, ví dụ:
# ALLOW_ORIGIN = "https://chuseoz.pages.dev,https://chuseoz.blogspot.com"
ALLOW_ORIGIN = "*"

[observability]
enabled = true
