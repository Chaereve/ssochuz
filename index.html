<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ssochuz library · thư viện truyện</title>
<meta name="description" content="ssochuz library — thư viện truyện chọn lọc: đọc trong máy, lưu tiến độ, lọc theo năm, tác giả, couple và lịch ra chương.">
<meta name="theme-color" content="#14110e">
<link rel="alternate" type="application/rss+xml" title="ssochuz library — Chương mới (RSS)" href="https://chuseoz-cms.kimtong1906.workers.dev/feed.xml">
<link rel="icon" type="image/png" href="/ssochuz.png?v=1">
<link rel="apple-touch-icon" href="/ssochuz.png?v=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:title" content="ssochuz library · thư viện truyện">
<meta property="og:description" content="ssochuz library — thư viện truyện chọn lọc: đọc trong máy, lưu tiến độ, lọc theo năm, tác giả, couple.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ssochuz.pages.dev/ssochuz.png">
  <!-- N13: bỏ preconnect Firestore — không còn đọc thẳng Firestore từ máy khách -->
<link rel="stylesheet" href="/cz.css?v=20261030bento5">
</head>
<body class="hpage">

<header id="hdr"></header>

<main>
  <!-- ================= HERO LANDING ================= -->
  <!-- VÁ (2026-10-29): hero là “BỘ BÀI” dựng bởi component dùng chung
       `CZ.heroBanner` (src/cz-hero.js) — 5 bìa xoè thành quạt có tâm, bấm bìa để
       đổi truyện, chữ đọc ở cột trái. Khối rỗng trong HTML là CỐ Ý: component tự
       dựng quạt + điều khiển nên không có markup trùng lặp ở hai nơi. -->
  <section class="hero" id="hero" aria-label="Truyện nổi bật"></section>

  <div class="wrap">
    <!-- ============== TỔNG QUAN · các dải phẳng (30/10/2026) ==============
         Không còn khung bento: bốn mục xếp thẳng hàng, mỗi mục là một dải
         (Đọc tiếp · Mới cập nhật · Ranking · Đáng xem) ngăn bằng một đường tóc.
         Đầu mục dùng chung `.sechead` như Lịch và Thư viện nên cả trang chỉ còn
         MỘT kiểu đầu mục. Bìa khoá tỉ lệ 2/3, huy hiệu dán BÊN TRONG bìa. -->
    <section class="sec fade" id="tong-quan" aria-label="Tổng quan hôm nay">
      <div class="fsec" id="doc-tiep">
        <div class="sechead">
          <h2 id="resumeTitle">Đọc tiếp</h2>
          <span class="bts" id="resumeSub"></span>
          <a class="btm" href="/my-space">My Space ›</a>
        </div>
        <section id="resumeSec" class="home-personal" hidden aria-labelledby="resumeTitle">
          <div id="resumeRail" class="personal-rail" aria-live="polite"></div>
        </section>
        <section id="followUpdatesSec" class="home-personal" hidden aria-labelledby="followUpdatesTitle">
          <div class="bth lt"><h3 class="blb" id="followUpdatesTitle">Theo dõi có chương mới</h3></div>
          <div id="followUpdatesRail" class="personal-rail" aria-live="polite"></div>
        </section>
        <!-- chưa đọc gì: chỗ này thành “bắt đầu từ đâu” (src/cz-home.js dựng) -->
        <div id="starterBox" class="starter" hidden></div>
      </div>

      <div class="fsec" id="moi-cap-nhat">
        <div class="sechead">
          <h2>Mới cập nhật</h2>
          <span class="bts" id="newSub"></span>
          <a class="btm" href="#thu-vien">Cả thư viện ›</a>
        </div>
        <div class="mini" id="newRail"></div>
        <!-- “Hôm nay đọc gì?” — src/cz-dice.js gắn nút vào đây -->
        <span class="dicehost" data-dice></span>
      </div>

      <div class="fsec" id="bxh">
        <div class="sechead tilehead">
          <h2>Ranking</h2>
          <span class="bts" id="rankSub"></span>
          <span class="right">
            <div class="tabs sm ranking-modes" id="rankModes" role="group" aria-label="Hạng mục Ranking">
              <button class="on" data-mode="views" aria-pressed="true">Lượt đọc</button>
              <button data-mode="votes" aria-pressed="false">Lượt thích</button>
            </div>
            <h3 id="rankSummary" class="sr-only">Lượt đọc · Tuần</h3>
            <div class="tabs sm" id="rankTabs" role="group" aria-label="Khoảng thời gian"></div>
          </span>
        </div>
        <div class="rbody">
          <div id="rank" aria-live="polite" aria-atomic="true"></div>
        </div>
      </div>

      <div class="fsec worth-section" id="dang-xem">
        <div class="sechead">
          <h3 class="blb" id="worthTitle">Đáng xem</h3>
        </div>
        <div class="mini3" id="worthRail"></div>
      </div>

    <!-- ============ CHUYỂN THỂ SERIES ============ -->
    <section class="sec fade" id="bien-tap" hidden>
      <div class="sechead">
        <h2>Chuyển thể Series</h2>
      </div>
      <div class="rail" id="editRail"></div>
    </section>

    <!-- ================= LỊCH RA CHƯƠNG ================= -->
    <section class="sec fade" id="lich" aria-labelledby="lichTitle">
      <div class="sechead">
        <h2 id="lichTitle">Lịch ra chương</h2>
        <span class="right"><span class="lcount" id="lichCount"></span></span>
      </div>
      <div id="sched"></div>
    </section>

    <!-- ================= THƯ VIỆN ================= -->
    <!-- Thanh lọc hai tầng (D1): tầng 1 = tìm + Năm + Sắp xếp + kiểu xem,
         tầng 2 = chips tình trạng/nhãn kèm số lượng + số kết quả.
         Tác giả/couple không còn ô chọn riêng (dữ liệu: mỗi couple tối đa 2 bộ)
         — vẫn ghép được qua ?author= / ?couple= khi cần chia sẻ liên kết. -->
    <section class="sec fade" id="thu-vien">
      <div class="sechead">
        <h2>Thư viện</h2>
        <span class="sub" id="libSub"></span>
      </div>
      <div class="libd">
        <div class="libbar">
          <label class="srch"><span data-ic="search"></span>
            <input id="q" type="search" placeholder="Tìm truyện, tác giả, couple…" aria-label="Tìm trong thư viện" autocomplete="off" spellcheck="false">
            <button class="qclr hide" id="qClr" aria-label="Xoá ô tìm kiếm" title="Xoá"><span data-ic="x"></span></button>
            <kbd aria-hidden="true">⌘K</kbd>
          </label>
          <span class="dd"><span class="lb">Năm</span><select id="fYear" aria-label="Lọc theo năm"></select><span class="cv" aria-hidden="true" data-ic="down"></span></span>
          <span class="dd"><span class="lb">Sắp xếp:</span><select id="fSort" aria-label="Sắp xếp"></select><span class="cv" aria-hidden="true" data-ic="down"></span></span>
          <div class="end">
            <div class="seg vseg" id="viewSeg" role="group" aria-label="Kiểu hiển thị">
              <button data-view="grid" class="on" title="Xem dạng lưới" aria-label="Xem dạng lưới"><span data-ic="grid"></span></button>
              <button data-view="list" title="Xem dạng danh sách" aria-label="Xem dạng danh sách"><span data-ic="rows"></span></button>
            </div>
          </div>
        </div>
        <div class="librow">
          <div class="libchips" id="tabs" role="group" aria-label="Lọc theo tình trạng và nhãn"></div>
          <div class="end"><span class="lcount" id="fcount" aria-live="polite" aria-atomic="true"></span></div>
        </div>
        <div class="fpick" id="fpick"></div>
        <div class="grid" id="grid"></div>
        <div class="pager" id="pager"></div>
      </div>
    </section>

  </div>
</main>

<footer id="ftr"></footer>
<button id="toTop" aria-label="Lên đầu trang" title="Lên đầu trang"></button>

<script src="/cz-config.js?v=20261012n"></script>
<script src="/cz-stickers.js?v=20261012n"></script>
<script src="/cz-app.js?v=20261030bento5"></script>
<script src="/cz-auth.js?v=20261012n"></script>
<script src="/cz-personal.js?v=20261013notif1"></script>
<script src="/cz-dice.js?v=20261014feat1"></script>
<script src="/cz-hero.js?v=20261029perf1"></script>
<script src="/cz-home.js?v=20261030bento5"></script>
</body>
</html>
