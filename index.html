<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chuseoz · thư viện truyện chuyển thể</title>
<meta name="description" content="Thư viện truyện chuyển thể: series, phim, couple, bảng xếp hạng, lịch ra chương và trình đọc truyện. Dữ liệu thật từ chuseoz.blogspot.com.">
<meta name="theme-color" content="#0e0c11">
<meta property="og:title" content="chuseoz · thư viện truyện chuyển thể">
<meta property="og:description" content="Đọc truyện chuyển thể: series, phim, couple và lịch ra chương.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0c11'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z' fill='none' stroke='%23ff7d9c' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://blogger.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://pbs.twimg.com">
<link rel="dns-prefetch" href="https://images.justwatch.com">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="stylesheet" href="/cz.css">
</head>
<body class="hpage">
<div id="sprog" aria-hidden="true"><i></i></div>
<header id="hdr"></header>

<main>
  <!-- ================= HERO LANDING ================= -->
  <section class="hero" id="hero" aria-label="Truyện nổi bật">
    <div class="bg" aria-hidden="true"><img id="heroBgA" alt=""><img id="heroBgB" alt=""><span class="tint"></span></div>
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="foot">
      <div class="footin">
        <button class="arrow" id="hPrev" aria-label="Truyện trước"></button>
        <div class="dots" id="hDots" role="tablist" aria-label="Chọn truyện nổi bật"></div>
        <span class="count" id="hCount"></span>
        <span class="grow"></span>
        <div class="strip" id="hStrip"></div>
        <button class="arrow" id="hNext" aria-label="Truyện kế tiếp"></button>
      </div>
      <div class="bar"><i id="heroBar"></i></div>
    </div>
  </section>

  <!-- ================= SỐ LIỆU THẬT ================= -->
  <section class="facts" aria-label="Số liệu thư viện"><div class="in" id="facts"></div></section>

  <div class="wrap">
    <!-- ================= ĐỌC TIẾP ================= -->
    <section class="sec fade" id="doc-tiep" hidden>
      <div class="sechead">
        <h2><span data-ic="play"></span>Đọc tiếp</h2>
        <span class="sub" id="contSub"></span>
        <span class="right"><button class="btn ghost sm" id="contClear">Xoá lịch sử đọc</button></span>
      </div>
      <div class="contcols" id="contRow"></div>
    </section>

    <!-- ================= TỦ TRUYỆN ================= -->
    <section class="sec fade" id="tu-truyen" hidden>
      <div class="sechead">
        <h2><span data-ic="bookmark"></span>Tủ truyện của bạn</h2>
        <span class="sub" id="shelfSub"></span>
        <span class="right"><button class="btn ghost sm" id="shelfClear">Xoá hết</button></span>
      </div>
      <div class="contcols" id="shelfRow"></div>
    </section>

    <!-- ================= MỚI CẬP NHẬT ================= -->
    <section class="sec fade" id="moi-cap-nhat">
      <div class="sechead">
        <h2><span data-ic="sparkle"></span>Mới cập nhật</h2>
        <span class="sub" id="newSub"></span>
        <span class="right"><a class="btn ghost sm" href="/#thu-vien">Xem thư viện<span data-ic="right"></span></a></span>
      </div>
      <div class="rail" id="newRail"></div>
    </section>

    <!-- ================= BXH + LỊCH RA CHƯƠNG ================= -->
    <section class="sec fade" id="bxh">
      <div class="two">
        <div class="panel">
          <div class="sechead">
            <h2><span data-ic="trophy"></span>Bảng xếp hạng</h2>
            <span class="right"><span class="tabs" id="rankTabs" role="tablist"></span></span>
          </div>
          <div id="rank"></div>
          <div class="src" id="rankSrc"><span class="dot"></span><span>đang tải số liệu…</span></div>
        </div>
        <div class="panel" id="lich">
          <div class="sechead">
            <h2><span data-ic="calendar"></span>Lịch ra chương</h2>
            <span class="right"><span class="sub" id="schedSub">hàng tuần</span></span>
          </div>
          <div id="sched"></div>
          <div class="src" id="schedSrc"><span class="dot"></span><span>đang tải…</span></div>
        </div>
      </div>
    </section>

    <!-- ================= CHUYỂN THỂ ================= -->
    <section class="sec fade" id="chuyen-the">
      <div class="sechead">
        <h2><span data-ic="film"></span>Phân cấp chuyển thể</h2>
        <span class="sub" id="adSub">—</span>
      </div>
      <div class="lbox">
        <div class="ltabs" id="ltabs" role="tablist"></div>
        <div class="ld" id="ldesc" style="color:var(--mut);font-size:13.5px;margin-bottom:12px">—</div>
        <div id="lcontent"></div>
      </div>
    </section>

    <!-- ================= THƯ VIỆN ================= -->
    <section class="sec fade" id="thu-vien">
      <div class="sechead">
        <h2><span data-ic="library"></span>Thư viện truyện</h2>
        <span class="sub">lọc theo tình trạng · năm · tác giả · couple</span>
      </div>
      <div class="fbox">
        <div class="row1">
          <label class="search"><span data-ic="search"></span>
            <input id="q" placeholder="Tìm truyện, tác giả, couple…" autocomplete="off" spellcheck="false">
          </label>
          <select class="sel" id="fStatus" aria-label="Tình trạng"></select>
          <select class="sel" id="fYear" aria-label="Năm"></select>
          <select class="sel" id="fAuthor" aria-label="Tác giả"></select>
          <select class="sel" id="fCouple" aria-label="Couple"></select>
          <select class="sel" id="fSort" aria-label="Sắp xếp"></select>
          <div class="seg" id="viewSeg" role="group" aria-label="Kiểu hiển thị">
            <button data-view="grid" class="on" title="Xem dạng lưới"><span data-ic="grid"></span></button>
            <button data-view="list" title="Xem dạng danh sách"><span data-ic="rows"></span></button>
          </div>
        </div>
        <div class="row1" style="margin-bottom:0">
          <div class="tabs" id="tabs" role="tablist"></div>
        </div>
        <div class="fpick mt" id="fpick"></div>
        <div class="fcount mt" id="fcount"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
</main>

<footer id="ftr"></footer>
<button id="toTop" aria-label="Lên đầu trang" title="Lên đầu trang"></button>

<script src="/cz-config.js"></script>
<script src="/cz-app.js"></script>
<script src="/cz-home.js"></script>
</body>
</html>
