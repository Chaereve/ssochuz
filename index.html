<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chuseoz · thư viện truyện</title>
<meta name="description" content="Thư viện truyện chọn lọc: đọc trong máy, lưu tiến độ, lọc theo năm, tác giả, couple và lịch ra chương.">
<meta name="theme-color" content="#faf8f4">
<meta property="og:title" content="chuseoz · thư viện truyện">
<meta property="og:description" content="Thư viện truyện chọn lọc: đọc trong máy, lưu tiến độ, lọc theo năm, tác giả, couple.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23faf8f4'/%3E%3Cpath d='M10 8h9a3 3 0 0 1 3 3v13H13a3 3 0 0 1-3-3z' fill='none' stroke='%23a63a52' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="stylesheet" href="/cz.css">
<script>/* chống nháy nền: áp tông màu đã lưu trước khi vẽ */try{var t=localStorage.getItem('chuseoz-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body class="hpage">
<div id="sprog" aria-hidden="true"><i></i></div>
<header id="hdr"></header>

<main>
  <!-- ================= HERO LANDING ================= -->
  <section class="hero" id="hero" aria-label="Truyện nổi bật">
    <div class="bg" id="heroBg" aria-hidden="true"><i></i><i></i></div>
    <div class="stage" id="stage" aria-live="polite"></div>
    <div class="foot">
      <div class="footin">
        <button class="arrow" id="hPrev" aria-label="Truyện trước"></button>
        <div class="dots" id="hDots" role="tablist" aria-label="Chọn truyện nổi bật"></div>
        <span class="count" id="hCount"></span>
        <div class="strip" id="hStrip"></div>
        <button class="arrow" id="hNext" aria-label="Truyện kế tiếp"></button>
      </div>
      <div class="bar"><i id="heroBar"></i></div>
    </div>
  </section>

  <!-- ================= SỐ LIỆU THẬT ================= -->
  <section class="facts" aria-label="Số liệu thư viện"><div class="in" id="facts"></div></section>

  <div class="wrap">
    <!-- ================= BÀN ĐỌC (đang đọc dở · tủ truyện) ================= -->
    <section class="sec" id="ban-doc" hidden>
      <div class="sechead">
        <h2>Bàn đọc của bạn</h2>
        <span class="sub" id="banSub"></span>
        <span class="right">
          <span class="tabs sm" id="banTabs" role="tablist">
            <button class="tab on" data-ban="doc" role="tab">Đang đọc dở<span class="ct" id="banDocCount"></span></button>
            <button class="tab" data-ban="shelf" role="tab">Tủ truyện<span class="ct" id="banShelfCount"></span></button>
          </span>
          <button class="btn ghost sm" id="banClear">Xoá</button>
        </span>
      </div>
      <div class="contcols" id="contRow"></div>
      <div class="contcols hide" id="shelfRow"></div>
    </section>

    <!-- ================= MỚI CẬP NHẬT ================= -->
    <section class="sec fade" id="moi-cap-nhat">
      <div class="sechead">
        <h2>Mới cập nhật</h2>
        <span class="sub" id="newSub"></span>
        <span class="right"><a class="btn ghost sm" href="/#thu-vien" title="Xem cả thư viện">Xem tất cả</a></span>
      </div>
      <div class="rail" id="newRail"></div>
    </section>

    <!-- ================= XẾP HẠNG ================= -->
    <section class="sec fade" id="bxh">
      <div class="sechead">
        <h2>Xếp hạng</h2>
        <span class="sub" id="rankSub"></span>
        <span class="right"><span class="tabs sm" id="rankTabs" role="tablist"></span></span>
      </div>
      <div id="rank"></div>
    </section>

    <!-- ================= GÓC BIÊN TẬP VIÊN (Editor's Choice) ================= -->
    <section class="sec fade" id="bien-tap" hidden>
      <div class="sechead">
        <h2>Góc biên tập viên</h2>
        <span class="sub" id="editSub"></span>
        <span class="right"><a class="btn ghost sm" href="/guide" title="Vì sao chọn?"><span data-ic="info"></span> Vì sao?</a></span>
      </div>
      <div class="rail" id="editRail"></div>
    </section>

    <!-- ================= ỦNG HỘ (Donation placeholder) ================= -->
    <section class="sec fade" id="ung-ho" hidden>
      <div class="card2" id="donBox"></div>
    </section>

    <!-- ================= LỊCH RA CHƯƠNG ================= -->
    <section class="sec fade" id="lich">
      <div class="sechead">
        <h2>Lịch ra chương</h2>
        <span class="sub" id="schedSub"></span>
      </div>
      <div id="sched"></div>
    </section>

    <!-- ================= THƯ VIỆN ================= -->
    <section class="sec fade" id="thu-vien">
      <div class="sechead">
        <h2>Thư viện truyện</h2>
      </div>
      <div class="fbox">
        <div class="row1">
          <label class="search"><span data-ic="search"></span>
            <input id="q" placeholder="Tìm truyện, tác giả, couple…" autocomplete="off" spellcheck="false">
            <button class="qclr hide" id="qClr" aria-label="Xoá ô tìm kiếm" title="Xoá"><span data-ic="x"></span></button>
          </label>
          <select class="sel" id="fYear" aria-label="Năm"></select>
          <select class="sel" id="fAuthor" aria-label="Tác giả"></select>
          <select class="sel" id="fCouple" aria-label="Couple"></select>
          <select class="sel" id="fSort" aria-label="Sắp xếp"></select>
          <div class="seg" id="viewSeg" role="group" aria-label="Kiểu hiển thị">
            <button data-view="grid" class="on" title="Xem dạng lưới"><span data-ic="grid"></span></button>
            <button data-view="list" title="Xem dạng danh sách"><span data-ic="rows"></span></button>
          </div>
        </div>
        <div class="fgroups">
          <div class="fgroup">
            <span class="flab">Tình trạng</span>
            <div class="tabs" id="tabs" role="tablist"></div>
          </div>
          <div class="fgroup">
            <span class="flab">Nhãn</span>
            <div class="tabs" id="ageTabs" role="group">
              <button class="tab" data-age="18" aria-pressed="false">18+</button>
            </div>
          </div>
        </div>
        <div class="fpick" id="fpick"></div>
        <div class="fcount" id="fcount"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </section>

  </div>
</main>

<footer id="ftr"></footer>
<button id="toTop" aria-label="Lên đầu trang" title="Lên đầu trang"></button>

<script src="/cz-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/cz-app.js"></script>
<script src="/cz-auth.js"></script>
<script src="/cz-home.js"></script>
</body>
</html>
