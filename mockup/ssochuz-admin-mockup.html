<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ssochuz library · Admin mockup · DỮ LIỆU MẪU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PHASE 2 · HỆ THỐNG THIẾT KẾ
   Mọi màu dùng trong mockup được khai báo một lần tại :root.
   Tên token đúng yêu cầu để thay bằng token thật khi chuyển code.
   ============================================================ */
:root{
  --bg:#14110E;          /* nền chính, tối ấm */
  --bg2:#100D0B;         /* sidebar sâu hơn một bậc */
  --surf:#1C1814;        /* mặt thẻ */
  --surf2:#241F19;       /* mặt nâng / input / thead */
  --surf3:#2E2720;       /* hover, chip, cột biểu đồ */
  --txt:#F2ECE4;         /* chữ chính */
  --mut:#B8AC9E;         /* chữ phụ */
  --dim:#A79B8D;         /* nhãn nhỏ, vẫn >= 4.5:1 trên mọi mặt */
  --acc:#F291B4;         /* HỒNG — giá trị tạm, chỉ dùng có chủ đích */
  --acc-soft:#3A2230;    /* nền hồng nhạt cho tab chọn */
  --bd:#332C25;          /* vạch tóc */
  --bd2:#4A4036;         /* viền điều khiển */
  --ok:#86D9AA;
  --warn:#EFC281;
  --bad:#FF9A97;
  --ring:#F7BBD1;        /* focus ring */

  /* Màu phái sinh — vẫn là biến, không có literal rải rác */
  --ink:#1B1114;          /* chữ trên nền --acc */
  --ok-bg:#173326;  --warn-bg:#3A2D18;  --bad-bg:#3C2022;
  --info:#9CC4F5;   --info-bg:#1C2B3C;
  --violet:#C6AEFF; --violet-bg:#2A2340;
  --slate:#C3B9AE;  --slate-bg:#2A2621;
  --neutral-bg:#2B251F;
  --cover-1:#3A2D3C; --cover-2:#2B3A38; --cover-3:#3A3227;
  --cover-4:#33273A; --cover-5:#2D323F; --cover-6:#3B2B2B;
  --scrim:#0A0807D9;

  /* Quy mô: lưới 8px, bo 6/8/12px, điều khiển 36–42px */
  --side:248px; --top:60px; --h:38px; --h-lg:42px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px;
  --r6:6px; --r8:8px; --r12:12px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --head:'Fraunces','Iowan Old Style',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:400 14px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-family:var(--head);font-weight:600;line-height:1.2;letter-spacing:-.012em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r6)}
::selection{background:var(--acc);color:var(--ink)}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;padding:10px 14px;border:1px solid var(--acc);border-radius:var(--r6);background:var(--surf)}
.skip:focus{left:12px}
.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.ic.s{width:18px;height:18px}
.ic.xs{width:15px;height:15px}
.mono{font-family:var(--mono)}
.lb{font:600 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.eyebrow{font:600 10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.mut{color:var(--mut)} .dim{color:var(--dim)}
.sm{font-size:12.5px} .xs{font-size:11.5px}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:var(--s1);min-width:0}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.hr{height:1px;background:var(--bd);border:0;margin:var(--s2) 0}
.mt{margin-top:var(--s2)} .mb{margin-bottom:var(--s2)}
.nowrap{white-space:nowrap}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}

/* ---------- Khung ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.app.collapsed{--side:76px}
.frame{grid-column:2;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.sidebar{position:sticky;top:0;grid-column:1;grid-row:1;z-index:45;height:100vh;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;height:var(--top);flex:none;padding:0 14px 0 18px;border-bottom:1px solid var(--bd)}
.brand .dot{width:9px;height:9px;flex:none;border:1px solid var(--acc);border-radius:99px}
.brand .logo{font:600 18px/1 var(--head);letter-spacing:-.02em}
.brand .logo i{font:600 10px/1 var(--mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:6px}
.side-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 10px 18px;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group+.nav-group{margin-top:18px}
.nav-group>.lb{padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:var(--r6);color:var(--mut);font:500 13px/1 var(--font);text-align:left;position:relative;white-space:nowrap}
.nav-item:hover{background:var(--surf2);color:var(--txt)}
.nav-item .ic{width:18px;height:18px}
.nav-item.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}
.nav-item .ct{margin-left:auto;min-width:20px;height:18px;padding:0 5px;border-radius:99px;background:var(--surf3);color:var(--mut);font:600 10px/18px var(--mono);text-align:center}
.nav-item.on .ct,.nav-item .ct.hot{background:var(--acc);color:var(--ink)}
.nav-item.gated{color:var(--dim)}
.nav-item>.tx{overflow:hidden;text-overflow:ellipsis}
.app.collapsed .brand{padding:0;justify-content:center}
.app.collapsed .brand .tx,.app.collapsed .brand .logo i,.app.collapsed .nav-group>.lb,.app.collapsed .nav-item>.tx,.app.collapsed .nav-item>.ct,.app.collapsed .side-foot{display:none}
.app.collapsed .brand .logo{font-size:0}
.app.collapsed .nav-item{justify-content:center;padding:0}
.app.collapsed .nav-group+.nav-group{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.side-foot{flex:none;border-top:1px solid var(--bd);padding:12px 14px 16px;display:grid;gap:8px}
.side-foot .note{font-size:11.5px;line-height:1.5;color:var(--dim)}
.side-foot button{font:500 12px/1.4 var(--mono);color:var(--mut);text-align:left;text-decoration:underline;text-underline-offset:3px}
.side-foot button:hover{color:var(--acc)}
.scrim{position:fixed;inset:0;z-index:42;background:var(--scrim);display:none}
.app.drawer .scrim{display:block}

/* ---------- Thanh trên ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:var(--top);padding:0 var(--s3);background:var(--bg);border-bottom:1px solid var(--bd)}
.burger{display:none;width:var(--h);height:var(--h);align-items:center;justify-content:center;border:1px solid var(--bd2);border-radius:var(--r6);color:var(--mut)}
.search{position:relative;flex:0 1 300px;min-width:150px}
.search>.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim);pointer-events:none}
.search .inp{padding-left:34px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:20px;padding:0 6px;border:1px solid var(--bd2);border-radius:4px;background:var(--surf2);color:var(--mut);font:600 10px/18px var(--mono);pointer-events:none}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;max-height:300px;overflow:auto;padding:6px;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.suggest button{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border-radius:var(--r6);color:var(--txt);font-size:13px;text-align:left}
.suggest button:hover,.suggest button.cur{background:var(--surf2)}
.suggest .k{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--dim)}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:nowrap}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--h);padding:0 10px;border:1px solid transparent;border-radius:var(--r6);color:var(--mut);font:600 12.5px/1 var(--font);white-space:nowrap}
.tool:hover{background:var(--surf2);color:var(--txt)}
.tool.icon{width:var(--h);padding:0;position:relative}
.tool .ic{width:17px;height:17px}
.tool .ndot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:var(--ink);font:700 10px/16px var(--mono);text-align:center}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--bd2);border-radius:99px;background:var(--surf);font:600 11px/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:99px;background:currentColor;flex:none}
.chip.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.chip.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.chip.t-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.chip.t-info{color:var(--info);background:var(--info-bg);border-color:var(--info)}
.chip.t-slate{color:var(--slate);background:var(--slate-bg);border-color:var(--slate)}
.quota{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--bd2);border-radius:99px;background:var(--surf);font:600 11px/1 var(--mono);white-space:nowrap}
.quota b{font-weight:600}
.quota.t-ok{color:var(--ok);border-color:var(--ok)} .quota.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.quota.t-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.quota.t-blocked{color:var(--ink);background:var(--bad);border-color:var(--bad)}
.popover{position:absolute;right:0;top:calc(100% + 6px);z-index:65;min-width:260px;padding:6px;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.popover .ph{padding:8px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.popover button{display:block;width:100%;min-height:38px;padding:8px 10px;border-radius:var(--r6);color:var(--txt);font-size:13px;text-align:left}
.popover button:hover{background:var(--surf2)}
.popover .row-item{display:block;padding:9px 10px;border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--mut)}
.popover .row-item b{display:block;color:var(--txt);font-weight:600}
.banner{display:flex;align-items:center;gap:10px;padding:10px var(--s3);border-bottom:1px solid var(--warn);background:var(--warn-bg);color:var(--txt);font-size:13px}
.banner.danger{border-bottom-color:var(--bad);background:var(--bad-bg)}
.banner .ic{width:18px;height:18px;color:var(--warn)} .banner.danger .ic{color:var(--bad)}

/* ---------- Điều khiển ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 14px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);color:var(--txt);font:600 13px/1 var(--font);white-space:nowrap;transition:background-color .15s ease}
.btn:hover{background:var(--surf2)}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.pri:hover{background:var(--ring);border-color:var(--ring)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--surf2);color:var(--txt)}
.btn.danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:var(--ink)}
.btn.danger.pri{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.btn.icon{width:var(--h);padding:0}
.btn.sm{min-height:36px;padding:0 10px;font-size:12px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{background:var(--surf)}
.inp{width:100%;height:var(--h);padding:0 12px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);color:var(--txt);outline:none;font-size:13px}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;line-height:1.6;resize:vertical}
.inp::placeholder{color:var(--dim);opacity:1}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.inp.invalid{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
select.inp{appearance:none;padding-right:32px;cursor:pointer}
.sel{position:relative;min-width:0}
.sel::after{content:"";position:absolute;right:13px;top:44%;width:7px;height:7px;border-right:1.75px solid var(--mut);border-bottom:1.75px solid var(--mut);transform:rotate(45deg);pointer-events:none}
.field{display:grid;gap:6px;min-width:0}
.field>label{font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.field .err{font-size:11.5px;color:var(--bad);min-height:0}
.field .hint{font-size:11.5px;color:var(--dim)}
.chk{display:inline-flex;align-items:center;gap:9px;min-height:38px;color:var(--mut);font-size:13px;cursor:pointer;position:relative}
.chk input,.sw input{position:absolute;opacity:0;width:18px;height:18px;margin:0;cursor:pointer}
.chk .box{width:18px;height:18px;flex:none;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);display:grid;place-items:center}
.chk input:checked+.box{background:var(--acc);border-color:var(--acc)}
.chk input:checked+.box::after{content:"";width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.chk input:focus-visible+.box,.sw input:focus-visible+.track{outline:2px solid var(--ring);outline-offset:2px}
.sw{display:inline-flex;align-items:center;gap:9px;min-height:38px;color:var(--mut);font-size:13px;cursor:pointer;position:relative}
.sw .track{width:36px;height:20px;flex:none;border:1px solid var(--bd2);border-radius:99px;background:var(--surf2);position:relative;transition:background-color .15s ease}
.sw .track::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:99px;background:var(--mut);transition:transform .15s ease}
.sw input:checked+.track{background:var(--acc);border-color:var(--acc)}
.sw input:checked+.track::after{transform:translateX(16px);background:var(--ink)}
.tabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf);max-width:100%;overflow:auto}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:var(--r6);color:var(--mut);font:600 12.5px/1 var(--font);white-space:nowrap}
.tab:hover{background:var(--surf2);color:var(--txt)}
.tab.on{background:var(--acc-soft);color:var(--acc)}
.pg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg button{min-width:36px;height:36px;padding:0 8px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);color:var(--mut);font:600 12px/1 var(--mono)}
.pg button:hover{background:var(--surf2);color:var(--txt)}
.pg button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.pg button:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;width:auto;max-width:100%;height:22px;padding:0 8px;border:1px solid var(--bd2);border-radius:var(--r6);font:600 10.5px/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.badge .ic{width:12px;height:12px}
.tone-ok{background:var(--ok-bg);color:var(--ok)}
.tone-warn{background:var(--warn-bg);color:var(--warn)}
.tone-bad{background:var(--bad-bg);color:var(--bad)}
.tone-info{background:var(--info-bg);color:var(--info)}
.tone-violet{background:var(--violet-bg);color:var(--violet)}
.tone-slate{background:var(--slate-bg);color:var(--slate)}
.tone-neutral{background:var(--neutral-bg);color:var(--mut)}
.tone-acc{background:var(--acc-soft);color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px solid var(--bd);border-radius:99px;background:var(--surf2);color:var(--mut);font-size:11px;white-space:nowrap}
.badges{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;vertical-align:middle;max-width:100%}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:70;white-space:nowrap;padding:6px 9px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf3);color:var(--txt);font:500 11px/1.3 var(--mono);pointer-events:none}
.file{display:flex;align-items:center;gap:10px;min-height:var(--h);padding:0 12px;border:1px dashed var(--bd2);border-radius:var(--r6);background:var(--surf2);color:var(--mut);font-size:12.5px}
.file input{width:100%;font-size:12px;color:var(--mut)}
.file input::file-selector-button{height:28px;margin-right:10px;padding:0 10px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf3);color:var(--txt);font:600 11px/1 var(--mono);cursor:pointer}

/* ---------- Nội dung trang ---------- */
.view{width:100%;max-width:1480px;padding:var(--s3) var(--s4) 120px;min-width:0}
.pagehead{display:flex;align-items:flex-start;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.pagehead .hh{min-width:0;flex:1 1 320px}
.pagehead .eyebrow{font:600 10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.pagehead h2{font-size:28px}
.pagehead .desc{color:var(--mut);font-size:13.5px;margin-top:6px;max-width:76ch}
.pagehead .meta{font:500 10.5px/1.5 var(--mono);letter-spacing:.04em;color:var(--dim);margin-top:8px}
.pagehead .actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.sample-note{margin-top:var(--s4);padding-top:12px;border-top:1px solid var(--bd);font:500 11px/1.6 var(--mono);letter-spacing:.03em;color:var(--dim)}
.card{border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);min-width:0}
.card-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.card-hd h3{font-size:17px}
.card-hd .right{margin-left:auto;font:500 11px/1.4 var(--mono);color:var(--dim)}
.card-bd{padding:18px}
.card-bd.tight{padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--s2);align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);align-items:start}
.stack{display:grid;gap:var(--s2);min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s2);align-items:start}
.section-title{font:600 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* Dải số liệu: không bọc card */
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:var(--s3)}
.metric{padding:18px 16px;border-right:1px solid var(--bd);min-width:0}
.metric:last-child{border-right:0}
.metric .n{font:600 30px/1.1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric .k{display:block;margin-top:8px;font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.metric .sub{display:block;margin-top:3px;font-size:11px;color:var(--dim)}
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.todo button{display:grid;gap:6px;align-content:center;padding:14px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf2);text-align:left;min-height:96px}
.todo button:hover{border-color:var(--acc);background:var(--acc-soft)}
.todo .n{font:600 26px/1 var(--head)}
.todo .k{font-size:12.5px;color:var(--mut)}
.list{display:grid;gap:0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);min-width:0}
.list-item:last-child{border-bottom:0}
.list-item .t{flex:1 1 auto;min-width:0}
.list-item .t b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .t>span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.sysrow:last-child{border-bottom:0}
.sysrow .dot{width:8px;height:8px;border-radius:99px;flex:none;margin-top:6px;background:var(--ok)}
.sysrow .dot.warn{background:var(--warn)} .sysrow .dot.bad{background:var(--bad)}
.sysrow b{display:block;font-size:13px;font-weight:600}
.sysrow span{display:block;font-size:12px;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:5px;height:142px;padding-top:10px}
.chart .bar{flex:1 1 0;min-width:6px;min-height:6px;border-radius:var(--r6) var(--r6) 0 0;background:var(--surf3)}
.chart .bar.last{background:var(--acc)}
.chart-labels{display:flex;justify-content:space-between;margin-top:8px;font:500 10px/1 var(--mono);color:var(--dim)}
.barline{display:grid;grid-template-columns:minmax(0,1fr) 56px 44px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.barline:last-child{border-bottom:0}
.barline .track{height:6px;border-radius:99px;background:var(--surf3);overflow:hidden}
.barline .track i{display:block;height:100%;background:var(--acc);border-radius:99px}
.barline .v{text-align:right;font:600 11px/1 var(--mono);color:var(--mut)}

/* Bảng */
.table-wrap{overflow:auto;max-height:540px;border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);min-width:0}
table{width:100%;min-width:820px;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;z-index:3;padding:11px 14px;background:var(--surf2);border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--bd);vertical-align:middle;color:var(--txt)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surf2)}
td .sub{display:block;font-size:11.5px;color:var(--dim)}
td .strong{font-weight:600}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.cover{width:42px;height:58px;flex:none;border:1px solid var(--bd2);border-radius:var(--r6);display:grid;place-items:center;text-align:center;padding:4px;color:var(--txt);font:600 11px/1.2 var(--head);overflow:hidden}
.cover.lg{width:76px;height:104px;font-size:14px}
.cover.sq{width:72px;height:72px}
.cv-1{background:var(--cover-1)} .cv-2{background:var(--cover-2)} .cv-3{background:var(--cover-3)}
.cv-4{background:var(--cover-4)} .cv-5{background:var(--cover-5)} .cv-6{background:var(--cover-6)}
.cv-miss{background:var(--neutral-bg);color:var(--dim);border-style:dashed;font-family:var(--mono);font-size:9px}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border:1px solid var(--acc);border-radius:var(--r8);background:var(--acc-soft);color:var(--txt)}
.bulkbar .n{font:700 12px/1 var(--mono);color:var(--acc)}
.bulkbar .sel{min-width:170px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{flex:1 1 220px;max-width:340px}
.toolbar .sel{flex:0 1 180px}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.pager .pg{margin-left:auto}

/* Trạng thái rỗng / tải / lỗi */
.state{min-height:260px;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:var(--s4);border:1px dashed var(--bd2);border-radius:var(--r12);background:var(--surf)}
.state .ic{width:32px;height:32px;color:var(--dim)}
.state.bad .ic{color:var(--bad)}
.state h3{font-size:19px}
.state p{color:var(--mut);font-size:13px;max-width:52ch}
.sk{background:var(--surf2);border-radius:var(--r6);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
.sk-line{height:12px;margin-bottom:10px}
.sk-card{border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);padding:18px}
.sk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.sk-block{height:104px}
.state-note{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--r6);background:var(--surf2);font:500 11px/1.5 var(--mono);color:var(--dim)}

/* Modal / toast / command palette */
.modal-scrim{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.modal{width:min(520px,100%);max-height:min(88vh,780px);overflow:auto;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.modal.wide{width:min(900px,100%)}
.modal-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.modal-hd h3{font-size:19px;flex:1 1 auto}
.modal-bd{padding:20px;display:grid;gap:14px}
.modal-ft{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd);flex-wrap:wrap}
.modal .warnbox{display:flex;gap:10px;padding:12px;border:1px solid var(--bad);border-radius:var(--r8);background:var(--bad-bg);font-size:12.5px;color:var(--txt)}
.modal .warnbox .ic{width:18px;height:18px;color:var(--bad);flex:none}
.confirm-phrase{font:700 12px/1.5 var(--mono);color:var(--bad);background:var(--surf2);padding:6px 9px;border-radius:var(--r6);display:inline-block;word-break:break-all}
#toasts{position:fixed;left:16px;bottom:16px;z-index:140;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--bd2);border-left:3px solid var(--ok);border-radius:var(--r8);background:var(--surf2);color:var(--txt);font-size:12.5px;line-height:1.5}
.toast .ic{width:17px;height:17px;color:var(--ok);flex:none}
.toast.t-bad{border-left-color:var(--bad)} .toast.t-bad .ic{color:var(--bad)}
.toast.t-warn{border-left-color:var(--warn)} .toast.t-warn .ic{color:var(--warn)}
.toast.t-info{border-left-color:var(--info)} .toast.t-info .ic{color:var(--info)}
.palette{position:fixed;inset:0;z-index:120;display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px;background:var(--scrim)}
.palette-box{width:min(560px,100%);border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf);overflow:hidden}
.palette-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.palette-top .ic{width:18px;height:18px;color:var(--dim)}
.palette-top input{flex:1 1 auto;border:0;background:transparent;outline:none;font-size:14px}
.palette-list{max-height:320px;overflow:auto;padding:6px}
.palette-list button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border-radius:var(--r6);text-align:left;font-size:13px}
.palette-list button:hover,.palette-list button.cur{background:var(--surf2)}
.palette-list .k{margin-left:auto;font:600 10px/1 var(--mono);color:var(--dim)}
.palette-ft{padding:8px 14px;border-top:1px solid var(--bd);font:500 10.5px/1.4 var(--mono);color:var(--dim)}

/* Bảng điều khiển demo + thư viện component */
.demo-toggle{position:fixed;right:16px;bottom:16px;z-index:95;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid var(--acc);border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.demo-toggle:hover{background:var(--acc);color:var(--ink)}
.demo-toggle .ic{width:19px;height:19px}
.demo{position:fixed;right:16px;bottom:66px;z-index:96;width:min(336px,calc(100vw - 32px));max-height:min(78vh,760px);overflow:auto;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.demo-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--surf);z-index:2}
.demo-hd h3{font:700 11px/1.3 var(--mono);letter-spacing:.08em;color:var(--acc);flex:1 1 auto}
.demo-bd{padding:14px;display:grid;gap:12px}
.demo-bd .field>label{font-size:9.5px}
.demo .dev{border-top:1px solid var(--bd);padding-top:12px}
.demo .dev h4{font:700 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.spec{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spec .sep{width:100%;height:1px;background:var(--bd)}
.demo .note{font-size:11px;color:var(--dim);line-height:1.5}

/* Tài liệu bàn giao trong modal */
.docs h4{font-size:15px;margin:18px 0 8px}
.docs h4:first-child{margin-top:0}
.docs p,.docs li{font-size:12.5px;color:var(--mut);line-height:1.65}
.docs ul{list-style:disc;padding-left:18px;display:grid;gap:4px}
.docs table{width:100%;min-width:0;font-size:11.5px;margin:8px 0}
.docs th,.docs td{padding:7px 9px;border:1px solid var(--bd);text-align:left;vertical-align:top}
.docs th{color:var(--txt);font:600 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--surf2)}
.docs td{color:var(--mut)}
.docs .token{font:600 11px/1.5 var(--mono);color:var(--txt)}
.docs .swatch{display:inline-block;width:12px;height:12px;border:1px solid var(--bd2);border-radius:3px;margin-right:6px;vertical-align:-2px}

/* Đăng nhập / nối Worker */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.gate-brand{display:flex;flex-direction:column;gap:var(--s4);padding:48px;background:var(--bg2);border-right:1px solid var(--bd)}
.gate-brand .logo{font:600 26px/1 var(--head)}
.gate-brand .logo .dot{display:inline-block;width:10px;height:10px;border:1px solid var(--acc);border-radius:99px;margin-right:10px}
.gate-brand h1{font-size:36px;max-width:12ch}
.gate-brand p{color:var(--mut);max-width:44ch;font-size:14px}
.gate-features{display:grid;gap:12px}
.gate-features li{display:grid;gap:3px;padding-left:14px;border-left:2px solid var(--bd2)}
.gate-features b{font-size:13px} .gate-features span{font-size:12px;color:var(--mut)}
.gate-panel{display:grid;place-items:center;padding:48px 24px;min-width:0}
.gate-card{width:min(430px,100%);border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);padding:28px;display:grid;gap:16px}
.gate-card h2{font-size:24px}
.gate-card .sep{display:flex;align-items:center;gap:10px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.gate-card .sep::before,.gate-card .sep::after{content:"";flex:1 1 auto;height:1px;background:var(--bd)}
.gate-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gate-foot{font:500 10.5px/1.6 var(--mono);color:var(--dim);border-top:1px solid var(--bd);padding-top:12px}

/* ---------- Responsive: drawer 360px, không tràn ngang ---------- */
@media (max-width:1100px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric:nth-child(3){border-right:0}
  .metric:nth-child(-n+3){border-bottom:1px solid var(--bd)}
  .view{padding:var(--s3) var(--s2) 120px}
  .topbar{padding:0 var(--s2)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .frame{grid-column:1}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(360px,100vw);transform:translateX(-101%);transition:transform .2s ease;z-index:46}
  .app.drawer .sidebar{transform:none}
  .app.drawer .scrim{display:block}
  .scrim{display:none}
  .burger{display:inline-flex}
  .app.collapsed{--side:76px}
  .app.collapsed .brand{justify-content:flex-start;padding:0 14px}
  .app.collapsed .brand .logo{font-size:18px}
  .app.collapsed .brand .tx,.app.collapsed .brand .logo i,.app.collapsed .nav-group>.lb,.app.collapsed .nav-item>.tx,.app.collapsed .side-foot{display:initial}
  .app.collapsed .nav-item{justify-content:flex-start;padding:0 10px}
  .app.collapsed .nav-group+.nav-group{margin-top:18px;padding-top:0;border-top:0}
  .app.collapsed .side-foot{display:grid}
  .topbar{flex-wrap:wrap;row-gap:8px;padding:8px var(--s2);min-height:0}
  .topbar .search{order:5;flex:1 1 100%;max-width:none}
  .tools{margin-left:auto}
  .tools .lbl{display:none}
  .gate{grid-template-columns:minmax(0,1fr)}
  .gate-brand{display:none}
}

body.force-drawer .sidebar{position:fixed;inset:0 auto 0 0;width:360px;max-width:100vw;transform:none;z-index:47;display:flex}

body.force-drawer .app.collapsed .brand .tx,body.force-drawer .app.collapsed .brand .logo i,body.force-drawer .app.collapsed .nav-group>.lb,body.force-drawer .app.collapsed .nav-item>.tx,body.force-drawer .app.collapsed .side-foot{display:initial}
body.force-drawer .app.collapsed .nav-item{justify-content:flex-start;padding:0 10px}

@media (max-width:600px){
  :root{--h:44px;--h-lg:44px;--top:56px}
  .btn{min-height:44px;padding:0 14px} .btn.sm{min-height:44px}
  .btn.icon{width:44px}
  .inp,select.inp{height:44px} .tool,.tool.icon{height:44px;width:44px}

  .view{padding:var(--s2) 14px 120px}
  .pagehead{gap:12px;margin-bottom:18px}
  .pagehead h2{font-size:24px}
  .pagehead .actions{width:100%;margin-left:0;justify-content:flex-start}
  .pagehead .actions .btn{flex:1 1 auto}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{padding:12px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
  .metric:nth-child(2n){border-right:0}
  .metric:nth-child(3){border-right:1px solid var(--bd)}
  .metric:nth-child(5){border-bottom:0}
  .metric .n{font-size:24px}
  .grid3,.todo,.sk-grid{grid-template-columns:minmax(0,1fr)}
  .card-hd,.card-bd{padding:14px}
  .chart{height:112px;gap:3px}

  .table-wrap{max-height:none}
  .toolbar .search,.toolbar .sel{max-width:none;flex:1 1 100%}

  .topbar .tools{flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
  .topbar .chip,.topbar .quota{max-width:132px;overflow:hidden;text-overflow:ellipsis}
  .topbar>.grow{display:none}

}

<body>
<a class="skip" href="#view">Bỏ qua điều hướng</a>

<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Điều hướng chính"></aside>
  <div id="scrim" class="scrim" data-act="close-drawer" aria-hidden="true"></div>
  <div class="frame">
    <header id="topbar" class="topbar"></header>
    <div id="quotaBanner" aria-live="polite"></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<section id="login" class="gate" aria-label="Đăng nhập quản trị" hidden></section>

<div id="palette" class="palette" hidden></div>
<button id="demoToggle" class="demo-toggle" data-act="demo" aria-expanded="false" aria-controls="demo" aria-label="Bảng điều khiển demo" data-tip="Bảng điều khiển demo"><span class="ic s" data-icon="gear"></span></button>
<aside id="demo" class="demo" hidden aria-label="Bảng điều khiển demo"></aside>

function hydrateIcons(root){
  (root||document).querySelectorAll('[data-icon]').forEach(function(el){
    var cls=String(el.className||'').replace(/\bic\b/g,'').trim();
    el.outerHTML=icon(el.dataset.icon,cls);
  });
}

function badge(text,tone,ic){return '<span class="badge '+(tone||'tone-neutral')+'">'+(ic?icon(ic,'xs'):'')+esc(text)+'</span>';}
function bookBadges(b){
  /* Thứ tự cố định: Tình trạng → Xuất bản → Đã khóa → 18+ */
  var out = badge(b.st, COMPLETION[b.st]||'tone-neutral');
  out += badge(PUB[b.pub][0], PUB[b.pub][1]);
  if(b.lock) out += badge('Đã khóa','tone-warn','lock');
  if(b.adult) out += badge('18+','tone-bad');
  return '<span class="badges">'+out+'</span>';
}

function field(label,id,val,opts){
  opts=opts||{};
  var err = state.errors[id] ? '<span class="err" id="err-'+id+'">'+esc(state.errors[id])+'</span>' : '<span class="err" id="err-'+id+'"></span>';
  var hint = opts.hint ? '<span class="hint">'+esc(opts.hint)+'</span>' : '';
  var ctl;
  if(opts.type==='textarea') ctl='<textarea class="inp'+(state.errors[id]?' invalid':'')+'" id="'+id+'" data-model="'+id+'" rows="'+(opts.rows||4)+'" placeholder="'+esc(opts.ph||'')+'">'+esc(val)+'</textarea>';
  else if(opts.type==='select') ctl='<span class="sel"><select class="inp'+(state.errors[id]?' invalid':'')+'" id="'+id+'" data-model="'+id+'">'+opts.options.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select></span>';
  else ctl='<input class="inp'+(state.errors[id]?' invalid':'')+'" id="'+id+'" data-model="'+id+'" type="'+(opts.type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(opts.ph||'')+'"'+(opts.readonly?' readonly':'')+'>';
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+ctl+hint+err+'</div>';

function toast(msg,tone){
  var box=document.createElement('div');
  box.className='toast '+(tone?'t-'+tone:'');
  box.innerHTML=icon(tone==='bad'?'alert':tone==='warn'?'alert':tone==='info'?'info':'check')+'<span>'+esc(msg)+'</span>';
  var host=document.getElementById('toasts');
  host.appendChild(box);
  while(host.children.length>3)host.removeChild(host.firstElementChild);
  setTimeout(function(){box.remove();},4200);
}
function timeNow(){var d=new Date();return [d.getHours(),d.getMinutes(),d.getSeconds()].map(function(x){return String(x).padStart(2,'0');}).join(':');}
function download(name,text,type){
  var blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  var a=document.createElement('a'),url=URL.createObjectURL(blob);
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

function searchData(q){
  var out=[];

/* ---------- 2 · Thư viện ---------- */
function filteredBooks(){
  var q=state.lib.q.trim().toLowerCase(),st=state.lib.status;
  var arr=state.books.filter(function(b){
    var okq=!q||(b.t+' '+b.a+' '+b.c+' '+slugOf(b)).toLowerCase().indexOf(q)>=0;
    var oks=st==='all'||st==='18+'&&b.adult||st==='locked'&&b.lock||b.st===st;
    if(state.lib.pub&&b.pub!==state.lib.pub)return false;
    if(state.lib.vis&&(b.vis||'public')!==state.lib.vis)return false;
    if(state.lib.lock==='1'&&!b.lock)return false;
    if(state.lib.lock==='0'&&b.lock)return false;
    if(state.lib.adult==='1'&&!b.adult)return false;
    if(state.lib.adult==='0'&&b.adult)return false;
    return okq&&oks;
  });
  if(state.lib.sort==='az') arr.sort(function(a,b){return a.t.localeCompare(b.t,'vi');});
  else if(state.lib.sort==='ch-desc') arr.sort(function(a,b){return b.ch-a.ch;});
  else if(state.lib.sort==='ch-asc') arr.sort(function(a,b){return a.ch-b.ch;});
  else arr.sort(function(a,b){return state.books.indexOf(a)-state.books.indexOf(b);});
  return arr;
}

/* ---------- Đổi case đoạn / vùng chọn trong trình soạn ---------- */
function transformCase(text,mode){
  var t=String(text||'');
  if(mode==='upper')return t.toLocaleUpperCase('vi');
  if(mode==='lower')return t.toLocaleLowerCase('vi');
  if(mode==='title')return t.toLocaleLowerCase('vi').replace(/(^|\s)(\S)/g,function(m,p,c){return p+c.toLocaleUpperCase('vi');});
  if(mode==='sentence')return t.toLocaleLowerCase('vi').replace(/(^|[.!?]\s+)([^\s])/g,function(m,p,c){return p+c.toLocaleUpperCase('vi');});
  return t;
}
function applyCase(mode){
  var ed=document.getElementById('editor');
  if(!ed){
    state.editorPreview=false;
    state.editorSeed='<p>'+esc(transformCase(plainText(state.editorSeed),mode))+'</p>';
    render();
    toast('Đã đổi case: '+mode+' (mô phỏng).');
    return;
  }
  var sel=window.getSelection&&window.getSelection(),done=false;
  if(sel&&sel.rangeCount&&!sel.isCollapsed&&ed.contains(sel.anchorNode)&&ed.contains(sel.focusNode)){
    var txt=sel.toString();
    if(txt){try{document.execCommand('insertText',false,transformCase(txt,mode));done=true;}catch(e){}}
  }
  if(!done){
    var node=sel&&sel.anchorNode?sel.anchorNode:null;
    var box=node?(node.nodeType===3?node.parentElement:node):null;
    var p=box&&box.closest?box.closest('p,h1,h2,h3,blockquote'):null;
    if(p&&ed.contains(p)){p.textContent=transformCase(p.textContent,mode);done=true;}
    else{ed.innerHTML='<p>'+esc(transformCase(plainText(state.editorSeed),mode))+'</p>';done=true;}
  }
  state.editorSeed=ed.innerHTML;
  state.savedAt=timeNow();
  var n=document.getElementById('saveNote');
  if(n)n.innerHTML=icon('check','xs')+' Đã lưu lúc '+esc(state.savedAt)+' (mẫu)';
  toast('Đã đổi case: '+mode+' (mô phỏng).');
}

   Ctrl/Cmd+Alt+N; ở màn khác để nguyên hành vi native của trình duyệt. */
function shortcutSave(){
  if(state.route==='chuong'){
    var ed=document.getElementById('editor');if(ed)state.editorSeed=ed.innerHTML;
    state.savedAt=timeNow();
    var n=document.getElementById('saveNote');
    if(n)n.innerHTML=icon('check','xs')+' Đã lưu lúc '+esc(state.savedAt)+' (mẫu)';
    toast('Ctrl+S · đã lưu chương (mô phỏng).');return;
  }
  if(state.route==='sua-bo'){saveEdit();return;}
  if(state.route==='them-bo'){submitNew();return;}
  toast('Không có gì để lưu ở màn hình này.','info');
}
function shortcutNewChapter(){
  state.chapters.push({t:'Chương mẫu mới '+(state.chapters.length+1),b:'Truyện mẫu 01',s:'published',d:'03/11 20:40'});
  state.activeChapter=state.chapters.length-1;state.chapterStatus='published';
  toast('Ctrl+Alt+N · đã thêm chương (mô phỏng).');
  if(state.route!=='chuong')navigate('chuong');else render();
}

/* ---------- CLICK ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el){
    if(!e.target.closest||(!e.target.closest('.popover')&&!e.target.closest('.suggest'))){
      if(state.notifOpen||state.accountOpen||state.suggestOpen){state.notifOpen=false;state.accountOpen=false;state.suggestOpen=false;renderTopbar();}
    }
    return;
  }
  var a=el.dataset.act,id=el.dataset.id,idx=Number(el.dataset.idx);
  if(a==='close-modal'&&e.target.closest('.modal'))return;
  if(a==='close-drawer'&&e.target.closest('.sidebar'))return;
  switch(a){
    case 'go':navigate(id);break;
    case 'toggle-collapse':state.collapsed=!state.collapsed;render();break;
    case 'toggle-drawer':state.drawer=!state.drawer;render();break;
    case 'close-drawer':state.drawer=false;state.forceDrawer=false;render();break;
    case 'toggle-notif':state.notifOpen=!state.notifOpen;state.accountOpen=false;renderTopbar();break;
    case 'toggle-account':state.accountOpen=!state.accountOpen;state.notifOpen=false;renderTopbar();break;
    case 'view-web':toast('Mockup: không mở trang web thật. DỮ LIỆU MẪU.','info');break;
    case 'demo':
      state.demoOpen=!state.demoOpen;
      if(el.dataset.focus&&state.demoOpen)state.demoFocus=el.dataset.focus;
      renderDemo();break;
    case 'docs':openDocs();break;
    case 'close-modal':closeModal();break;
    case 'confirm-ok':applyConfirm();break;
    case 'confirm-demo':openStrong('Xác nhận mạnh (minh hoạ)','Ví dụ design system: gõ tên bộ để xác nhận. Các thao tác thật dùng cụm hoặc slug đúng source.','Truyện mẫu 01',function(){toast('Đã xác nhận mạnh (mô phỏng).');},'Xác nhận');break;
    case 'toast-demo':toast('Toast mẫu: thao tác đã hoàn tất (mô phỏng).','info');break;
    case 'reset-demo':resetDemo();break;
    case 'set-mode':state.modes[state.route]=el.dataset.mode;render();break;
    case 'refresh':toast('Đã đọc lại dữ liệu mẫu.');render();break;
    case 'pick-search':pickSearch(el.dataset.type,el.dataset.id,el.dataset.kind);break;
    case 'page-lib':state.lib.page=Number(el.dataset.page)||1;render();break;
    case 'page-votes':state.votePage=Number(el.dataset.page)||1;render();break;
    case 'page-logs':state.logPage=Number(el.dataset.page)||1;render();break;
    case 'reset-lib':state.lib={q:'',status:'all',pub:'',vis:'',lock:'',adult:'',sort:'new',page:1};render();break;
    case 'clear-sel':state.sel.clear();render();break;
    case 'bulk-apply':
      var act=state.bulkAction;
      if(!act){toast('Chọn một thao tác hàng loạt.','warn');break;}
      state.books.forEach(function(b){if(!state.sel.has(b.id))return;
        if(act.indexOf('st:')===0)b.st=act.slice(3);
        else if(act.indexOf('pub:')===0)b.pub=act.slice(4);
        else if(act==='18:1')b.adult=true;
        else if(act==='18:0')b.adult=false;
      });
      toast('Đã áp dụng cho '+state.sel.size+' bộ mẫu.');render();break;

/* ---------- CHANGE / INPUT ---------- */
document.addEventListener('change',function(e){
  var el=e.target;if(!el||!el.dataset)return;
  if(el.dataset.model){
    state.models[el.id]=(el.type==='checkbox')?el.checked:el.value;
    if(state.errors[el.id])setErr(el.id,'');
  }
  var r=el.dataset.role;if(!r)return;
  switch(r){
    case 'mode':state.modes[state.route]=el.value;render();break;
    case 'conn':state.conn=el.value;render();break;
    case 'quota':state.quota=el.value;render();break;
    case 'collapsed':state.collapsed=el.checked;render();break;
    case 'forceDrawer':state.forceDrawer=el.checked;render();break;
    case 'sim360':state.sim360=el.checked;render();break;
    case 'gate-static':state.models['gate-static']=el.checked;break;
    case 'nb-first':state.models['nb-first']=el.checked;break;
    case 'lib-status':state.lib.status=el.value;state.lib.page=1;render();break;
    case 'lib-pub':state.lib.pub=el.value;state.lib.page=1;render();break;
    case 'lib-vis':state.lib.vis=el.value;state.lib.page=1;render();break;
    case 'lib-adult':state.lib.adult=el.value;state.lib.page=1;render();break;
    case 'lib-lock':state.lib.lock=el.value;state.lib.page=1;render();break;
    case 'lib-sort':state.lib.sort=el.value;state.lib.page=1;render();break;
    case 'cmt-book':state.cmtBook=el.value;render();break;
    case 'vote-sel':
      if(el.checked)state.voteSel.add(Number(el.dataset.idx));else state.voteSel.delete(Number(el.dataset.idx));
      var vc=document.querySelector('.card-hd .right');if(vc)vc.textContent=state.voteSel.size+' phiếu được chọn · MẪU';break;
    case 'bulk-action':state.bulkAction=el.value;break;
    case 'case-mode':if(el.value){applyCase(el.value);el.value='';}break;
    case 'chapter-status':state.chapterStatus=el.value;render();break;
    case 'chapter-book':state.chapterBook=el.value;break;
    case 'sel-all':
      currentPageBooks().forEach(function(b){if(el.checked)state.sel.add(b.id);else state.sel.delete(b.id);});
      render();break;
    case 'sel-row':
      if(el.checked)state.sel.add(el.dataset.id);else state.sel.delete(el.dataset.id);
      render();break;
    case 'switch-book':selectBook(el.value);render();break;
    case 'lock-switch':setLock(el.checked?1:0);break;
    case 'picked':
      var pid=el.dataset.id,at=state.picked.indexOf(pid);
      if(el.checked&&at<0)state.picked.push(pid);
      if(!el.checked&&at>=0)state.picked.splice(at,1);
      break;
    case 'slide-book':state.slides[Number(el.dataset.idx)].b=el.value;render();break;
    case 'sched-book':state.schedule[Number(el.dataset.idx)].b=el.value;break;
    case 'restore-file':
      if(el.files&&el.files.length){
        openStrong('Khôi phục từ JSON','Ghi đè registry và book bằng file backup mẫu. Không thể hoàn tác.','KHÔI PHỤC',function(){
          toast('Đã khôi phục backup mẫu (mô phỏng).');render();
        },'Khôi phục');
        el.value='';
      }break;
    case 'import-file':
      if(el.files&&el.files.length){
        var kind=el.dataset.kind,name=el.files[0].name;
        if(kind==='multi'){
          for(var i=0;i<3;i++)state.chapters.push({t:'Chương mẫu nhập '+(i+1),b:'Truyện mẫu 14',s:'published',d:'03/11 20:40'});
          toast('Đã nhập 3 chương mẫu từ '+name+'.');
        }else toast('Đã nạp '+kind.toUpperCase()+' mẫu: '+name+' (mô phỏng).','info');
        el.value='';render();
      }break;
    case 'chapter-image':
      if(el.files&&el.files.length){
        state.editorPreview=false;
        state.editorSeed+='<div class="file" style="margin:10px 0">'+icon('image','s')+' Ảnh mẫu trong chương: '+esc(el.files[0].name)+' (DỮ LIỆU MẪU)</div>';
        el.value='';toast('Đã chèn ô ảnh mẫu vào chương.');render();
      }break;
    case 'cover-upload':
      if(el.files&&el.files.length){
        var t=document.getElementById(el.dataset.target);
        if(t)t.innerHTML='<span class="cover cv-3 lg" aria-label="Ô màu bìa mẫu đã tải">ẢNH<br>MẪU</span>';
        toast('Đã tải ảnh bìa mẫu: '+el.files[0].name+' (mô phỏng).','info');
        el.value='';
      }break;
  }
});
let saveTimer=null;
document.addEventListener('input',function(e){
  var el=e.target;if(!el||!el.dataset)return;
  var mid=el.dataset.model;
  if(mid){
    state.models[mid]=el.value;
    if(state.errors[mid])setErr(mid,'');
    if(mid==='nb-t'){
      var sl=document.getElementById('nb-slug');
      if(sl&&!sl.value){var auto=slugify(el.value);state.models['nb-slug']=auto;sl.value=auto;}
    }
    if(mid==='eb-slug'){
      var b=getBook(state.selectedBook),orig=slugOf(b),w=document.getElementById('slugWarn'),wt=document.getElementById('slugWarnText');
      if(w)w.hidden=(el.value===orig);
      if(wt)wt.innerHTML='<b>Cảnh báo đổi slug:</b> '+esc(orig)+' → '+esc(el.value)+'. Đường dẫn cũ và liên kết đã chia sẻ sẽ không còn trỏ tới bộ này. Cần xác nhận khi lưu.';
    }
  }
  var r=el.dataset.role;if(!r)return;
  switch(r){
    case 'cmt-q':
      var cv=el.value;state.cmtQ=cv;render();
      var nc=document.querySelector('[data-role="cmt-q"]');
      if(nc){nc.focus();try{nc.setSelectionRange(cv.length,cv.length);}catch(err){}}
      break;
    case 'lib-q':
      var v=el.value;state.lib.q=v;state.lib.page=1;render();
      var ne=document.querySelector('[data-role="lib-q"]');
      if(ne){ne.focus();try{ne.setSelectionRange(v.length,v.length);}catch(err){}}
      break;
    case 'suggest-input':
      state.suggestQuery=el.value;state.suggestOpen=true;
      var wrap=el.closest('.search'),old=wrap?wrap.querySelector('.suggest'):null;
      if(old)old.remove();
      if(wrap){wrap.insertAdjacentHTML('beforeend',suggestList(state.suggestQuery,'suggest'));hydrateIcons(wrap);}
      el.setAttribute('aria-expanded','true');break;
    case 'palette-input':
      state.paletteQuery=el.value;state.paletteIndex=0;updatePaletteList();break;
    case 'confirm-input':
      state.confirmValue=el.value;
      var ok=document.getElementById('confirmOk');
      if(ok&&state.modal&&state.modal.kind==='strong')ok.disabled=(el.value.trim()!==state.modal.phrase);
      break;
    case 'editor':
      state.editorSeed=el.innerHTML;
      clearTimeout(saveTimer);
      saveTimer=setTimeout(function(){
        state.savedAt=timeNow();
        var n=document.getElementById('saveNote');
        if(n)n.innerHTML=icon('check','xs')+' Đã lưu lúc '+esc(state.savedAt)+' (mẫu)';
      },700);
      break;
    case 'chapter-title':
      var ct=state.chapters[state.activeChapter];if(ct)ct.t=el.value;
      var ctb=document.querySelector('[data-act="chapter-select"][data-idx="'+state.activeChapter+'"] span');
      if(ctb)ctb.textContent=el.value||'Chương mẫu';
      break;
    case 'chapter-at':state.chapterAt=el.value;break;
    case 'couple-row':
      var cf3=el.dataset.form;state.couples[cf3][Number(el.dataset.idx)]=el.value;syncCouples(cf3);break;
    case 'hp-note':state.hpNote=el.value;break;
    case 'slide-reason':state.slides[Number(el.dataset.idx)].r=el.value;break;
    case 'sched-date':state.schedule[Number(el.dataset.idx)].d=el.value;break;
    case 'sched-ch':state.schedule[Number(el.dataset.idx)].c=el.value;break;
  }
});

/* ---------- BÀN PHÍM ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.role==='couple-row'){
    e.preventDefault();
    var cf4=e.target.dataset.form;state.couples[cf4].push('');syncCouples(cf4);render();
    var er=document.querySelectorAll('[data-role="couple-row"][data-form="'+cf4+'"]');
    if(er.length)er[er.length-1].focus();return;
  }
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){
    e.preventDefault();
    if(state.modal)return;
    state.paletteOpen?closePalette():openPalette();return;
  }
  var mod=e.ctrlKey||e.metaKey;
  if(mod){
    var kk=String(e.key||'').toLowerCase();
    if(kk==='s'){
      e.preventDefault();
      if(state.modal||state.paletteOpen)return;
      shortcutSave();return;
    }
    if(kk==='n'||e.code==='KeyN'){
      if(state.modal||state.paletteOpen)return;
      if(state.route==='chuong'||state.route==='sua-bo'){
        e.preventDefault();shortcutNewChapter();
      }
      return;
    }
  }
  if(e.key==='Escape'){
    if(state.modal){closeModal();return;}
    if(state.paletteOpen){closePalette();return;}
    if(state.drawer||state.forceDrawer){state.drawer=false;state.forceDrawer=false;render();return;}
    if(state.notifOpen||state.accountOpen||state.suggestOpen){
      state.notifOpen=false;state.accountOpen=false;state.suggestOpen=false;renderTopbar();return;
    }
  }
  if(state.paletteOpen&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    var n=searchData(state.paletteQuery).length;
    if(n){state.paletteIndex=(state.paletteIndex+(e.key==='ArrowDown'?1:-1)+n)%n;updatePaletteList();}
    return;
  }
  if(state.paletteOpen&&e.key==='Enter'&&e.target&&e.target.id==='paletteInput'){
    e.preventDefault();
    var list=searchData(state.paletteQuery),hit=list[state.paletteIndex];
    if(hit)pickSearch(hit.type,hit.id,'palette');
    return;
  }
  if((state.modal||state.paletteOpen)&&e.key==='Tab'){
    var root=state.modal?document.querySelector('.modal'):document.querySelector('.palette-box');
    if(!root)return;
    var f=Array.prototype.slice.call(root.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])'))
      .filter(function(x){return x.offsetParent!==null;});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/* ---------- KHỞI ĐỘNG ---------- */
window.addEventListener('hashchange',function(){syncRoute();render();});
state.defaultEditor=state.editorSeed;
syncRoute();
render();
</script>
