function handleInput(e) {
  const el = e.target;
  const id = el.id;

  if (id === 'storySearch') {
    state.storyQuery = el.value;
    state.storyPage = 1;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => refresh('storySearch'), 260);
    return;
  }
  if (id === 'taxSearch') {
    const q = el.value.trim().toLowerCase();
    let visible = 0;
    $$('#view tbody tr').forEach((tr) => {
      if (tr.id === 'taxEmpty') return;
      const hit = q === '' || tr.textContent.toLowerCase().includes(q);
      tr.hidden = !hit;
      if (hit) visible++;
    });
    const emptyRow = $('#taxEmpty');
    if (emptyRow) emptyRow.hidden = visible > 0;
    return;
  }
  if (id === 'sDesc') {
    const c = $('#descCount');
    if (c) c.textContent = el.value.length + '/400';
    return;
  }
  if (id === 'seoTitle' || id === 'seoDesc') {
    const c = $('#' + id + 'Count');
    if (c) c.textContent = el.value.length;
    return;
  }
  if (id === 'chapBody' || id === 'chapTitle') {
    updateEditorCounts();
    scheduleAutosave();
    return;
  }
}

function handleChange(e) {
  const el = e.target;
  const id = el.id;

  if (id === 'filterGenre') { state.storyGenre = el.value; state.storyPage = 1; refresh(); return; }
  if (id === 'filterStatus') { state.storyStatus = el.value; state.storyPage = 1; refresh(); return; }
  if (id === 'filterPrice') { state.storyPrice = el.value; state.storyPage = 1; refresh(); return; }
  if (id === 'setDensity') {
    state.density = el.value;
    document.documentElement.classList.toggle('dense', el.value === 'Gọn');
    toast('Đã đổi mật độ', el.value === 'Gọn' ? 'Bảng và thẻ hiển thị gọn hơn.' : 'Đang dùng khoảng cách thoáng.', 'info');
    return;
  }

  if (id === 'checkAll') {
    const rows = filteredStories().slice((state.storyPage - 1) * state.storyPerPage,
      state.storyPage * state.storyPerPage);
    rows.forEach((s) => { if (el.checked) state.selectedStories.add(s.id); else state.selectedStories.delete(s.id); });
    refresh();
    return;
  }
  if (el.classList.contains('row-check')) {
    if (el.checked) state.selectedStories.add(el.getAttribute('data-id'));
    else state.selectedStories.delete(el.getAttribute('data-id'));
    refresh();
    return;
  }
  if (el.classList.contains('chap-check')) {
    if (el.checked) state.selectedChapters.add(el.getAttribute('data-id'));
    else state.selectedChapters.delete(el.getAttribute('data-id'));
    refresh();
    return;
  }
  if (id === 'coverInput' || id === 'logoInput' || id === 'bannerInput') {
    const file = el.files && el.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('Tệp không hợp lệ', 'Chỉ nhận ảnh JPG, PNG hoặc WebP.', 'err'); return; }
    if (file.size > 2 * 1024 * 1024) { toast('Ảnh quá lớn', 'Dung lượng tối đa là 2MB.', 'err'); return; }
    const host = id === 'coverInput' ? $('#coverPreview') : el.previousElementSibling;
    const paint = (src) => {
      if (!host) return;
      host.innerHTML = '<img src="' + src + '" alt="Ảnh xem trước" ' +
        'style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--border)">' +
        '<p style="font-size:12px;color:var(--text-3);margin-top:8px">' + esc(file.name) + '</p>';
    };
    if (id === 'coverInput' && typeof FileReader !== 'undefined') {
      const reader = new FileReader();
      reader.onload = () => { FORM_COVER = String(reader.result); paint(FORM_COVER); };
      reader.onerror = () => toast('Không đọc được ảnh', 'Thử lại với tệp JPG hoặc PNG.', 'err');
      reader.readAsDataURL(file);
    } else if (typeof URL !== 'undefined' && URL.createObjectURL) {
      paint(URL.createObjectURL(file));
    }
    toast('Đã tải ảnh lên', file.name + ' · ' + Math.round(file.size / 1024) + ' KB');
    return;
  }
}

function handleSubmit(e) {
  const form = e.target;
  if (form.id === 'storyForm') {
    e.preventDefault();
    const titleEl = $('#sTitle'), genreEl = $('#sGenre'), descEl = $('#sDesc');
    const marks = [
      [titleEl.closest('.field'), titleEl.value.trim().length >= 3],
      [genreEl.closest('.field'), genreEl.value !== ''],
      [descEl.closest('.field'), descEl.value.trim().length >= 30],
    ];
    let ok = true;
    marks.forEach(([field, valid]) => {
      field.classList.toggle('field-error', !valid);
      if (!valid) ok = false;
    });
    if (!ok) {
      toast('Chưa lưu được', 'Vui lòng kiểm tra các trường được đánh dấu.', 'err');
      const first = $('.field-error');
      if (first) {
        const inp = first.querySelector('input,select,textarea');
        if (inp) inp.focus();
      }
      return;
    }
    const story = {
      id: 's' + (STORIES.length + 100),
      title: titleEl.value.trim(),
      author: SETTINGS.authorName,
      genre: genreEl.value,
      status: $('#sStatus') ? $('#sStatus').value : 'Bản nháp',
      chapters: 0, views: 0, rating: 0, updated: '2026-11-02T12:00:00',
      priceXu: $('#sPrice') ? Math.max(0, Math.min(999, Number($('#sPrice').value) || 0)) : 0,
      featured: $('#sFeature') ? $('#sFeature').checked : false,
      adult: $('#sAdult') ? $('#sAdult').checked : false,
      tags: [...FORM_TAGS],
      desc: descEl.value.trim(),
      cover: FORM_COVER,
    };
    STORIES.unshift(story);
    const chapTitle = $('#sChapTitle'), chapBody = $('#sChapBody');
    if (chapTitle && chapTitle.value.trim()) {
      CHAPTERS.push({
        id: uid('c'), storyId: story.id, number: 1, title: chapTitle.value.trim(),
        words: (chapBody.value.trim().match(/[^\s]+/g) || []).length, status: 'Bản nháp',
        publishedAt: null, scheduleAt: null,
        body: '<p>' + esc(chapBody.value.trim()).replace(/\n+/g, '</p><p>') + '</p>',
      });
      story.chapters = 1;
    }
    toast('Đã đăng truyện', '“' + story.title + '” · trạng thái “' + story.status + '”.');
    FORM_TAGS.length = 0;
    FORM_COVER = null;
    form.reset();
    navigate('stories');
    return;
  }
}

/* --- Bàn phím --- */
function handleKeydown(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  const meta = e.ctrlKey || e.metaKey;

  if (meta && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
    return;
  }
  if (e.key === 'Escape') {
    if ($('#paletteWrap').classList.contains('show')) { closePalette(); return; }
    if ($('#notifPop') && !$('#notifPop').hidden) { toggleNotif(false); return; }
    if (state.sidebarOpen) { state.sidebarOpen = false; applySidebarState(); return; }
  }
  if (state.page === 'editor') {
    if (meta && e.key.toLowerCase() === 's') {
      e.preventDefault();
      clearTimeout(state.editor.draftTimer);
      const saved = persistEditor();
      if (saved) toast('Đã lưu chương', 'Chương ' + saved.number + ' đã được lưu.');
      else toast('Chưa có nội dung', 'Hãy viết ít nhất một đoạn trước khi lưu.', 'err');
      return;
    }
    if (meta && e.key.toLowerCase() === 'p') { e.preventDefault(); editorPreview(); return; }
  }
  if (e.target.id === 'sTags' && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim().replace(/,$/, '');
    if (v && FORM_TAGS.length < 8 && !FORM_TAGS.includes(v)) {
      FORM_TAGS.push(v);
      renderFormTags();
      e.target.value = '';
    } else if (FORM_TAGS.length >= 8) {
      toast('Đã đủ thẻ', 'Tối đa 8 thẻ cho mỗi truyện.', 'err');
    }
    return;
  }
  if (e.target.id === 'paletteInput') {
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteMove(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); paletteMove(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); paletteChoose(); return; }
  }
  if (!typing && e.key === '/') { e.preventDefault(); openPalette(); }
}

/* --- Kéo thả --- */
let dragChapterId = null;

function reorderChapter(fromId, toId) {
  const from = CHAPTERS.findIndex((c) => c.id === fromId);
  const to = CHAPTERS.findIndex((c) => c.id === toId);
  if (from < 0 || to < 0 || from === to) return;
  const [moved] = CHAPTERS.splice(from, 1);
  CHAPTERS.splice(to, 0, moved);
  const list = CHAPTERS.filter((c) => c.storyId === state.chapterStoryId);
  list.forEach((c, i) => { c.number = i + 1; });
  state.selectedChapters.clear();
  refresh();
  toast('Đã đổi thứ tự', 'Chương “' + moved.title + '” đã được di chuyển.');
}

function bindDrag() {
  document.addEventListener('dragstart', (e) => {
    const row = e.target.closest && e.target.closest('.chapter-row');
    if (!row) return;
    dragChapterId = row.getAttribute('data-chapter-id');
    row.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragChapterId); } catch (_) { /* Safari */ }
    }
  });
  document.addEventListener('dragover', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone, .chapter-row');
    if (!zone) return;
    e.preventDefault();
    if (zone.classList.contains('drop-zone')) { zone.classList.add('over'); return; }
    if (!dragChapterId) return;
    $$('.chapter-row.drop-target').forEach((r) => r.classList.remove('drop-target'));
    if (zone.getAttribute('data-chapter-id') !== dragChapterId) zone.classList.add('drop-target');
  });
  document.addEventListener('dragleave', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone');
    if (zone) zone.classList.remove('over');
  });
  document.addEventListener('drop', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone, .chapter-row');
    if (!zone) return;
    e.preventDefault();
    if (zone.classList.contains('drop-zone')) {
      zone.classList.remove('over');
      const map = { coverDrop: '#coverInput', logoDrop: '#logoInput', bannerDrop: '#bannerInput' };
      const inp = $(map[zone.id]);
      if (inp && e.dataTransfer && e.dataTransfer.files.length) {
        inp.files = e.dataTransfer.files;
        inp.dispatchEvent(new Event('change', { bubbles: true }));
      }
      return;
    }
    const toId = zone.getAttribute('data-chapter-id');
    if (dragChapterId && toId) reorderChapter(dragChapterId, toId);
    dragChapterId = null;
  });
  document.addEventListener('dragend', () => {
    dragChapterId = null;
    $$('.chapter-row.dragging, .chapter-row.drop-target').forEach((r) => {
      r.classList.remove('dragging');
      r.classList.remove('drop-target');
    });
  });
}

/* --- Command palette --- */
function paletteData(q) {
  const term = q.trim().toLowerCase();
  const items = [];
  PAGES.forEach((p) => {
    if (p.id === 'editor') return;
    items.push({ type: 'page', id: p.id, label: p.label, sub: p.desc, icon: p.icon, group: 'Trang' });
  });
  STORIES.forEach((s) => {
    items.push({ type: 'story', id: s.id, label: s.title, sub: s.author + ' · ' + s.genre, icon: 'book', group: 'Truyện' });
  });
  const filtered = term
    ? items.filter((i) => (i.label + ' ' + i.sub).toLowerCase().includes(term))
    : items.filter((i) => i.type === 'page').concat(items.filter((i) => i.type === 'story').slice(0, 5));
  return filtered.slice(0, 12);
}
function renderPalette(q) {
  const results = paletteData(q);
  state.paletteResults = results;
  state.paletteIndex = 0;
  const host = $('#paletteList');
  if (!results.length) {
    host.innerHTML = '<div class="palette-empty">Không tìm thấy kết quả cho “' + esc(q) + '”.<br>' +
      'Thử tên trang, tên truyện hoặc tác giả.</div>';
    return;
  }
  let html = '';
  let group = '';
  results.forEach((r, i) => {
    if (r.group !== group) {
      group = r.group;
      html += '<div class="palette-group">' + esc(group) + '</div>';
    }
    html += '<button class="palette-item" type="button" role="option" data-palette="' + i + '" aria-selected="' +
      (i === 0) + '">' + icon(r.icon) + '<span class="tx"><b>' + esc(r.label) + '</b>' +
      '<span>' + esc(r.sub) + '</span></span>' +
      '<span class="k">' + (r.type === 'page' ? 'Trang' : 'Truyện') + '</span></button>';
  });
  host.innerHTML = html;
  host.setAttribute('aria-activedescendant', 'palette-0');
}
function paletteMove(delta) {
  const items = $$('.palette-item', $('#paletteList'));
  if (!items.length) return;
  state.paletteIndex = (state.paletteIndex + delta + items.length) % items.length;
  items.forEach((el, i) => el.setAttribute('aria-selected', String(i === state.paletteIndex)));
  const cur = items[state.paletteIndex];
  if (cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
}
function paletteChoose() {
  const r = state.paletteResults[state.paletteIndex];
  if (!r) return;
  closePalette();
  if (r.type === 'page') navigate(r.id);
  else { state.storyDetailId = r.id; navigate('story-detail'); }
}
function openPalette() {
  const wrap = $('#paletteWrap');
  wrap.classList.add('show');
  const inp = $('#paletteInput');
  inp.value = '';
  renderPalette('');
  setTimeout(() => inp.focus(), 20);
}
function closePalette() {
  const wrap = $('#paletteWrap');
  if (wrap) wrap.classList.remove('show');
}

function toggleNotif(force) {
  const pop = $('#notifPop');
  if (!pop) return;
  const open = force === undefined ? pop.hidden : force;
  if (open) renderNotifPop();
  pop.hidden = !open;
  const bell = $('#bellBtn');
  if (bell) bell.setAttribute('aria-expanded', String(open));
  if (open) {
    const first = pop.querySelector('.notif-item') || pop.querySelector('button');
    if (first) first.focus();
  }
}

/* --- Xuất tệp thật (CSV / JSON) --- */
const csvCell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
const csvRows = (head, rows) =>
  '\ufeff' + [head, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n');
function downloadFile(name, content, mime = 'text/csv;charset=utf-8') {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); try { URL.revokeObjectURL(url); } catch (_) { /* bỏ qua */ } }, 400);
    return true;
  } catch (_) {
    return false;
  }
}
function exportData(kind) {
  const stamp = '2026-11-02';
  const map = {
    stories: () => downloadFile('truyen-' + stamp + '.csv', csvRows(
      ['ID', 'Tên truyện', 'Tác giả', 'Thể loại', 'Trạng thái', 'Chương', 'Lượt đọc', 'Đánh giá', 'Giá Xu', 'Xu đã nhận', 'Cập nhật'],
      STORIES.map((s) => [s.id, s.title, s.author, s.genre, s.status, s.chapters, s.views, s.rating,
        s.priceXu || 0, xuOf(s.id), s.updated]))),
    unlocks: () => downloadFile('luot-mo-khoa-' + stamp + '.csv', csvRows(
      ['Mã', 'Độc giả', 'Truyện', 'Xu', 'Thời gian'],
      UNLOCKS.map((u) => {
        const st = STORIES.find((x) => x.id === u.storyId);
        return [u.id, u.reader, st ? st.title : u.storyId, u.xu, u.at];
      }))),
    taxonomy: () => downloadFile('danh-muc-' + stamp + '.csv', csvRows(
      ['Loại', 'Tên', 'Đường dẫn', 'Số truyện'],
      CATEGORIES.map((c) => ['Thể loại', c.name, c.slug, c.count])
        .concat(TAGS.map((t) => ['Thẻ', t.name, t.slug || slugify(t.name), t.count])))),
    settings: () => downloadFile('cau-hinh-' + stamp + '.json',
      JSON.stringify({ ...SETTINGS, exportedAt: '2026-11-02T12:00:00' }, null, 2), 'application/json'),
  };
  const run = map[kind];
  if (!run) return;
  const okDone = run();
  toast(okDone ? 'Đã xuất tệp' : 'Không xuất được tệp', okDone
    ? 'Tệp được tải xuống thư mục Downloads của bạn.'
    : 'Trình duyệt không cho phép tạo tệp trong chế độ này.', okDone ? 'ok' : 'err');
}

function unlockStory(id) {
  const s = STORIES.find((x) => x.id === id);
  if (!s) return;
  if (!SETTINGS.toggles.xu) { toast('Đang tắt bán bằng Xu', 'Bật lại trong Cài đặt → Tính năng.', 'err'); return; }
  if (!s.priceXu) { toast('Truyện miễn phí', '“' + s.title + '” không cần trả Xu.'); return; }
  if (isUnlocked(s.id)) { toast('Đã mở khoá rồi', 'Bạn đã trả Xu cho “' + s.title + '”.', 'info'); return; }
  if (READER.wallet < s.priceXu) {
    toast('Không đủ Xu', 'Ví còn ' + fmtNum(READER.wallet) + ' Xu, cần ' + s.priceXu + ' Xu.', 'err');
    return;
  }
  openModal({
    title: 'Trả ' + s.priceXu + ' Xu để mở khoá?',
    message: '“' + s.title + '” sẽ mở toàn bộ ' + s.chapters + ' chương. Số dư còn lại sau khi trả: ' +
      fmtNum(READER.wallet - s.priceXu) + ' Xu. Giao dịch không hoàn lại.',
    confirmText: 'Trả ' + s.priceXu + ' Xu',
    onConfirm: () => {
      READER.wallet -= s.priceXu;
      UNLOCKS.unshift({ id: uid('x'), storyId: s.id, reader: READER.name, xu: s.priceXu, at: '2026-11-02T12:00:00' });
      toast('Đã mở khoá truyện', 'Trừ ' + s.priceXu + ' Xu · ví còn ' + fmtNum(READER.wallet) + ' Xu.');
      refresh();
    },
  });
}

function xuHistoryModal() {
  const rows = [...UNLOCKS].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  openModal({
    title: 'Lịch sử Xu',
    subtitle: fmtNum(totalXu()) + ' Xu từ ' + UNLOCKS.length + ' lượt mở khoá · ví hiện tại ' + fmtNum(READER.wallet) + ' Xu',
    confirmText: 'Đóng',
    wide: true,
    body: rows.length === 0
      ? emptyState({ iconName: 'coins', title: 'Chưa có giao dịch', message: 'Lượt mở khoá sẽ xuất hiện ở đây.' })
      : '<div class="table-wrap"><table><thead><tr><th scope="col">Độc giả</th><th scope="col">Truyện</th>' +
        '<th scope="col" class="hide-sm">Thời gian</th><th scope="col" style="text-align:right">Xu</th></tr></thead><tbody>' +
        rows.map((u) => {
          const st = STORIES.find((x) => x.id === u.storyId);
          return '<tr><td>' + esc(u.reader) + (u.reader === READER.name ? ' <span class="badge badge-accent plain">Bạn</span>' : '') +
            '</td><td class="cell-muted">' + esc(st ? st.title : '—') + '</td>' +
            '<td class="cell-muted hide-sm">' + fmtDateTime(u.at) + '</td>' +
            '<td class="num" style="text-align:right"><b>' + fmtNum(u.xu) + '</b></td></tr>';
        }).join('') + '</tbody></table></div>',
    onConfirm: () => true,
  });
}

function storyPreviewModal(id) {
  const s = STORIES.find((x) => x.id === id);
  if (!s) return;
  const chs = CHAPTERS.filter((c) => c.storyId === s.id).sort((a, b) => a.number - b.number).slice(0, 4);
  openModal({
    title: 'Xem như độc giả',
    subtitle: 'sachmuc.vn/truyen/' + s.id,
    confirmText: 'Đóng',
    wide: true,
    body: '<div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">' + coverOf(s, 96) +
        '<div style="flex:1 1 240px;min-width:0">' +
          '<h3 style="font-family:var(--serif);font-size:22px;line-height:1.3;margin-bottom:6px">' + esc(s.title) + '</h3>' +
          '<div style="font-size:13px;color:var(--text-3)">' + esc(s.author) + ' · ' + esc(s.genre) + ' · ' +
            fmtNum(s.views) + ' lượt đọc</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">' + storyBadge(s.status) +
            (s.priceXu ? '<span class="badge badge-accent plain">' + s.priceXu + ' Xu</span>'
              : '<span class="badge badge-neutral plain">Miễn phí</span>') + '</div>' +
        '</div></div>' +
      '<p style="font-size:13.5px;line-height:1.7;color:var(--text-2);margin-top:16px">' + esc(s.desc) + '</p>' +
      '<div style="margin-top:14px;display:flex;flex-direction:column;gap:2px">' +
        chs.map((c) => '<div class="meta-line" style="border-top:1px solid var(--border)">' +
          '<span>Chương ' + c.number + '. ' + esc(c.title) + '</span><b>' +
          (s.priceXu ? 'Trong gói' : 'Miễn phí') + '</b></div>').join('') +
      '</div>' +
      paywallHTML(s),
    onConfirm: () => true,
  });
}

/* --- Nhân bản truyện --- */
function duplicateStory(id) {
  const s = STORIES.find((x) => x.id === id);
  if (!s) return;
  const copy = { ...s, id: uid('s'), title: s.title + ' (bản sao)', status: 'Bản nháp',
    views: 0, featured: false, updated: '2026-11-02T12:00:00' };
  STORIES.unshift(copy);
  CHAPTERS.filter((c) => c.storyId === s.id).forEach((c) => {
    CHAPTERS.push({ ...c, id: uid('c'), storyId: copy.id, status: 'Bản nháp',
      publishedAt: null, scheduleAt: null });
  });
  toast('Đã nhân bản truyện', '“' + copy.title + '” ở trạng thái bản nháp.');
  navigate('stories');
}

/* --- Phản hồi bình luận --- */
function replyCommentModal(id) {
  const c = COMMENTS.find((x) => x.id === id);
  if (!c) return;
  openModal({
    title: 'Phản hồi bình luận',
    subtitle: c.user + ' · ' + c.story + ' · chương ' + c.chapter,
    confirmText: 'Gửi phản hồi',
    body: '<div class="preview-box" style="max-height:120px;margin-bottom:14px">' + esc(c.text) + '</div>' +
      '<div class="field"><label for="replyText">Nội dung phản hồi (hiển thị công khai)</label>' +
        '<textarea class="textarea" id="replyText" data-field="text" placeholder="Cảm ơn bạn đã đọc và góp ý…"></textarea>' +
        '<span class="error">Cần ít nhất 5 ký tự.</span></div>',
    validate: (dlg) => (dlg.querySelector('[data-field=text]').value.trim().length >= 5
      ? true : 'Nội dung phản hồi quá ngắn.'),
    onConfirm: (dlg) => {
      COMMENTS.unshift({
        id: uid('cm'), user: 'Lê Anh (QTV)', story: c.story, chapter: c.chapter,
        text: dlg.querySelector('[data-field=text]').value.trim(), status: 'Hiển thị',
        at: '2026-11-02T12:00:00', reports: 0,
      });
      toast('Đã gửi phản hồi', 'Phản hồi của bạn hiển thị công khai dưới bình luận.');
      refresh();
      return true;
    },
  });
}

/* --- Đếm lại số truyện cho danh mục --- */
function recountTaxonomy() {
  CATEGORIES.forEach((c) => { c.count = STORIES.filter((s) => s.genre === c.name).length; });
  TAGS.forEach((t) => {
    t.count = STORIES.filter((s) => s.tags.some((x) => x.toLowerCase() === t.name.toLowerCase())).length;
  });
}

/* --- Khởi động --- */
const ROUTES = [...PAGES.map((p) => p.id), 'story-new', 'story-detail', 'editor'];

function bindPage() {
  if (state.page === 'editor') initEditor();
  if (state.page === 'story-new') { renderFormTags(); }
}

function initApp() {
  applyTheme();
  renderXuPill();
  renderSidebar();
  renderBreadcrumb();
  applySidebarState();
  renderNotifPop();

  document.addEventListener('click', handleClick);
  document.addEventListener('input', handleInput);
  document.addEventListener('change', handleChange);
  document.addEventListener('submit', handleSubmit);
  document.addEventListener('keydown', handleKeydown);
  bindDrag();

  const p = $('#paletteInput');
  p.addEventListener('input', () => renderPalette(p.value));
  $('#paletteList').addEventListener('click', (e) => {
    const item = e.target.closest('[data-palette]');
    if (!item) return;
    state.paletteIndex = Number(item.getAttribute('data-palette'));
    paletteChoose();
  });

  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && id !== state.page && ROUTES.includes(id)) navigate(id);
  });

  const start = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'dashboard';
  navigate(start);
}

initApp();
</script>
