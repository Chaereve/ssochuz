    title: esc(name) + ' · ' + rows.length + ' bộ',
    body: '<div class="stack" style="gap:8px">' + rows.map((b) => '<button class="btn" type="button" data-go="story/' + b.slug + '" style="justify-content:flex-start;height:auto;padding:9px 10px">' +
      coverOf(b, 'sm') + '<span style="text-align:left"><b style="display:block">' + esc(b.title) + '</b><span class="hint">' + b.chapters + ' chương · ' + esc(b.status) + '</span></span></button>').join('') + '</div>',
    ok: 'Đóng', cancel: 'Huỷ',
  });
}

/* ---------- ủy quyền sự kiện ---------- */
function bindEvents() {
  document.addEventListener('click', (e) => {
    const t = e.target;
    const el = t.closest && t.closest('[data-go],[data-drawer-open],[data-drawer-close],[data-open-palette],[data-act],[data-submit],[data-toast-close],[data-lib],[data-sort],[data-page],[data-bulk],[data-export],[data-chaps],[data-dupe],[data-del],[data-preview-book],[data-newchap],[data-genre-add],[data-genre-del],[data-tag-add],[data-tag-del],[data-warn],[data-cover-pick],[data-ctab],[data-cpage],[data-clear-ch],[data-approve],[data-approve-all],[data-reject],[data-preview-ch],[data-open],[data-ed],[data-fmt],[data-tax-add],[data-tax-edit],[data-tax-del],[data-tax-help],[data-userstab],[data-author],[data-author-mail],[data-lock-author],[data-staff-invite],[data-staff-del],[data-cmttab],[data-cmt],[data-rp],[data-vote-del],[data-revtab],[data-pkg-new],[data-pkg-edit],[data-xu-save],[data-withdraw],[data-settab],[data-slide-add],[data-slide-del],[data-slide-up],[data-pick-add],[data-pick-del],[data-hp-preview],[data-home-save],[data-set],[data-doc-scan],[data-doc-fix],[data-prevtab],[data-pay],[data-unlock],[data-read]');
    if (!el) return;
    const a = (n) => el.getAttribute(n);

    if (a('data-drawer-open') !== null) { openDrawer(true); return; }
    if (a('data-drawer-close') !== null) { openDrawer(false); return; }
    if (a('data-open-palette') !== null) { openPalette(); return; }
    if (a('data-toast-close') !== null) { el.closest('.toast').remove(); return; }
    if (a('data-go') !== null) { openDrawer(false); closeModal(); go(a('data-go')); return; }

    if (a('data-act') === 'account-menu') {
      openModal({
        title: 'Phiên quản trị',
        sub: 'Snow · Snow@ssochuz.com',
        body: '<div class="stack" style="gap:10px"><div class="notice">' + icon('shield', 15) + '<span>Bạn đang đăng nhập bằng vai trò <b>Super Admin</b>. Mọi thao tác ghi dữ liệu cần ADMIN_KEY ở máy chủ.</span></div>' +
          '<dl class="kv"><dt>Đăng nhập gần nhất</dt><dd>' + dtm(NOW_ISO) + '</dd><dt>Trình duyệt</dt><dd>Bản xem trước một tệp</dd><dt>Dữ liệu</dt><dd>67 bộ · ' + fmt(totalChapters()) + ' chương</dd></dl></div>',
        ok: 'Đóng', cancel: 'Huỷ',
      });
      return;
    }
    if (a('data-submit')) {
      const form = $('#' + a('data-submit'));
      if (form) (form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })));
      return;
    }

    /* --- thư viện --- */
    if (a('data-lib') === 'clear') { state.lib = Object.assign(state.lib, { q: '', status: '', age: '', pub: '', page: 1, sel: new Set() }); render(); return; }
    if (a('data-lib') === 'unselect') { state.lib.sel.clear(); render(); return; }
    if (a('data-sort')) {
      const key = a('data-sort');
      if (state.lib.sort === key) state.lib.dir *= -1;
      else { state.lib.sort = key; state.lib.dir = key === 'title' ? 1 : -1; }
      render(); return;
    }
    if (a('data-page')) {
      const n = Number(a('data-page'));
      const pages = Math.max(1, Math.ceil(libRows().length / state.lib.per));
      if (n >= 1 && n <= pages) { state.lib.page = n; render(); }
      return;
    }
    if (a('data-bulk')) {
      const kind = a('data-bulk');
      const sel = Array.from(state.lib.sel).map(bySlug).filter(Boolean);
      if (kind === 'publish') { sel.forEach((b) => { b.pub = 'published'; }); state.lib.sel.clear(); afterChange('Đã cho hiện ' + sel.length + ' bộ'); return; }
      if (kind === 'feature') { sel.forEach((b) => { b.featured = true; if (SETTINGS.editorChoice.indexOf(b.slug) < 0 && SETTINGS.editorChoice.length < 12) SETTINGS.editorChoice.push(b.slug); }); state.lib.sel.clear(); afterChange('Đã ghim ' + sel.length + ' bộ vào biên tập chọn'); return; }
      if (kind === 'status') {
        openModal({
          title: 'Đổi tình trạng', sub: sel.length + ' bộ đã chọn',
          body: '<div class="field"><label for="bulkStatus">Tình trạng mới</label><select class="sel" id="bulkStatus">' +
            ['Đang cập nhật', 'Hoàn thành', 'Sắp ra mắt'].map((s) => '<option>' + s + '</option>').join('') + '</select></div>',
          ok: 'Áp dụng',
          onOk: (root) => {
            const v2 = root.querySelector('#bulkStatus').value;
            sel.forEach((b) => { b.status = v2; });
            state.lib.sel.clear();
            afterChange('Đã đổi tình trạng ' + sel.length + ' bộ', v2);
          },
        });
        return;
      }
      if (kind === 'delete') {
        confirmDo({
          title: 'Xoá ' + sel.length + ' bộ?', sub: sel.slice(0, 3).map((b) => b.title).join(', ') + (sel.length > 3 ? '…' : ''),
          ok: 'Xoá tất cả', requireText: 'Gõ “XOA” để xác nhận:', expect: 'XOA', placeholder: 'XOA',
          onOk: () => {
            sel.forEach((b) => {
              const i = LIB.indexOf(b); if (i >= 0) LIB.splice(i, 1);
              const j = BOOKS.findIndex((x) => x.slug === b.slug); if (j >= 0) BOOKS.splice(j, 1);
              CH_CACHE.delete(b.slug);
            });
            state.lib.sel.clear();
            pushLog('book.bulk_delete', sel.length + ' bộ');
            afterChange('Đã xoá ' + sel.length + ' bộ');
          },
        });
        return;
      }
    }
    if (a('data-export')) { exportData(a('data-export')); return; }
    if (a('data-chaps') !== null) { state.chapters.slug = a('data-chaps'); state.chapters.tab = 'all'; state.chapters.page = 1; go('chapters'); return; }
    if (a('data-dupe')) { dupeBook(a('data-dupe')); return; }
    if (a('data-del')) { deleteBook(a('data-del')); return; }
    if (a('data-preview-book')) { const b = bySlug(a('data-preview-book')); openModal({ title: esc(b.title), wide: true, body: '<div class="inline" style="gap:14px;align-items:flex-start">' + coverOf(b, 'lg') + '<div class="stack" style="gap:6px"><div class="inline">' + statusPill(b.status) + (b.adult ? pill('bad', '18+') : '') + (b.featured ? pill('info', 'Đề cử') : '') + '</div><p class="hint">' + esc(b.syn) + '</p><div class="tags">' + b.genres.map((g) => tagHtml(g)).join('') + b.tags.map((x) => tagHtml('#' + x, 'soft')).join('') + '</div></div></div>', ok: 'Đóng', cancel: 'Huỷ' }); return; }
    if (a('data-newchap') !== null) { newChapterDialog(a('data-newchap') || state.chapters.slug || LIB[0].slug); return; }

    /* --- form truyện --- */
    if (a('data-cover-pick') !== null) {
      openModal({
        title: 'Chọn ảnh bìa', sub: 'Dán URL ảnh hoặc chọn từ thư viện mẫu',
        body: '<div class="field"><label for="coverUrl">URL ảnh</label><input class="inp" id="coverUrl" type="url" placeholder="https://…" value="' + esc(val('sfCover')) + '"></div>' +
          '<div class="hint">Gợi ý: ảnh 3:4, tối thiểu 600×800px, định dạng JPG/PNG/WebP.</div>',
        ok: 'Dùng ảnh',
        onOk: (root) => {
          const u = root.querySelector('#coverUrl').value.trim();
          const f = $('#sfCover'); if (f) f.value = u;
          const drop = $('#coverDrop');
          if (drop) drop.innerHTML = u ? '<img src="' + esc(u) + '" alt="Ảnh bìa" onerror="this.remove()">' : icon('image', 22);
          toast('Đã cập nhật ảnh bìa');
        },
      });
      return;
    }
    if (a('data-genre-add') !== null) {
      const pick = $('#genrePick');
      if (!pick || !pick.value || state.form.genres.length >= 3) return;
      state.form.genres.push(pick.value);
      const chips = $('#genreChips');
      if (chips) {
        const hint = chips.querySelector('.tag.soft'); if (hint) hint.remove();
        chips.insertAdjacentHTML('beforeend', tagHtml(pick.value, '', true, 'data-genre-del="' + esc(pick.value) + '" aria-label="Bỏ thể loại ' + esc(pick.value) + '"'));
      }
      pick.querySelector('option[value="' + pick.value.replace(/"/g, '') + '"]').remove();
      const cnt = $('#genreCount'); if (cnt) cnt.textContent = state.form.genres.length + '/3';
      const addBtn = document.querySelector('[data-genre-add]');
      if (state.form.genres.length >= 3) { pick.disabled = true; if (addBtn) addBtn.disabled = true; }
      return;
    }
    if (a('data-genre-del') !== null) {
      const g = a('data-genre-del');
      state.form.genres = state.form.genres.filter((x) => x !== g);
      const chip = el.closest('.tag'); if (chip) chip.remove();
      const chips = $('#genreChips');
      if (chips && !chips.querySelector('.tag')) chips.innerHTML = '<span class="tag soft">Chưa gắn thể loại nào</span>';
      const pick = $('#genrePick');
      if (pick) {
        const o = document.createElement('option'); o.value = g; o.textContent = g; pick.appendChild(o);
        pick.disabled = false;
      }
      const addBtn = document.querySelector('[data-genre-add]');
      if (addBtn) addBtn.disabled = false;
      const cnt = $('#genreCount'); if (cnt) cnt.textContent = state.form.genres.length + '/3';
      return;
    }
    if (a('data-tag-add') !== null) { addTag(a('data-tag-add')); return; }
    if (a('data-tag-del') !== null) { removeTag(a('data-tag-del')); return; }
    if (a('data-warn') !== null) {
      const w = a('data-warn');
      const i = state.form.warn.indexOf(w);
      if (i >= 0) state.form.warn.splice(i, 1); else state.form.warn.push(w);
      el.classList.toggle('warn', i < 0);
      el.classList.toggle('soft', i >= 0);
      el.setAttribute('aria-pressed', String(i < 0));
      el.innerHTML = (i < 0 ? icon('alert', 12) : icon('plus', 12)) + esc(w);
      if (w === '18+') { const cb = $('#sfAdult'); if (cb) cb.checked = i < 0; }
      return;
    }

    /* --- chương --- */
    if (a('data-ctab')) { state.chapters.tab = a('data-ctab'); state.chapters.page = 1; render(); return; }
    if (a('data-cpage')) { const n = Number(a('data-cpage')); if (n >= 1) { state.chapters.page = n; render(); } return; }
    if (a('data-clear-ch') !== null) { state.chapters = { tab: 'all', q: '', slug: '', page: 1 }; render(); return; }
    if (a('data-approve')) {
      const [slug, n] = a('data-approve').split('/');
      const c = chapterOf(slug, n);
      if (c) { c.status = 'published'; pushLog('chapter.approve', bySlug(slug).title + ' · C' + n); afterChange('Đã duyệt chương ' + n, bySlug(slug).title); }
      return;
    }
    if (a('data-approve-all') !== null) {
      const q2 = chapterQueue();
      q2.forEach((c) => { c.status = 'published'; });
      pushLog('chapter.approve_bulk', q2.length + ' chương');
      afterChange('Đã duyệt ' + q2.length + ' chương', 'Tất cả chương đang chờ duyệt');
      return;
    }
    if (a('data-reject')) {
      const [slug, n] = a('data-reject').split('/');
      const c = chapterOf(slug, n);
      confirmDo({
        title: 'Từ chối chương ' + n + '?', sub: bySlug(slug).title,
        body: '<div class="field"><label for="rjNote">Lý do gửi tác giả</label><textarea class="ta" id="rjNote" rows="3" placeholder="Ví dụ: thiếu đoạn kết, sai chính tả nhiều…"></textarea></div>',
        ok: 'Từ chối',
        onOk: () => { if (c) c.status = 'rejected'; pushLog('chapter.reject', bySlug(slug).title + ' · C' + n); afterChange('Đã từ chối chương ' + n); },
      });
      return;
    }
    if (a('data-preview-ch')) { const [s2, n2] = a('data-preview-ch').split('/'); previewChapterDialog(s2, n2); return; }
    if (a('data-open')) { const [s3, n3] = a('data-open').split('/'); go('editor/' + s3 + '/' + n3); return; }
    if (a('data-ed')) {
      const mode = a('data-ed');
      if (mode === 'preview') previewChapterDialog(state.editor.slug, state.editor.n);
      else if (mode === 'draft') saveChapter('draft');
      else saveChapter('publish');
      return;
    }
    if (a('data-fmt')) {
      const cmd = a('data-fmt');
      const body = $('#edBody');
      if (!body) return;
      body.focus();
      try {
        if (cmd === 'undo') document.execCommand('undo');
        else if (cmd === 'quote') document.execCommand('formatBlock', false, 'blockquote');
        else if (cmd === 'h2') document.execCommand('formatBlock', false, 'h2');
        else document.execCommand(cmd);
      } catch (err) { /* trình duyệt không hỗ trợ */ }
      if (cmd !== 'undo') {
        const pressed = el.getAttribute('aria-pressed') === 'true';
        el.setAttribute('aria-pressed', String(!pressed));
      }
      edTouch();
      return;
    }

    /* --- taxonomy --- */
    if (a('data-tax-add')) {
      const kind = a('data-tax-add');
      const inp = $('#taxNew-' + kind);
      const name = inp ? inp.value.trim().replace(/^#/, '') : '';
      if (!name) { toast('Chưa thêm được', 'Nhập tên trước đã.', 'err'); return; }
      const exists = kind === 'genre' ? GENRES.some((g) => fold(g.name) === fold(name)) : kind === 'tag' ? TAGS.some((t) => fold(t) === fold(name)) : WARNS.some((w) => fold(w.name) === fold(name));
      if (exists) { toast('Đã tồn tại', name + ' đã có trong danh sách.', 'err'); return; }
      if (kind === 'genre') GENRES.push({ name, note: '' });
      else if (kind === 'tag') TAGS.push(name);
      else WARNS.push({ name, note: '' });
      pushLog('taxonomy.create', name);
      afterChange('Đã thêm', name);
      return;
    }
    if (a('data-tax-edit')) {
      const [kind, name] = a('data-tax-edit').split('|');
      openModal({
        title: 'Đổi tên', sub: name,
        body: '<div class="field"><label for="taxName">Tên mới</label><input class="inp" id="taxName" type="text" value="' + esc(name) + '"></div>',
        ok: 'Lưu',
        validate: (root) => {
          const nv = root.querySelector('#taxName').value.trim().replace(/^#/, '');
          if (!nv) return 'Tên không được để trống.';
          if (kind === 'genre' ? GENRES.some((g) => fold(g.name) === fold(nv) && g.name !== name) : kind === 'tag' ? TAGS.some((t) => fold(t) === fold(nv) && t !== name) : WARNS.some((w) => fold(w.name) === fold(nv) && w.name !== name)) return 'Tên này đã tồn tại.';
          return true;
        },
        onOk: (root) => {
          const nv = root.querySelector('#taxName').value.trim().replace(/^#/, '');
          if (kind === 'genre') {
            const g = GENRES.find((x) => x.name === name); if (g) g.name = nv;
            LIB.forEach((b) => { b.genres = b.genres.map((x) => (x === name ? nv : x)); });
          } else if (kind === 'tag') {
            const i = TAGS.indexOf(name); if (i >= 0) TAGS[i] = nv;
            LIB.forEach((b) => { b.tags = b.tags.map((x) => (x === name ? nv : x)); });
          } else {
            const w = WARNS.find((x) => x.name === name); if (w) w.name = nv;
            LIB.forEach((b) => { b.warn = b.warn.map((x) => (x === name ? nv : x)); });
          }
          pushLog('taxonomy.update', name + ' → ' + nv);
          afterChange('Đã đổi tên', nv);
        },
      });
      return;
    }
    if (a('data-tax-del')) {
      const [kind, name] = a('data-tax-del').split('|');
      confirmDo({
        title: 'Xoá ' + (kind === 'tag' ? '#' + name : name) + '?',
        sub: 'Sẽ gỡ khỏi mọi truyện đang dùng.',
        ok: 'Xoá',
        onOk: () => {
          if (kind === 'genre') { const i = GENRES.findIndex((g) => g.name === name); if (i >= 0) GENRES.splice(i, 1); LIB.forEach((b) => { b.genres = b.genres.filter((x) => x !== name); }); }
          else if (kind === 'tag') { const i = TAGS.indexOf(name); if (i >= 0) TAGS.splice(i, 1); LIB.forEach((b) => { b.tags = b.tags.filter((x) => x !== name); }); }
          else { const i = WARNS.findIndex((w) => w.name === name); if (i >= 0) WARNS.splice(i, 1); LIB.forEach((b) => { b.warn = b.warn.filter((x) => x !== name); }); }
          pushLog('taxonomy.delete', name);
          afterChange('Đã xoá', name);
        },
      });
      return;
    }
    if (a('data-tax-help') !== null) {
      openModal({
        title: 'Quy ước đặt thẻ', wide: true,
        body: '<div class="stack" style="gap:12px"><p class="hint">Thẻ nội dung là từ khoá ngắn, viết thường, không dấu chấm. Mỗi truyện tối đa 8 thẻ.</p>' +
          '<div class="notice">' + icon('info', 15) + '<span>Thể loại (tối đa 3) dùng cho bộ lọc thư viện. Cảnh báo (18+, Bạo lực, Nội dung nhạy cảm) luôn hiển thị đầu danh sách.</span></div>' +
          '<div class="tags">' + TAGS.slice(0, 8).map((t) => tagHtml('#' + t)).join('') + '</div></div>',
        ok: 'Đã hiểu', cancel: 'Đóng',
      });
      return;
    }

    /* --- người dùng --- */
    if (a('data-userstab')) { go(a('data-userstab') === 'staff' ? 'users/staff' : 'users'); return; }
    if (a('data-author')) { findAuthorbooks(a('data-author')); return; }
    if (a('data-author-mail')) {
      openModal({
        title: 'Gửi email', sub: a('data-author-mail'),
        body: '<div class="field"><label for="mailSub">Tiêu đề</label><input class="inp" id="mailSub" type="text" placeholder="Ví dụ: Lịch đăng chương tháng 11"></div>' +
          '<div class="field"><label for="mailBody">Nội dung</label><textarea class="ta" id="mailBody" rows="4" placeholder="Nội dung gửi tác giả…"></textarea></div>',
        ok: 'Gửi',
        validate: (root) => (root.querySelector('#mailSub').value.trim() && root.querySelector('#mailBody').value.trim() ? true : 'Nhập tiêu đề và nội dung.'),
        onOk: () => { pushLog('author.mail', a('data-author-mail')); toast('Đã gửi email', 'Bản xem trước không gửi thật.'); },
      });
      return;
    }
    if (a('data-lock-author')) {
      const au = AUTHORS.find((x) => x.id === a('data-lock-author'));
      if (!au) return;
      if (au.locked) { au.locked = false; afterChange('Đã mở khoá', au.name); return; }
      confirmDo({
        title: 'Khoá tài khoản tác giả?', sub: au.name,
        body: '<div class="field"><label for="lockReason">Lý do</label><select class="sel" id="lockReason"><option>Vi phạm bản quyền</option><option>Nội dung không phù hợp</option><option>Tài khoản trùng lặp</option></select></div>',
        ok: 'Khoá tài khoản',
        onOk: () => { au.locked = true; pushLog('author.lock', au.name); afterChange('Đã khoá tài khoản', au.name); },
      });
      return;
    }
    if (a('data-staff-invite') !== null) {
      openModal({
        title: 'Thêm nhân sự quản trị', sub: 'Người được thêm sẽ nhận email mời.',
        body: '<div class="field"><label for="stfName">Họ tên</label><input class="inp" id="stfName" type="text" placeholder="Nguyễn Văn A"></div>' +
          '<div class="field"><label for="stfEmail">Email</label><input class="inp" id="stfEmail" type="email" placeholder="ten@ssochuz.com"></div>' +
          '<div class="field"><label for="stfRole">Vai trò</label><select class="sel" id="stfRole">' +
            Object.keys(ROLES).filter((r) => r !== 'super_admin').map((r) => '<option value="' + r + '">' + ROLES[r].label + '</option>').join('') + '</select></div>',
        ok: 'Gửi lời mời',
        validate: (root) => {
          const em = root.querySelector('#stfEmail').value.trim();
          const nm = root.querySelector('#stfName').value.trim();
          if (!nm) return 'Nhập họ tên.';
          if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(em)) return 'Email không hợp lệ.';
          if (STAFF.some((s) => s.email.toLowerCase() === em.toLowerCase())) return 'Email này đã có trong danh sách.';
          return true;
        },
        onOk: (root) => {
          const em = root.querySelector('#stfEmail').value.trim();
          STAFF.push({ id: 'st' + (STAFF.length + 1), name: root.querySelector('#stfName').value.trim(), email: em, role: root.querySelector('#stfRole').value, last: '—', initials: initials(root.querySelector('#stfName').value) });
          pushLog('staff.invite', em);
          afterChange('Đã gửi lời mời', em);
        },
      });
      return;
    }
    if (a('data-staff-del')) {
      const m = STAFF.find((x) => x.id === a('data-staff-del'));
      if (!m) return;
      if (m.id === 'st1') { toast('Không thể gỡ', 'Tài khoản Super Admin gốc không thể gỡ.', 'err'); return; }
      confirmDo({
        title: 'Gỡ quyền quản trị?', sub: m.name + ' · ' + m.email,
        note: 'Người này sẽ mất toàn bộ quyền quản trị ngay lập tức.',
        ok: 'Gỡ quyền',
        onOk: () => { const i = STAFF.indexOf(m); STAFF.splice(i, 1); pushLog('staff.remove', m.email); afterChange('Đã gỡ quyền', m.name); },
      });
      return;
    }

    /* --- bình luận --- */
    if (a('data-cmttab')) {
      const k = a('data-cmttab');
      go(k === 'reports' || k === 'votes' ? 'comments/' + k : 'comments/' + k);
      return;
    }
    if (a('data-cmt')) {
      const [act, id] = a('data-cmt').split('|');
      const c = COMMENTS.find((x) => x.id === id);
      if (!c) return;
      if (act === 'del') {
        confirmDo({ title: 'Xoá bình luận?', sub: c.name + ' · ' + bySlug(c.slug).title, ok: 'Xoá', onOk: () => { const i = COMMENTS.indexOf(c); COMMENTS.splice(i, 1); pushLog('comment.delete', c.name); afterChange('Đã xoá bình luận'); } });
        return;
      }
      c.status = act === 'approve' ? 'approved' : 'hidden';
      pushLog(act === 'approve' ? 'comment.approve' : 'comment.hide', c.name);
      afterChange(act === 'approve' ? 'Đã duyệt bình luận' : 'Đã ẩn bình luận', c.name);
      return;
    }
    if (a('data-rp')) {
      const r = REPORTS.find((x) => x.id === a('data-rp'));
      if (!r) return;
      r.status = r.status === 'open' ? 'done' : 'open';
      pushLog('report.' + r.status, r.kind);
      afterChange(r.status === 'done' ? 'Đã đánh dấu xử lý' : 'Đã mở lại báo lỗi', r.kind);
      return;
    }
    if (a('data-vote-del')) {
      const v = VOTES.find((x) => x.id === a('data-vote-del'));
      if (!v) return;
      confirmDo({
        title: 'Gỡ phiếu bầu?', sub: v.by + ' · ' + bySlug(v.slug).title,
        ok: 'Gỡ phiếu',
        onOk: () => { const i = VOTES.indexOf(v); VOTES.splice(i, 1); pushLog('vote.remove', v.by); afterChange('Đã gỡ phiếu', v.by); },
      });
      return;
    }

    /* --- doanh thu --- */
    if (a('data-revtab')) { go('revenue/' + a('data-revtab')); return; }
    if (a('data-pkg-edit') !== null || a('data-pkg-new') !== null) {
      const editing = a('data-pkg-edit') !== null && a('data-pkg-edit');
      const pkg = editing ? PACKAGES.find((p) => p.id === editing) : { id: 'p' + Date.now(), price: 100000, base: 1000, bonus: 0, label: '', on: true };
      if (!editing) PACKAGES.push(pkg);
      openModal({
        title: editing ? 'Sửa gói xu' : 'Thêm gói xu', sub: 'Giá bán, số xu và phần trăm thưởng',
        body: '<div class="row2"><div class="field"><label for="pkPrice">Giá (đ)</label><input class="inp" id="pkPrice" type="number" min="1000" step="1000" value="' + pkg.price + '"></div>' +
          '<div class="field"><label for="pkBase">Số xu</label><input class="inp" id="pkBase" type="number" min="1" value="' + pkg.base + '"></div></div>' +
          '<div class="row2"><div class="field"><label for="pkBonus">Thưởng (%)</label><input class="inp" id="pkBonus" type="number" min="0" max="100" value="' + pkg.bonus + '"></div>' +
          '<div class="field"><label for="pkLabel">Nhãn</label><select class="sel" id="pkLabel">' +
            [['', 'Không nhãn'], ['Phổ biến', 'Phổ biến'], ['Lời nhất', 'Lời nhất']].map((o) => '<option value="' + o[0] + '"' + (pkg.label === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div>' +
          '<div class="notice">' + icon('info', 15) + '<span>Giá quy đổi: ' + (Math.round((Number(pkg.price) || 0) / Math.max(1, pkg.base))) + 'đ / 1 xu · người nhận ' + (pkg.base + Math.round((pkg.base * pkg.bonus) / 100)) + ' xu</span></div>',
        ok: editing ? 'Lưu gói' : 'Thêm gói',
        validate: (root) => {
          const price = Number(root.querySelector('#pkPrice').value);
          const base = Number(root.querySelector('#pkBase').value);
          const bonus = Number(root.querySelector('#pkBonus').value);
          if (!(price > 0)) return 'Giá phải lớn hơn 0.';
          if (!(base > 0)) return 'Số xu phải lớn hơn 0.';
          if (bonus < 0 || bonus > 100) return 'Thưởng phải trong khoảng 0–100%.';
          return true;
        },
        onOk: (root) => {
          pkg.price = Number(root.querySelector('#pkPrice').value);
          pkg.base = Number(root.querySelector('#pkBase').value);
          pkg.bonus = Number(root.querySelector('#pkBonus').value);
          pkg.label = root.querySelector('#pkLabel').value;
          pushLog(editing ? 'package.update' : 'package.create', vnd(pkg.price));
          afterChange(editing ? 'Đã lưu gói xu' : 'Đã thêm gói xu', vnd(pkg.price) + ' · ' + fmt(pkg.base) + ' xu');
        },
      });
      return;
    }
    if (a('data-xu-save') !== null) {
      const rate = Number(val('xuRate'));
      const share = Number(val('xuShare'));
      const exp = Number(val('xuExpire'));
      const min = Number(val('xuMin'));
      if (!(rate > 0)) { toast('Chưa lưu được', 'Tỉ giá phải lớn hơn 0.', 'err'); return; }
      if (share < 0 || share > 100) { toast('Chưa lưu được', 'Phần trăm tác giả nhận phải từ 0 đến 100.', 'err'); return; }
      if (!(exp >= 1)) { toast('Chưa lưu được', 'Số ngày hết hạn phải ít nhất 1.', 'err'); return; }
      if (min < 0) { toast('Chưa lưu được', 'Rút tiền tối thiểu không hợp lệ.', 'err'); return; }
      XU.rate = rate; XU.authorShare = share; XU.expireDays = exp; XU.minWithdraw = min;
      pushLog('xu.config', rate + 'đ/xu · ' + share + '%');
      toast('Đã lưu cấu hình xu', 'Tỉ giá ' + fmt(rate) + 'đ / 1 xu · tác giả ' + share + '%');
      return;
    }
    if (a('data-withdraw')) {
      const [act, id] = a('data-withdraw').split('|');
      const w = WITHDRAWS.find((x) => x.id === id);
      if (!w) return;
      confirmDo({
        title: (act === 'pay' ? 'Duyệt chuyển tiền?' : 'Từ chối yêu cầu?'),
        sub: w.author + ' · ' + vnd(w.amount),
        body: '<p class="hint">' + esc(w.bank) + '</p>',
        ok: act === 'pay' ? 'Duyệt & chuyển' : 'Từ chối', danger: act !== 'pay',
        onOk: () => { w.status = act === 'pay' ? 'paid' : 'rejected'; pushLog('withdraw.' + act, w.author); afterChange(act === 'pay' ? 'Đã duyệt yêu cầu' : 'Đã từ chối yêu cầu', vnd(w.amount)); },
      });
      return;
    }

    /* --- cài đặt --- */
    if (a('data-settab')) { go('settings/' + a('data-settab')); return; }
    if (a('data-slide-add') !== null) {
      openModal({
        title: 'Thêm slide trang chủ', sub: 'Chọn truyện và đặt tiêu đề ngắn',
        body: '<div class="field"><label for="slBook">Truyện</label><select class="sel" id="slBook">' +
          LIB.slice().sort((a2, b2) => b2.updated.localeCompare(a2.updated)).slice(0, 40).map((b) => '<option value="' + b.slug + '">' + esc(b.title) + '</option>').join('') + '</select></div>' +
          '<div class="field"><label for="slTitle">Tiêu đề slide</label><input class="inp" id="slTitle" type="text" placeholder="Ví dụ: Bộ mới lên sóng tuần này"></div>',
        ok: 'Thêm slide',
        validate: (root) => (root.querySelector('#slTitle').value.trim() ? true : 'Nhập tiêu đề slide.'),
        onOk: (root) => {
          SETTINGS.heroSlides.push({ slug: root.querySelector('#slBook').value, title: root.querySelector('#slTitle').value.trim() });
          pushLog('homepage.slide_add', root.querySelector('#slTitle').value.trim());
          afterChange('Đã thêm slide', SETTINGS.heroSlides.length + '/8');
        },
      });
      return;
    }
    if (a('data-slide-del')) {
      const i = Number(a('data-slide-del'));
      SETTINGS.heroSlides.splice(i, 1);
      afterChange('Đã bỏ slide', SETTINGS.heroSlides.length + '/8');
      return;
    }
    if (a('data-slide-up')) {
      const i = Number(a('data-slide-up'));
      if (i > 0) { const tmp = SETTINGS.heroSlides[i - 1]; SETTINGS.heroSlides[i - 1] = SETTINGS.heroSlides[i]; SETTINGS.heroSlides[i] = tmp; }
      render();
      return;
    }
    if (a('data-pick-add') !== null) {
      const sel = $('#pickSel');
      if (!sel || !sel.value) { toast('Chưa chọn truyện', 'Chọn một truyện trong danh sách.', 'err'); return; }
      if (SETTINGS.editorChoice.length >= 12) { toast('Đã đủ 12 bộ', 'Bỏ bớt một bộ trước khi ghim.', 'err'); return; }
      SETTINGS.editorChoice.push(sel.value);
      const b = bySlug(sel.value);
      if (b) b.featured = true;
      afterChange('Đã ghim vào biên tập chọn', (b || {}).title);
      return;
    }
    if (a('data-pick-del')) {
      const slug = a('data-pick-del');
      SETTINGS.editorChoice = SETTINGS.editorChoice.filter((s) => s !== slug);
      const b = bySlug(slug);
      if (b) b.featured = false;
      afterChange('Đã bỏ khỏi biên tập chọn');
      return;
    }
    if (a('data-hp-preview')) { state.settings.preview = a('data-hp-preview'); render(); return; }
    if (a('data-home-save') !== null) { pushLog('homepage.save', 'Trang chủ'); toast('Đã lưu trang chủ', SETTINGS.heroSlides.length + ' slide · ' + SETTINGS.editorChoice.length + ' bộ đề cử'); return; }
    if (a('data-set')) {
      const act = a('data-set');
      if (act === 'backup') { exportData('json'); pushLog('data.backup', 'registry.json'); return; }
      if (act === 'restore') {
        openModal({
          title: 'Khôi phục từ tệp sao lưu', sub: 'Dán nội dung tệp JSON đã tải về',
          body: '<div class="field"><label for="restoreBox">Nội dung JSON</label><textarea class="ta mono" id="restoreBox" rows="6" placeholder="{ &quot;books&quot;: [ … ] }"></textarea></div>',
          ok: 'Khôi phục',
          validate: (root) => {
            const txt = root.querySelector('#restoreBox').value.trim();
            if (!txt) return 'Chưa có nội dung.';
            try { JSON.parse(txt); } catch (err) { return 'Nội dung không phải JSON hợp lệ.'; }
            return true;
          },
          onOk: () => { pushLog('data.restore', 'registry.json'); toast('Đã khôi phục', 'Bản xem trước chỉ mô phỏng thao tác.'); },
        });
        return;
      }
      if (act === 'blogger') {
        const box = $('#bloggerBox');
        const txt = box ? box.value.trim() : '';
        if (!txt) { toast('Chưa có nội dung', 'Dán dữ liệu xuất từ Blogger vào ô nhập.', 'err'); return; }
        if (txt.length < 40) { toast('Dữ liệu quá ngắn', 'Cần ít nhất 40 ký tự để nhận diện.', 'err'); return; }
        pushLog('data.blogger_import', txt.length + ' ký tự');
        toast('Đã nhập dữ liệu', '1 bộ truyện mới được tạo ở trạng thái nháp.');
        go('stories');
        return;
      }
      if (act === 'reset') {
        confirmDo({ title: 'Đặt lại dữ liệu mẫu?', sub: '67 bộ truyện gốc', ok: 'Đặt lại', onOk: () => { toast('Đã đặt lại', 'Tải lại trang để thấy dữ liệu gốc.'); } });
        return;
      }
    }
    if (a('data-doc-scan') !== null) {
      const bad = dataChecks().reduce((x, c) => x + c.items.length, 0);
      toast(bad ? 'Kiểm tra xong' : 'Dữ liệu sạch', bad ? bad + ' vấn đề cần xem.' : 'Không phát hiện vấn đề.', bad ? 'info' : 'ok');
      render();
      return;
    }
    if (a('data-doc-fix')) {
      const kind = a('data-doc-fix');
      if (kind === 'cover') { LIB.forEach((b) => { if (!b.thumb) b.thumb = ''; }); toast('Đã áp dụng', 'Ảnh bìa mặc định sẽ dùng cho truyện thiếu ảnh.'); }
      else if (kind === 'syn') toast('Cần bổ sung tay', 'Mở từng truyện để viết giới thiệu.', 'info');
      else if (kind === 'zero') go('stories');
      else go('stories');
      return;
    }

    /* --- xem trước --- */
    if (a('data-prevtab')) { go('preview/' + a('data-prevtab')); return; }
    if (a('data-pay') !== null) {
      const pkg = pkgById(state.reader.pkg);
      if (!pkg.on) { toast('Gói đang tắt', 'Chọn gói khác để thanh toán.', 'err'); return; }
      state.reader.paying = true;
      render();
      setTimeout(() => {
        const bonus = Math.round((pkg.base * pkg.bonus) / 100);
        WALLET.paid += pkg.base;
        WALLET.bonus += bonus;
        TX.unshift({ at: new Date().toISOString(), by: 'Snow', note: 'Nạp gói ' + fmt(pkg.base) + ' xu qua ' + (METHODS.find((m) => m.id === state.reader.method) || METHODS[0]).name, xu: pkg.base + bonus, status: 'ok' });
        state.reader.paying = false;
        render();
        openModal({
          title: 'Thanh toán thành công',
          sub: vnd(pkg.price) + ' · ' + fmt(pkg.base) + ' xu' + (bonus ? ' + ' + fmt(bonus) + ' xu thưởng' : ''),
          body: '<div class="notice">' + icon('checkCircle', 15) + '<span>Xu đã vào ví. Xu thưởng hết hạn sau ' + XU.expireDays + ' ngày và được trừ trước xu đã nạp.</span></div>' +
            '<dl class="kv"><dt>Số dư mới</dt><dd>' + fmt(walletTotal()) + ' xu</dd><dt>Phương thức</dt><dd>' + esc((METHODS.find((m) => m.id === state.reader.method) || METHODS[0]).name) + '</dd></dl>',
          ok: 'Đóng', cancel: 'Huỷ',
        });
        toast('Nạp xu thành công', fmt(pkg.base + bonus) + ' xu đã vào ví.');
      }, 1200);
      return;
    }
    if (a('data-unlock')) {
      const [slug, n] = a('data-unlock').split('/');
      const item = VIP_LIST.find((v) => v.slug === slug && String(v.n) === n);
      if (!item) return;
      const id = unlockId(slug, n);
      if (UNLOCKED.has(id)) return;
      if (walletTotal() < item.price) { toast('Không đủ xu', 'Nạp thêm xu để mở khoá chương này.', 'err'); return; }
      confirmDo({
        title: 'Mở khoá chương ' + n + '?', sub: bySlug(slug).title,
        body: '<dl class="kv"><dt>Giá chương</dt><dd>' + item.price + ' xu</dd><dt>Số dư hiện tại</dt><dd>' + fmt(walletTotal()) + ' xu</dd><dt>Sau khi mở</dt><dd>' + fmt(walletTotal() - item.price) + ' xu</dd></dl>' +
          '<p class="hint">Xu thưởng được trừ trước, sau đó mới đến xu đã nạp.</p>',
        ok: 'Mở khoá', danger: false,
        onOk: () => {
          let left = item.price;
          const useBonus = Math.min(WALLET.bonus, left);
          WALLET.bonus -= useBonus; left -= useBonus;
          WALLET.paid -= left;
          UNLOCKED.add(id);
          TX.unshift({ at: new Date().toISOString(), by: 'Snow', note: 'Mở khoá Chương ' + n + ' – ' + bySlug(slug).title, xu: -item.price, status: 'used' });
          render();
          toast('Đã mở khoá', 'Chương ' + n + ' · ' + bySlug(slug).title);
        },
      });
      return;
    }
    if (a('data-read')) { const [s4, n4] = a('data-read').split('/'); previewChapterDialog(s4, n4); return; }
  });

  /* ---- input ---- */
  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'libQ') { state.lib.q = e.target.value; state.lib.page = 1; clearTimeout(state.typing); state.typing = setTimeout(() => { render(); const q = $('#libQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); }
    else if (id === 'chQ') { state.chapters.q = e.target.value; state.chapters.page = 1; clearTimeout(state.typing); state.typing = setTimeout(() => { render(); const q = $('#chQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); }
    else if (id === 'userQ') { state.users.q = e.target.value; clearTimeout(state.typing); state.typing = setTimeout(() => { render(); const q = $('#userQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); }
    else if (id === 'cmtQ') { state.cmts.q = e.target.value; clearTimeout(state.typing); state.typing = setTimeout(() => { render(); const q = $('#cmtQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); }
    else if (id === 'txQ') { state.revenue.q = e.target.value; clearTimeout(state.typing); state.typing = setTimeout(() => { render(); const q = $('#txQ'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); }
    else if (id === 'sfTitle') {
      const f = state.form;
      f.title = e.target.value;
      markField('sfTitle', false);
      if (!f.slugTouched) {
        const s = $('#sfSlug');
        const sl = slugify(e.target.value);
        if (s) s.value = sl;
        const hint = $('#f-sfSlug .hint');
        if (hint) hint.innerHTML = 'ssochuz.pages.dev/truyen/<b>' + esc(sl || 'duong-dan') + '</b>/';
      }
    }
    else if (id === 'sfSlug') { state.form.slugTouched = true; state.form.slug = slugify(e.target.value); const s = e.target; const v2 = slugify(s.value); if (s.value !== v2) { const pos = s.selectionStart; s.value = v2; s.setSelectionRange(pos, pos); } const hint = $('#f-sfSlug .hint'); if (hint) hint.innerHTML = 'ssochuz.pages.dev/truyen/<b>' + esc(v2 || 'duong-dan') + '</b>/'; }
    else if (id === 'sfSyn') { const n = e.target.value.length; const c = $('#sfSynCount'); if (c) c.textContent = n; }
    else if (id === 'sfAuthor') { markField('sfAuthor', false); state.form.author = e.target.value; }
    else if (id === 'sfCover') { const drop = $('#coverDrop'); if (drop) drop.innerHTML = e.target.value ? '<img src="' + esc(e.target.value) + '" alt="Ảnh bìa" onerror="this.remove()">' : icon('image', 22); }
    else if (id === 'tagInput') {
      const v2 = e.target.value;
      if (v2.indexOf(',') >= 0) {
        v2.split(',').forEach((x) => { if (x.trim()) addTag(x.trim()); });
        e.target.value = '';
        updateTagSuggest('');
      } else {
        updateTagSuggest(v2);
      }
    }
    else if (id === 'edTitle' || id === 'edBody') { if (id === 'edTitle') { const c = currentChapter(); if (c) c.t = e.target.value; } edTouch(); }
    else if (id === 'paletteInput') { state.palette.index = 0; renderPalette(); }
    else if (id === 'coverUrl') { /* trong modal */ }
    else if (id === 'edSched' || id === 'edNum') { /* không cần */ }
  });

  /* ---- change ---- */
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    const t = e.target;
    if (id === 'libStatus') { state.lib.status = t.value; state.lib.page = 1; render(); }
    else if (id === 'libAge') { state.lib.age = t.value; state.lib.page = 1; render(); }
    else if (id === 'libPub') { state.lib.pub = t.value; state.lib.page = 1; render(); }
    else if (id === 'chBook') { state.chapters.slug = t.value; state.chapters.page = 1; render(); }
    else if (id === 'checkAll') {
      const rows = libRows().slice((state.lib.page - 1) * state.lib.per, state.lib.page * state.lib.per);
      if (t.checked) rows.forEach((b) => state.lib.sel.add(b.slug)); else state.lib.sel.clear();
      render();
    }
    else if (t.matches('[data-check]')) {
      const slug = t.getAttribute('data-check');
      if (t.checked) state.lib.sel.add(slug); else state.lib.sel.delete(slug);
      render();
    }
    else if (id === 'edStatus') {
      const wrap = $('#edSchedWrap');
      if (wrap) wrap.hidden = t.value !== 'scheduled';
    }
    else if (id === 'edVip') {
      const wrap = $('#edPriceWrap');
      if (wrap) wrap.hidden = !t.checked;
      state.editor.vip = t.checked;
    }
    else if (t.matches('[data-staff-role]')) {
      const m = STAFF.find((x) => x.id === t.getAttribute('data-staff-role'));
      if (!m) return;
      if (m.id === 'st1') { t.value = m.role; toast('Không thể đổi', 'Vai trò Super Admin gốc được khoá.', 'err'); return; }
      m.role = t.value;
      pushLog('staff.role', m.email + ' → ' + ROLES[m.role].label);
      toast('Đã đổi vai trò', m.name + ' · ' + ROLES[m.role].label);
    }
    else if (t.matches('[data-pkg-on]')) {
      const pkg = PACKAGES.find((p) => p.id === t.getAttribute('data-pkg-on'));
      if (pkg) { pkg.on = t.checked; pushLog('package.toggle', vnd(pkg.price) + ' · ' + (t.checked ? 'bật' : 'tắt')); toast(t.checked ? 'Đã bật gói' : 'Đã tắt gói', vnd(pkg.price)); }
    }
    else if (t.name === 'pkg') { state.reader.pkg = t.value; render(); }
    else if (t.name === 'pay') { state.reader.method = t.value; }
  });

  /* ---- submit ---- */
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'storyForm') { e.preventDefault(); saveStory(); }
    else if (e.target.id === 'siteForm') {
      e.preventDefault();
      const name = val('stName');
      markField('stName', !name, ' Nhập tên trang.');
      if (!name) { toast('Chưa lưu được', 'Tên trang không được để trống.', 'err'); return; }
      SETTINGS.siteName = name;
      SETTINGS.siteUrl = val('stUrl');
      SETTINGS.tagline = val('stTag');
      SETTINGS.reportForm = val('stReport');
      SETTINGS.giscus = val('stGiscus');
      SETTINGS.auth = val('stAuth');
      SETTINGS.announcement = isChecked('stAnn');
      SETTINGS.announcementText = val('stAnnText');
      SETTINGS.donate = isChecked('stDonate');
      pushLog('settings.update', name);
      toast('Đã lưu cài đặt', name);
    }
  });

  /* ---- keyboard ---- */
  document.addEventListener('keydown', (e) => {
    const dlg = $('#palette');
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      const form = $('#storyForm') || $('#siteForm');
      if (form) { e.preventDefault(); if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); }
      return;
    }
    if (e.key === 'Escape') {
      if ($('#modalRoot').getAttribute('data-modal') === '1') { closeModal(); return; }
      if (dlg && dlg.open) { dlg.close(); return; }
      if (state.drawer) { openDrawer(false); return; }
    }
    if (dlg && dlg.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); state.palette.index = Math.min(state.palette.index + 1, state.palette.items.length - 1); renderPalette(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); state.palette.index = Math.max(0, state.palette.index - 1); renderPalette(); }
      else if (e.key === 'Enter') { e.preventDefault(); runPalette(state.palette.index); }
    }
  });

  document.addEventListener('click', (e) => {
    const pick = e.target.closest && e.target.closest('[data-pick]');
    if (pick) { runPalette(Number(pick.getAttribute('data-pick'))); }
  });

  window.addEventListener('hashchange', () => { closeModal(); route(); });
}

/* ---- thẻ trong form ---- */
function addTag(raw) {
  const name = String(raw || '').trim().replace(/^#/, '').replace(/,$/, '');
  if (!name) return;
  if (state.form.tags.length >= 8) { toast('Đã đủ 8 thẻ', 'Bỏ bớt một thẻ trước khi thêm.', 'err'); return; }
  if (state.form.tags.some((t) => fold(t) === fold(name))) return;
  state.form.tags.push(name);
  const box = $('#tagBox');
  const input = $('#tagInput');
  if (box && input) {
    input.insertAdjacentHTML('beforebegin', tagHtml('#' + name, '', true, 'data-tag-del="' + esc(name) + '" aria-label="Bỏ thẻ ' + esc(name) + '"'));
    input.value = '';
    if (state.form.tags.length >= 8) input.disabled = true;
  }
  const cnt = $('#tagCount'); if (cnt) cnt.textContent = state.form.tags.length + '/8';
  updateTagSuggest('');
}
function removeTag(name) {
  state.form.tags = state.form.tags.filter((t) => t !== name);
  const box = $('#tagBox');
  if (box) Array.from(box.querySelectorAll('[data-tag-del]')).forEach((b) => { if (b.getAttribute('data-tag-del') === name) b.closest('.tag').remove(); });
  const input = $('#tagInput'); if (input) input.disabled = false;
  const cnt = $('#tagCount'); if (cnt) cnt.textContent = state.form.tags.length + '/8';
  updateTagSuggest('');
}
function updateTagSuggest(q) {
  const host = $('#tagSuggest');
  if (!host) return;
  const f = fold(q);
  const list = TAGS.filter((t) => state.form.tags.indexOf(t) < 0 && (!f || fold(t).indexOf(f) >= 0)).slice(0, 7);
  host.innerHTML = list.map((t) => '<button type="button" data-tag-add="' + esc(t) + '">#' + esc(t) + '<span>' + tagCount(t) + '</span></button>').join('');
}

/* ---------- khởi động ---------- */
function boot() {
  hydrateIcons(document);
  bindEvents();
  route();
  const y = new Date().getFullYear();
  document.documentElement.setAttribute('lang', 'vi');
}
boot();

</script>
