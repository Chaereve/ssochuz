/* ============================================================================
   T. XỬ LÝ SỰ KIỆN — uỷ quyền ở cấp document
   ========================================================================== */
function syncBulkBars() {
  const sb = $('#bulkBar');
  if (sb) {
    sb.hidden = state.selectedStories.size === 0;
    const b = sb.querySelector('b');
    if (b) b.textContent = state.selectedStories.size;
  }
  const cb = $('#chapterBulkBar');
  if (cb) {
    cb.hidden = state.selectedChapters.size === 0;
    const b = cb.querySelector('b');
    if (b) b.textContent = state.selectedChapters.size;
  }
}

function handleClick(e) {
  const t = (sel) => e.target.closest(sel);

  if (e.target.id === 'paletteWrap' || t('#scrim')) { closePalette(); state.sidebarOpen = false; applySidebarState(); return; }
  if (t('#menuBtn')) { state.sidebarOpen = !state.sidebarOpen; applySidebarState(); return; }
  if (t('#collapseBtn')) { state.sidebarCollapsed = !state.sidebarCollapsed; applySidebarState(); return; }
  if (t('#themeBtn')) { toggleTheme(); return; }
  if (t('#searchTrigger')) { openPalette(); return; }
  if (t('#paletteClose')) { closePalette(); return; }
  if (t('#bellBtn')) { toast('Thông báo', '3 chương chờ duyệt và 2 bình luận bị báo cáo.', 'info'); return; }
  if (t('#helpBtn')) { helpModal(); return; }
  if (t('#sideUser')) { accountModal(); return; }
  if (t('[data-modal-theme]')) { toggleTheme(); return; }

  let el;
  if ((el = t('[data-page]'))) { navigate(el.getAttribute('data-page')); return; }
  if ((el = t('[data-nav]'))) { navigate(el.getAttribute('data-nav')); return; }

  if ((el = t('[data-open-editor]'))) {
    openEditor(el.getAttribute('data-open-editor'), el.getAttribute('data-chapter') || null);
    return;
  }
  if ((el = t('[data-story-detail]'))) {
    state.storyDetailId = el.getAttribute('data-story-detail');
    navigate('story-detail');
    return;
  }
  if ((el = t('[data-story-edit]'))) { editStoryModal(el.getAttribute('data-story-edit')); return; }
  if ((el = t('[data-story-delete]'))) { deleteStory(el.getAttribute('data-story-delete')); return; }

  if ((el = t('[data-sort]'))) {
    const key = el.getAttribute('data-sort');
    if (state.storySort.key === key) {
      state.storySort.dir = state.storySort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      state.storySort = { key, dir: key === 'title' || key === 'status' ? 'asc' : 'desc' };
    }
    state.storyPage = 1;
    refresh();
    toast('Đã sắp xếp', 'Theo “' + el.textContent.trim() + '” · ' +
      (state.storySort.dir === 'asc' ? 'tăng dần' : 'giảm dần'), 'info');
    return;
  }
  if ((el = t('[data-page-go]'))) { state.storyPage = Number(el.getAttribute('data-page-go')); refresh(); return; }
  if (t('[data-page-prev]')) { state.storyPage = Math.max(1, state.storyPage - 1); refresh(); return; }
  if (t('[data-page-next]')) { state.storyPage += 1; refresh(); return; }

  if ((el = t('[data-bulk]'))) {
    const a = el.getAttribute('data-bulk');
    if (!state.selectedStories.size) return;
    if (a === 'delete') bulkDeleteStories();
    else if (a === 'status') bulkStatusStories();
    else bulkFeatureStories();
    return;
  }
  if ((el = t('[data-chart-days]'))) {
    const d = Number(el.getAttribute('data-chart-days'));
    const host = $('#chartHost');
    if (host) {
      host.innerHTML = chartSVG(d, 'views') +
        '<div class="chart-legend" style="margin-top:12px"><span><i style="background:var(--accent)"></i>Tổng lượt đọc</span>' +
        '<span class="cell-muted">Rê chuột lên biểu đồ để xem số từng ngày</span></div>';
    }
    setPressed($$('[data-chart-days]'), el);
    return;
  }
  if ((el = t('[data-revenue-days]'))) {
    const d = Number(el.getAttribute('data-revenue-days'));
    const host = $('#revChartHost');
    if (host) host.innerHTML = chartSVG(d, 'revenue');
    setPressed($$('[data-revenue-days]'), el);
    return;
  }

  /* --- Chương --- */
  if ((el = t('[data-chapter-story]'))) {
    state.chapterStoryId = el.getAttribute('data-chapter-story');
    state.chapterFilter = 'Tất cả';
    state.selectedChapters.clear();
    refresh();
    return;
  }
  if ((el = t('[data-chapter-filter]'))) {
    state.chapterFilter = el.getAttribute('data-chapter-filter');
    state.selectedChapters.clear();
    refresh();
    return;
  }
  if ((el = t('[data-chapter-bulk]'))) { chapterBulk(el.getAttribute('data-chapter-bulk')); return; }
  if ((el = t('[data-chapter-delete]'))) { deleteChapter(el.getAttribute('data-chapter-delete')); return; }
  if (t('[data-chapter-reorder-save]')) {
    toast('Đã lưu thứ tự', 'Thứ tự chương được áp dụng cho trang đọc.');
    return;
  }
  if (t('[data-chapter-sort-auto]')) {
    const list = CHAPTERS.filter((c) => c.storyId === state.chapterStoryId);
    list.sort((a, b) => a.number - b.number).forEach((c, i) => { c.number = i + 1; });
    toast('Đã đánh số lại', list.length + ' chương được đánh số liên tục từ 1.');
    refresh();
    return;
  }

  if ((el = t('#eVipSwitch'))) {
    const vip = $('#eVip');
    const on = el.getAttribute('aria-checked') !== 'true';
    if (vip) vip.value = on ? (Number(vip.value) || 30) : 0;
    el.setAttribute('aria-checked', String(on));
    return;
  }

  /* --- Trình soạn --- */
  if ((el = t('[data-editor]'))) {
    const a = el.getAttribute('data-editor');
    if (a === 'close') {
      clearTimeout(state.editor.draftTimer);
      const body0 = $('#chapBody');
      if (body0 && String(body0.textContent || '').trim()) persistEditor();
      navigate('chapters', { storyId: state.editor.storyId });
    } else if (a === 'preview') {
      editorPreview();
    } else if (a === 'publish') {
      publishChapter();
    } else if (a === 'delete') {
      const id = state.editor.chapterId;
      if (!id) { toast('Chưa có gì để xóa', 'Chương này chưa được lưu.', 'err'); return; }
      deleteChapter(id);
    }
    return;
  }
  if ((el = t('[data-cmd]'))) {
    const cmd = el.getAttribute('data-cmd');
    const body = $('#chapBody');
    if (!body) return;
    if (body.focus) body.focus();
    if (!document.execCommand) { toast('Trình duyệt không hỗ trợ', 'Không thể định dạng văn bản.', 'err'); return; }
    if (cmd === 'bold' || cmd === 'italic' || cmd === 'undo' || cmd === 'redo') {
      document.execCommand(cmd, false, null);
    } else if (cmd === 'ul') {
      document.execCommand('insertUnorderedList', false, null);
    } else if (cmd === 'h2') {
      document.execCommand('formatBlock', false, '<h2>');
    } else if (cmd === 'quote') {
      document.execCommand('formatBlock', false, '<blockquote>');
    } else if (cmd === 'hr') {
      document.execCommand('insertHTML', false, '<hr>');
    } else if (cmd === 'image') {
      openModal({
        title: 'Chèn ảnh minh họa',
        subtitle: 'Dán đường dẫn ảnh (URL) hoặc tải ảnh lên.',
        confirmText: 'Chèn ảnh',
        body: '<div class="field"><label for="imgUrl">Đường dẫn ảnh</label>' +
          '<input class="input" id="imgUrl" data-field="url" placeholder="https://…"></div>' +
          '<div class="drop-zone" style="margin-top:12px;min-height:110px">' + icon('image', 22) +
          '<b>Tải ảnh từ máy</b><span>JPG, PNG ≤ 2MB</span></div>',
        validate: (dlg) => {
          const v = dlg.querySelector('[data-field=url]').value.trim();
          return /^https?:\/\//.test(v) ? true : 'Đường dẫn cần bắt đầu bằng http:// hoặc https://';
        },
        onConfirm: (dlg) => {
          const url = dlg.querySelector('[data-field=url]').value.trim();
          document.execCommand('insertHTML', false,
            '<img src="' + esc(url) + '" alt="Ảnh minh họa" style="max-width:100%;border-radius:8px">');
          scheduleAutosave();
          toast('Đã chèn ảnh', 'Ảnh minh họa đã được thêm vào chương.');
          return true;
        },
      });
    }
    updateEditorCounts();
    scheduleAutosave();
    return;
  }

  /* --- Duyệt bài --- */
  if ((el = t('[data-review-tab]'))) { state.reviewTab = el.getAttribute('data-review-tab'); refresh(); return; }
  if ((el = t('[data-review]'))) {
    const act = el.getAttribute('data-review');
    const cid = el.getAttribute('data-id');
    const sid = el.getAttribute('data-story');
    if (act === 'reject') rejectModal(sid ? 'story' : 'chapter', sid || cid);
    else approveItem(sid ? 'story' : 'chapter', sid || cid);
    return;
  }
  if ((el = t('[data-review-all]'))) {
    const act = el.getAttribute('data-review-all');
    if (act === 'approve') {
      if (state.reviewTab === 'Chương') {
        CHAPTERS.filter((c) => c.status === 'Chờ duyệt').forEach((c) => { c.status = 'Đã đăng'; c.publishedAt = '2026-11-02T12:00:00'; });
      } else {
        STORIES.filter((s) => s.status === 'Chờ duyệt').forEach((s) => { s.status = 'Đang ra'; });
      }
      toast('Đã duyệt tất cả', 'Hàng đợi “' + state.reviewTab + '” đã được xử lý.');
      refresh();
    } else {
      confirmDelete({
        title: 'Từ chối tất cả nội dung chờ duyệt?',
        message: 'Tác giả sẽ nhận thông báo kèm lý do mặc định.',
        confirmText: 'Từ chối tất cả',
        onConfirm: () => {
          if (state.reviewTab === 'Chương') {
            CHAPTERS.filter((c) => c.status === 'Chờ duyệt').forEach((c) => { c.status = 'Bản nháp'; });
          } else {
            STORIES.filter((s) => s.status === 'Chờ duyệt').forEach((s) => { s.status = 'Tạm ngưng'; });
          }
          toast('Đã từ chối', 'Toàn bộ nội dung trong hàng đợi đã được trả về.');
          refresh();
        },
      });
    }
    return;
  }

  /* --- Bình luận --- */
  if ((el = t('[data-comment-filter]'))) { state.commentFilter = el.getAttribute('data-comment-filter'); refresh(); return; }
  if ((el = t('[data-comment]'))) {
    const act = el.getAttribute('data-comment');
    const c = COMMENTS.find((x) => x.id === el.getAttribute('data-id'));
    if (!c) return;
    if (act === 'delete') {
      confirmDelete({
        title: 'Xóa bình luận của ' + c.user + '?',
        message: 'Bình luận sẽ bị xóa khỏi trang đọc.',
        onConfirm: () => {
          COMMENTS.splice(COMMENTS.indexOf(c), 1);
          toast('Đã xóa bình luận', 'Bình luận của ' + c.user + ' đã bị xóa.');
          refresh();
        },
      });
    } else {
      c.status = act === 'approve' ? 'Đã duyệt' : 'Đã ẩn';
      toast(act === 'approve' ? 'Đã duyệt bình luận' : 'Đã ẩn bình luận', c.user + ' · ' + c.story);
      refresh();
    }
    return;
  }

  /* --- Danh mục --- */
  if ((el = t('[data-taxonomy-tab]'))) { state.taxonomyTab = el.getAttribute('data-taxonomy-tab'); refresh(); return; }
  if ((el = t('[data-tax-add]'))) { taxonomyModal(el.getAttribute('data-tax-add'), null); return; }
  if ((el = t('[data-tax-edit]'))) {
    const kind = el.getAttribute('data-kind');
    const list = kind === 'genre' ? CATEGORIES : TAGS;
    taxonomyModal(kind, list.find((x) => x.id === el.getAttribute('data-tax-edit')));
    return;
  }
  if ((el = t('[data-tax-delete]'))) { deleteTaxonomy(el.getAttribute('data-kind'), el.getAttribute('data-tax-delete')); return; }

  /* --- Người dùng --- */
  if ((el = t('[data-user-page]'))) {
    const n = Number(el.getAttribute('data-user-page'));
    if (!el.disabled && n > 0) { state.userPage = n; refresh(); }
    return;
  }
  if ((el = t('[data-user-view]'))) { userDetailModal(el.getAttribute('data-user-view')); return; }
  if ((el = t('[data-user-role]'))) { userRoleModal(el.getAttribute('data-user-role')); return; }
  if ((el = t('[data-user-invite]'))) { inviteModal(); return; }
  if ((el = t('[data-user-lock]'))) {
    const u = USERS.find((x) => x.id === el.getAttribute('data-user-lock'));
    if (!u) return;
    if (u.status === 'Bị khóa') {
      u.status = 'Hoạt động';
      toast('Đã mở khóa', u.name + ' có thể đăng nhập trở lại.');
      refresh();
    } else {
      confirmDelete({
        title: 'Khóa tài khoản ' + u.name + '?',
        message: 'Người dùng sẽ bị đăng xuất và không thể đăng nhập.',
        confirmText: 'Khóa tài khoản',
        onConfirm: () => {
          u.status = 'Bị khóa';
          toast('Đã khóa tài khoản', u.name + ' không thể truy cập hệ thống.');
          refresh();
        },
      });
    }
    return;
  }

  /* --- Doanh thu --- */
  if ((el = t('[data-revenue-tab]'))) { state.revenueTab = el.getAttribute('data-revenue-tab'); refresh(); return; }
  if ((el = t('[data-withdraw]'))) { withdrawAction(el.getAttribute('data-id'), el.getAttribute('data-withdraw')); return; }

  /* --- Cài đặt --- */
  if ((el = t('[data-settings-tab]'))) { state.settingsTab = el.getAttribute('data-settings-tab'); refresh(); return; }
  if ((el = t('[data-toggle]'))) {
    const k = el.getAttribute('data-toggle');
    SETTINGS.toggles[k] = !SETTINGS.toggles[k];
    el.setAttribute('aria-checked', String(SETTINGS.toggles[k]));
    toast(SETTINGS.toggles[k] ? 'Đã bật tính năng' : 'Đã tắt tính năng',
      el.getAttribute('aria-label') + ' · ' + (SETTINGS.toggles[k] ? 'đang hoạt động' : 'đã tắt'), 'info');
    return;
  }
  if ((el = t('[data-theme-choice]'))) {
    state.theme = el.getAttribute('data-theme-choice');
    applyTheme();
    toast('Đã đổi giao diện', state.theme === 'light' ? 'Đang dùng chế độ sáng.' : 'Đang dùng chế độ tối.', 'info');
    refresh();
    return;
  }
  if (t('[data-save-settings]')) {
    const name = $('#setName'), tagline = $('#setTagline'), email = $('#setEmail'), url = $('#setUrl'), banner = $('#setBanner');
    if (name) SETTINGS.siteName = name.value.trim();
    if (tagline) SETTINGS.tagline = tagline.value.trim();
    if (email) SETTINGS.contactEmail = email.value.trim();
    if (url) SETTINGS.siteUrl = url.value.trim();
    if (banner) SETTINGS.bannerText = banner.value.trim();
    toast('Đã lưu cài đặt', 'Thay đổi được áp dụng cho toàn bộ website.');
    refresh();
    return;
  }
  if ((el = t('[data-chip-remove]'))) {
    const i = Number(el.getAttribute('data-chip-remove'));
    FORM_TAGS.splice(i, 1);
    renderFormTags();
    return;
  }
  if (t('#coverDrop') || t('#logoDrop') || t('#bannerDrop')) {
    const map = { coverDrop: '#coverInput', logoDrop: '#logoInput', bannerDrop: '#bannerInput' };
    const zone = t('#coverDrop') || t('#logoDrop') || t('#bannerDrop');
    const inp = $(map[zone.id]);
    if (inp) inp.click();
    return;
  }

  if ((el = t('[data-action]'))) {
    const a = el.getAttribute('data-action');
    if (a === 'refresh') { refresh(); toast('Đã làm mới', 'Số liệu được cập nhật lúc ' + fmtDateTime('2026-11-02T12:00:00') + '.', 'info'); }
    else if (a === 'export') { toast('Đang xuất tệp', 'Tệp CSV sẽ được tải xuống trong giây lát.', 'info'); }
    else if (a === 'clear-filters') {
      state.storyQuery = ''; state.storyGenre = ''; state.storyStatus = ''; state.storyAuthor = '';
      state.storyPage = 1; refresh();
      toast('Đã xóa bộ lọc', 'Đang hiển thị toàn bộ truyện.', 'info');
    } else if (a === 'clear-user-filters') {
      state.userQuery = ''; state.userRole = ''; state.userPage = 1; refresh();
      toast('Đã xóa bộ lọc', 'Đang hiển thị toàn bộ người dùng.', 'info');
    } else if (a === 'import-chapters') { importModal(); }
    else if (a === 'comment-settings') { commentRulesModal(); }
    else if (a === 'payout') { payoutModal(); }
    return;
  }
}

/* --- Nhập liệu --- */
function renderFormTags() {
  const host = $('#tagChips');
  if (!host) return;
  host.innerHTML = FORM_TAGS.map((t, i) =>
    '<span class="chip">' + esc(t) +
    '<button type="button" data-chip-remove="' + i + '" aria-label="Bỏ thẻ ' + esc(t) + '">' + icon('x', 12) + '</button></span>').join('');
}

function handleInput(e) {
  const el = e.target;
  const id = el.id;

  if (id === 'storySearch') {
    state.storyQuery = el.value;
    state.storyPage = 1;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => refresh('storySearch'), 260);
    return;
  }
  if (id === 'userSearch') {
    state.userQuery = el.value;
    state.userPage = 1;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => refresh('userSearch'), 260);
    return;
  }
  if (id === 'taxSearch') {
    const q = el.value.trim().toLowerCase();
    $$('#view tbody tr').forEach((tr) => {
      tr.hidden = q !== '' && !tr.textContent.toLowerCase().includes(q);
    });
    return;
  }
  if (id === 'sDesc') {
    const c = $('#descCount');
    if (c) c.textContent = el.value.length + '/400';
    return;
  }
  if (id === 'seoTitle' || id === 'seoDesc') {
    const c = $('#' + id + 'Count');
    if (c) c.textContent = el.value.length;
    return;
  }
  if (id === 'chapBody' || id === 'chapTitle') {
    updateEditorCounts();
    scheduleAutosave();
    return;
  }
  if (id === 'eVip') {
    const sw = $('#eVipSwitch');
    if (sw) sw.setAttribute('aria-checked', String(Number(el.value) > 0));
    return;
  }
}

function handleChange(e) {
  const el = e.target;
  const id = el.id;

  if (id === 'filterGenre') { state.storyGenre = el.value; state.storyPage = 1; refresh(); return; }
  if (id === 'filterStatus') { state.storyStatus = el.value; state.storyPage = 1; refresh(); return; }
  if (id === 'filterAuthor') { state.storyAuthor = el.value; state.storyPage = 1; refresh(); return; }
  if (id === 'userRole') { state.userRole = el.value; state.userPage = 1; refresh(); return; }

  if (id === 'checkAll') {
    const rows = filteredStories().slice((state.storyPage - 1) * state.storyPerPage,
      state.storyPage * state.storyPerPage);
    rows.forEach((s) => { if (el.checked) state.selectedStories.add(s.id); else state.selectedStories.delete(s.id); });
    refresh();
    return;
  }
  if (el.classList.contains('row-check')) {
    if (el.checked) state.selectedStories.add(el.getAttribute('data-id'));
    else state.selectedStories.delete(el.getAttribute('data-id'));
    refresh();
    return;
  }
  if (el.classList.contains('chap-check')) {
    if (el.checked) state.selectedChapters.add(el.getAttribute('data-id'));
    else state.selectedChapters.delete(el.getAttribute('data-id'));
    refresh();
    return;
  }
  if (id === 'coverInput' || id === 'logoInput' || id === 'bannerInput') {
    const file = el.files && el.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('Tệp không hợp lệ', 'Chỉ nhận ảnh JPG, PNG hoặc WebP.', 'err'); return; }
    if (file.size > 2 * 1024 * 1024) { toast('Ảnh quá lớn', 'Dung lượng tối đa là 2MB.', 'err'); return; }
    const host = id === 'coverInput' ? $('#coverPreview') : el.previousElementSibling;
    if (host) {
      const url = URL.createObjectURL(file);
      host.innerHTML = '<img src="' + url + '" alt="Ảnh xem trước" ' +
        'style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--border)">' +
        '<p style="font-size:12px;color:var(--text-3);margin-top:8px">' + esc(file.name) + '</p>';
    }
    toast('Đã tải ảnh lên', file.name + ' · ' + Math.round(file.size / 1024) + ' KB');
    return;
  }
  if (id === 'eVipSwitch') return;
}

function handleSubmit(e) {
  const form = e.target;
  if (form.id === 'storyForm') {
    e.preventDefault();
    const titleEl = $('#sTitle'), authorEl = $('#sAuthor'), genreEl = $('#sGenre'), descEl = $('#sDesc');
    const marks = [
      [titleEl.closest('.field'), titleEl.value.trim().length >= 3],
      [authorEl.closest('.field'), authorEl.value !== ''],
      [genreEl.closest('.field'), genreEl.value !== ''],
      [descEl.closest('.field'), descEl.value.trim().length >= 30],
    ];
    let ok = true;
    marks.forEach(([field, valid]) => {
      field.classList.toggle('field-error', !valid);
      if (!valid) ok = false;
    });
    if (!ok) {
      toast('Chưa lưu được', 'Vui lòng kiểm tra các trường được đánh dấu.', 'err');
      const first = $('.field-error');
      if (first) {
        const inp = first.querySelector('input,select,textarea');
        if (inp) inp.focus();
      }
      return;
    }
    const story = {
      id: 's' + (STORIES.length + 100),
      title: titleEl.value.trim(),
      author: authorEl.value,
      genre: genreEl.value,
      status: $('#sStatus') ? $('#sStatus').value : 'Chờ duyệt',
      chapters: 0, views: 0, rating: 0, updated: '2026-11-02T12:00:00',
      vip: $('#sVip') ? $('#sVip').checked : false,
      featured: $('#sFeature') ? $('#sFeature').checked : false,
      adult: $('#sAdult') ? $('#sAdult').checked : false,
      tags: [...FORM_TAGS],
      desc: descEl.value.trim(),
    };
    STORIES.unshift(story);
    const chapTitle = $('#sChapTitle'), chapBody = $('#sChapBody');
    if (chapTitle && chapTitle.value.trim()) {
      CHAPTERS.push({
        id: uid('c'), storyId: story.id, number: 1, title: chapTitle.value.trim(),
        words: (chapBody.value.trim().match(/[^\s]+/g) || []).length, status: 'Bản nháp',
        publishedAt: null, scheduleAt: null, vipPrice: 0,
        body: '<p>' + esc(chapBody.value.trim()).replace(/\n+/g, '</p><p>') + '</p>',
      });
      story.chapters = 1;
    }
    toast('Đã đăng truyện', '“' + story.title + '” · trạng thái “' + story.status + '”.');
    FORM_TAGS.length = 0;
    form.reset();
    navigate('stories');
    return;
  }
}

/* --- Bàn phím --- */
function handleKeydown(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  const meta = e.ctrlKey || e.metaKey;

  if (meta && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openPalette();
    return;
  }
  if (e.key === 'Escape') {
    if ($('#paletteWrap').classList.contains('show')) { closePalette(); return; }
    if (state.sidebarOpen) { state.sidebarOpen = false; applySidebarState(); return; }
  }
  if (state.page === 'editor') {
    if (meta && e.key.toLowerCase() === 's') {
      e.preventDefault();
      clearTimeout(state.editor.draftTimer);
      const saved = persistEditor();
      if (saved) toast('Đã lưu chương', 'Chương ' + saved.number + ' đã được lưu.');
      else toast('Chưa có nội dung', 'Hãy viết ít nhất một đoạn trước khi lưu.', 'err');
      return;
    }
    if (meta && e.key.toLowerCase() === 'p') { e.preventDefault(); editorPreview(); return; }
  }
  if (e.target.id === 'sTags' && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim().replace(/,$/, '');
    if (v && FORM_TAGS.length < 8 && !FORM_TAGS.includes(v)) {
      FORM_TAGS.push(v);
      renderFormTags();
      e.target.value = '';
    } else if (FORM_TAGS.length >= 8) {
      toast('Đã đủ thẻ', 'Tối đa 8 thẻ cho mỗi truyện.', 'err');
    }
    return;
  }
  if (e.target.id === 'paletteInput') {
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteMove(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); paletteMove(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); paletteChoose(); return; }
  }
  if (!typing && e.key === '/') { e.preventDefault(); openPalette(); }
}

/* --- Kéo thả --- */
let dragChapterId = null;

function reorderChapter(fromId, toId) {
  const from = CHAPTERS.findIndex((c) => c.id === fromId);
  const to = CHAPTERS.findIndex((c) => c.id === toId);
  if (from < 0 || to < 0 || from === to) return;
  const [moved] = CHAPTERS.splice(from, 1);
  CHAPTERS.splice(to, 0, moved);
  const list = CHAPTERS.filter((c) => c.storyId === state.chapterStoryId);
  list.forEach((c, i) => { c.number = i + 1; });
  state.selectedChapters.clear();
  refresh();
  toast('Đã đổi thứ tự', 'Chương “' + moved.title + '” đã được di chuyển.');
}

function bindDrag() {
  document.addEventListener('dragstart', (e) => {
    const row = e.target.closest && e.target.closest('.chapter-row');
    if (!row) return;
    dragChapterId = row.getAttribute('data-chapter-id');
    row.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragChapterId); } catch (_) { /* Safari */ }
    }
  });
  document.addEventListener('dragover', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone, .chapter-row');
    if (!zone) return;
    e.preventDefault();
    if (zone.classList.contains('drop-zone')) { zone.classList.add('over'); return; }
    if (!dragChapterId) return;
    $$('.chapter-row.drop-target').forEach((r) => r.classList.remove('drop-target'));
    if (zone.getAttribute('data-chapter-id') !== dragChapterId) zone.classList.add('drop-target');
  });
  document.addEventListener('dragleave', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone');
    if (zone) zone.classList.remove('over');
  });
  document.addEventListener('drop', (e) => {
    const zone = e.target.closest && e.target.closest('.drop-zone, .chapter-row');
    if (!zone) return;
    e.preventDefault();
    if (zone.classList.contains('drop-zone')) {
      zone.classList.remove('over');
      const map = { coverDrop: '#coverInput', logoDrop: '#logoInput', bannerDrop: '#bannerInput' };
      const inp = $(map[zone.id]);
      if (inp && e.dataTransfer && e.dataTransfer.files.length) {
        inp.files = e.dataTransfer.files;
        inp.dispatchEvent(new Event('change', { bubbles: true }));
      }
      return;
    }
    const toId = zone.getAttribute('data-chapter-id');
    if (dragChapterId && toId) reorderChapter(dragChapterId, toId);
    dragChapterId = null;
  });
  document.addEventListener('dragend', () => {
    dragChapterId = null;
    $$('.chapter-row.dragging, .chapter-row.drop-target').forEach((r) => {
      r.classList.remove('dragging');
      r.classList.remove('drop-target');
    });
  });
}

/* --- Command palette --- */
function paletteData(q) {
  const term = q.trim().toLowerCase();
  const items = [];
  PAGES.forEach((p) => {
    if (p.id === 'editor') return;
    items.push({ type: 'page', id: p.id, label: p.label, sub: p.desc, icon: p.icon, group: 'Trang' });
  });
  STORIES.forEach((s) => {
    items.push({ type: 'story', id: s.id, label: s.title, sub: s.author + ' · ' + s.genre, icon: 'book', group: 'Truyện' });
  });
  const filtered = term
    ? items.filter((i) => (i.label + ' ' + i.sub).toLowerCase().includes(term))
    : items.filter((i) => i.type === 'page').concat(items.filter((i) => i.type === 'story').slice(0, 5));
  return filtered.slice(0, 12);
}
function renderPalette(q) {
  const results = paletteData(q);
  state.paletteResults = results;
  state.paletteIndex = 0;
  const host = $('#paletteList');
  if (!results.length) {
    host.innerHTML = '<div class="palette-empty">Không tìm thấy kết quả cho “' + esc(q) + '”.<br>' +
      'Thử tên trang, tên truyện hoặc tác giả.</div>';
    return;
  }
  let html = '';
  let group = '';
  results.forEach((r, i) => {
    if (r.group !== group) {
      group = r.group;
      html += '<div class="palette-group">' + esc(group) + '</div>';
    }
    html += '<button class="palette-item" type="button" role="option" data-palette="' + i + '" aria-selected="' +
      (i === 0) + '">' + icon(r.icon) + '<span class="tx"><b>' + esc(r.label) + '</b>' +
      '<span>' + esc(r.sub) + '</span></span>' +
      '<span class="k">' + (r.type === 'page' ? 'Trang' : 'Truyện') + '</span></button>';
  });
  host.innerHTML = html;
  host.setAttribute('aria-activedescendant', 'palette-0');
}
function paletteMove(delta) {
  const items = $$('.palette-item', $('#paletteList'));
  if (!items.length) return;
  state.paletteIndex = (state.paletteIndex + delta + items.length) % items.length;
  items.forEach((el, i) => el.setAttribute('aria-selected', String(i === state.paletteIndex)));
  const cur = items[state.paletteIndex];
  if (cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
}
function paletteChoose() {
  const r = state.paletteResults[state.paletteIndex];
  if (!r) return;
  closePalette();
  if (r.type === 'page') navigate(r.id);
  else { state.storyDetailId = r.id; navigate('story-detail'); }
}
function openPalette() {
  const wrap = $('#paletteWrap');
  wrap.classList.add('show');
  const inp = $('#paletteInput');
  inp.value = '';
  renderPalette('');
  setTimeout(() => inp.focus(), 20);
}
function closePalette() {
  const wrap = $('#paletteWrap');
  if (wrap) wrap.classList.remove('show');
}

/* --- Khởi động --- */
const ROUTES = [...PAGES.map((p) => p.id), 'story-new', 'story-detail', 'editor'];

function bindPage() {
  if (state.page === 'editor') initEditor();
  if (state.page === 'story-new') { renderFormTags(); }
}

function initApp() {
  applyTheme();
  renderSidebar();
  renderBreadcrumb();
  applySidebarState();

  document.addEventListener('click', handleClick);
  document.addEventListener('input', handleInput);
  document.addEventListener('change', handleChange);
  document.addEventListener('submit', handleSubmit);
  document.addEventListener('keydown', handleKeydown);
  bindDrag();

  const p = $('#paletteInput');
  p.addEventListener('input', () => renderPalette(p.value));
  $('#paletteList').addEventListener('click', (e) => {
    const item = e.target.closest('[data-palette]');
    if (!item) return;
    state.paletteIndex = Number(item.getAttribute('data-palette'));
    paletteChoose();
  });

  window.addEventListener('hashchange', () => {
    const id = location.hash.slice(1);
    if (id && id !== state.page && ROUTES.includes(id)) navigate(id);
  });

  const start = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'dashboard';
  navigate(start);
}

initApp();
</script>
