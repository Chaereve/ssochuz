    SETTINGS.xu.minWithdraw = num('#cfgMinWithdraw', 0);
    SETTINGS.xu.minPrice = num('#cfgMinPrice', 1);
    SETTINGS.xu.maxPrice = Math.max(SETTINGS.xu.minPrice, num('#cfgMaxPrice', SETTINGS.xu.minPrice));
    toast('Đã lưu cấu hình', '1 xu = ' + vnd(SETTINGS.xu.rate) + ' · tác giả nhận ' + SETTINGS.xu.authorShare + '%.');
    render();
    return;
  }

  /* Cài đặt */
  if ((n = el('[data-settings-tab]'))) { state.settings.tab = n.getAttribute('data-settings-tab'); render(); return; }
  if ((n = el('[data-toggle]'))) {
    const k = n.getAttribute('data-toggle');
    SETTINGS.toggles[k] = !SETTINGS.toggles[k];
    n.setAttribute('aria-checked', String(SETTINGS.toggles[k]));
    toast(SETTINGS.toggles[k] ? 'Đã bật tính năng' : 'Đã tắt tính năng', 'Cài đặt “' + k + '” đã được cập nhật.', 'info');
    return;
  }
  if ((n = el('[data-set-theme]'))) {
    state.theme = n.getAttribute('data-set-theme');
    render();
    return;
  }
  if (t('[data-density]')) {
    const on = !document.body.classList.contains('dense');
    document.body.classList.toggle('dense', on);
    t('[data-density]').setAttribute('aria-checked', String(on));
    toast(on ? 'Đã bật mật độ gọn' : 'Đã tắt mật độ gọn', 'Bảng và danh sách hiển thị ' + (on ? 'dày hơn.' : 'thoáng hơn.'), 'info');
    return;
  }
  if (t('[data-save-settings]')) {
    const g = (sel) => { const e2 = $(sel); return e2 ? e2.value : null; };
    if ($('#setName')) SETTINGS.siteName = g('#setName');
    if ($('#setUrl')) SETTINGS.siteUrl = g('#setUrl');
    if ($('#setTagline')) SETTINGS.tagline = g('#setTagline');
    if ($('#setEmail')) SETTINGS.contactEmail = g('#setEmail');
    if ($('#setLang')) SETTINGS.language = g('#setLang');
    if ($('#setTz')) SETTINGS.timezone = g('#setTz');
    if ($('#setBanner')) SETTINGS.bannerText = g('#setBanner');
    if ($('#seoTitle')) SETTINGS.seoTitle = g('#seoTitle');
    if ($('#seoDesc')) SETTINGS.seoDesc = g('#seoDesc');
    toast('Đã lưu cài đặt', 'Thay đổi được áp dụng cho toàn bộ website.');
    render();
    return;
  }

  /* Tag */
  if ((n = el('[data-remove-tag]'))) { removeTag(n.getAttribute('data-remove-tag')); return; }
  if ((n = el('[data-add-tag]'))) { addTag(n.getAttribute('data-add-tag')); return; }

  /* Độc giả */
  if (t('[data-pay]')) { pay(); return; }
  if ((n = el('[data-unlock]'))) { openUnlock(n.getAttribute('data-unlock')); return; }
  if (t('[data-open-chapter]')) { toast('Đang mở chương', 'Trình đọc chương sẽ mở ở tab mới trong bản đầy đủ.', 'info'); return; }

  /* Vùng tải ảnh */
  if (t('#coverDrop') || t('#logoDrop') || t('#bannerDrop')) {
    const zone = t('#coverDrop') || t('#logoDrop') || t('#bannerDrop');
    const map = { coverDrop: '#coverInput', logoDrop: '#logoInput', bannerDrop: '#bannerInput' };
    const inp = $(map[zone.id]);
    if (inp) inp.click();
    return;
  }
});

/* --- change --- */
let searchTimer = null;
document.addEventListener('change', (e) => {
  const id = e.target.id;
  const st = state;
  if (id === 'storyGenre') { st.stories.genre = e.target.value; st.stories.page = 1; render(); return; }
  if (id === 'storyStatus') { st.stories.status = e.target.value; st.stories.page = 1; render(); return; }
  if (id === 'storyAuthor') { st.stories.author = e.target.value; st.stories.page = 1; render(); return; }
  if (id === 'chapterStory') { st.chapters.storyId = e.target.value; st.chapters.sel = new Set(); render(); return; }
  if (id === 'chapterVip') { st.chapters.vip = e.target.value; render(); return; }
  if (id === 'userRole') { st.users.role = e.target.value; st.users.page = 1; render(); return; }
  if (id === 'userStatus') { st.users.status = e.target.value; st.users.page = 1; render(); return; }
  if (id === 'txStatus') { st.revenue.status = e.target.value; render(); return; }
  if (id === 'txMethod') { st.revenue.method = e.target.value; render(); return; }
  if (id === 'txFrom') { st.revenue.from = e.target.value; render(); return; }
  if (id === 'txTo') { st.revenue.to = e.target.value; render(); return; }
  if (e.target.name === 'pkg') { st.reader.pkg = e.target.value; render(); return; }
  if (e.target.name === 'method') { st.reader.method = e.target.value; render(); return; }
  if (e.target.classList.contains('warnCheck')) {
    const v = e.target.value;
    if (e.target.checked) { if (!st.form.warns.includes(v)) st.form.warns.push(v); }
    else st.form.warns = st.form.warns.filter((w) => w !== v);
    return;
  }
  if (e.target.classList.contains('rowCheck')) {
    const sid = e.target.getAttribute('data-id');
    if (e.target.checked) st.stories.sel.add(sid); else st.stories.sel.delete(sid);
    render();
    return;
  }
  if (e.target.classList.contains('chapCheck')) {
    const cid = e.target.getAttribute('data-id');
    if (e.target.checked) st.chapters.sel.add(cid); else st.chapters.sel.delete(cid);
    render();
    return;
  }
  if (id === 'checkAll') {
    const ids = $$('#view .rowCheck').map((x) => x.getAttribute('data-id'));
    ids.forEach((sid) => { if (e.target.checked) st.stories.sel.add(sid); else st.stories.sel.delete(sid); });
    render();
    return;
  }
  if (id === 'coverInput') {
    const file = e.target.files && e.target.files[0];
    readImage(file, (src, f) => {
      st.form.cover = src;
      const host = $('#coverPreview');
      if (host) host.innerHTML = '<img src="' + src + '" alt="Ảnh bìa xem trước" style="width:100%;border-radius:8px;border:1px solid var(--border)">' +
        '<p class="hint" style="margin-top:8px">' + esc(f.name) + '</p>';
      toast('Đã tải ảnh lên', f.name + ' · ' + Math.round(f.size / 1024) + ' KB');
    });
    return;
  }
  if (id === 'logoInput' || id === 'bannerInput') {
    const file = e.target.files && e.target.files[0];
    readImage(file, (src, f) => toast('Đã tải ảnh lên', f.name + ' · ' + Math.round(f.size / 1024) + ' KB'));
  }
});

/* --- input --- */
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'storyQ') {
    state.stories.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.stories.page = 1; render(); const el2 = $('#storyQ'); if (el2) { el2.focus(); } }, 240);
    return;
  }
  if (id === 'userQ') {
    state.users.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.users.page = 1; render(); const el2 = $('#userQ'); if (el2) el2.focus(); }, 240);
    return;
  }
  if (id === 'taxQ') {
    state.taxonomy.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { render(); const el2 = $('#taxQ'); if (el2) el2.focus(); }, 240);
    return;
  }
  if (id === 'txQ') {
    state.revenue.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { render(); const el2 = $('#txQ'); if (el2) el2.focus(); }, 240);
    return;
  }
  if (id === 'descCount' || id === 'sDesc') {
    const c = $('#descCount');
    if (c) c.textContent = e.target.value.length;
    return;
  }
  if (id === 'seoTitle') { const c = $('#seoTitleCount'); if (c) c.textContent = e.target.value.length; SETTINGS.seoTitle = e.target.value; return; }
  if (id === 'seoDesc') { const c = $('#seoDescCount'); if (c) c.textContent = e.target.value.length; SETTINGS.seoDesc = e.target.value; return; }
  if (id === 'tagInput') { renderTagMenu(e.target.value); return; }
  if (id === 'chapterTitle' || id === 'chapterBody') { markDirty(); updateWordCount(); return; }
});

/* --- submit --- */
document.addEventListener('submit', (e) => {
  if (e.target.id === 'storyForm') submitStoryForm(e);
});

/* --- keydown --- */
document.addEventListener('keydown', (e) => {
  const key = e.key;
  if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 'k') {
    e.preventDefault();
    state.palette.open ? closePalette() : openPalette();
    return;
  }
  if (state.palette.open) {
    const items = $$('#paletteList .palette-item');
    if (key === 'Escape') { closePalette(); return; }
    if (key === 'ArrowDown' || key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      const cur = items.findIndex((x) => x.getAttribute('aria-selected') === 'true');
      const next = (cur + (key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((x, i) => x.setAttribute('aria-selected', String(i === next)));
      items[next].scrollIntoView({ block: 'nearest' });
      return;
    }
    if (key === 'Enter') {
      const cur = items.findIndex((x) => x.getAttribute('aria-selected') === 'true');
      e.preventDefault();
      paletteChoose(cur >= 0 ? cur : 0);
      return;
    }
  }
  if (e.target.id === 'tagInput') {
    if (key === 'Enter' || key === ',') {
      e.preventDefault();
      addTag(e.target.value);
    } else if (key === 'Backspace' && !e.target.value && state.form.tags.length) {
      e.preventDefault();
      removeTag(state.form.tags[state.form.tags.length - 1]);
    }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && key.toLowerCase() === 's' && state.page === 'editor') {
    e.preventDefault();
    editorPublish();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'paletteInput') renderPalette(e.target.value);
});

/* --- kéo thả chương --- */
document.addEventListener('dragstart', (e) => {
  const row = e.target.closest && e.target.closest('[data-chapter-row]');
  if (!row) return;
  dragId = row.getAttribute('data-chapter-row');
  row.style.opacity = '.5';
});
document.addEventListener('dragend', (e) => {
  const row = e.target.closest && e.target.closest('[data-chapter-row]');
  if (row) row.style.opacity = '';
});
document.addEventListener('dragover', (e) => {
  const row = e.target.closest && e.target.closest('[data-chapter-row]');
  if (row && dragId) e.preventDefault();
});
document.addEventListener('drop', (e) => {
  const row = e.target.closest && e.target.closest('[data-chapter-row]');
  if (!row || !dragId) return;
  e.preventDefault();
  moveChapter(row.getAttribute('data-chapter-row'));
});
['#coverDrop', '#logoDrop', '#bannerDrop'].forEach((sel) => {
  document.addEventListener('dragover', (e) => {
    const z = e.target.closest && e.target.closest(sel);
    if (z) { e.preventDefault(); z.classList.add('over'); }
  });
  document.addEventListener('dragleave', (e) => {
    const z = e.target.closest && e.target.closest(sel);
    if (z) z.classList.remove('over');
  });
  document.addEventListener('drop', (e) => {
    const z = e.target.closest && e.target.closest(sel);
    if (!z) return;
    e.preventDefault();
    z.classList.remove('over');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (sel === '#coverDrop') {
      readImage(file, (src, f) => {
        state.form.cover = src;
        const host = $('#coverPreview');
        if (host) host.innerHTML = '<img src="' + src + '" alt="Ảnh bìa xem trước" style="width:100%;border-radius:8px;border:1px solid var(--border)">';
        toast('Đã tải ảnh lên', f.name);
      });
    } else {
      readImage(file, (src, f) => toast('Đã tải ảnh lên', f.name));
    }
  });
});

/* ============================================================================
   20. KHỞI ĐỘNG
   ========================================================================== */
window.addEventListener('hashchange', route);
renderShell();
route();
if (!location.hash) location.hash = 'dashboard';
</script>
