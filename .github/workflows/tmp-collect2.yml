name: tmp-collect2
on:
  push:
    paths:
      - '.github/workflows/tmp-collect2.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: |
          cat > /tmp/collect2.py <<'PYEOF'
          import traceback
          try:
              #!/usr/bin/env python3
              # Thu thập dữ liệu THẬT (bản gọn): số chương + tựa chương thật của 45 bài post,
              # và thử đọc số liệu thật từ Firebase cũ (chuseoz-library / Firestore novelData).
              import json, os, re, sys, time, traceback, urllib.request, urllib.parse, html as H

              OUT='_inbox/real2'
              os.makedirs(OUT, exist_ok=True)
              UA={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'}

              def get(url, tries=2, timeout=60):
                  for i in range(tries):
                      try:
                          req=urllib.request.Request(url, headers=UA)
                          with urllib.request.urlopen(req, timeout=timeout) as r:
                              return r.status, r.read().decode('utf-8','replace')
                      except urllib.error.HTTPError as e:
                          return e.code, ''
                      except Exception as e:
                          print('   !', url, e, flush=True); time.sleep(2)
                  return 0, ''

              def clean(s):
                  s=re.sub(r'<[^>]+>',' ', s)
                  s=H.unescape(s).replace('\u200b','').replace('\xa0',' ')
                  return re.sub(r'\s+',' ',s).strip()

              # ---- 1. dữ liệu thật của 45 bài post ----
              urlcheck=[]
              for line in open('_inbox/urlcheck.txt', encoding='utf-8'):
                  p=line.split()
                  if len(p)>=4 and p[1]=='200' and '/p/' not in p[0]:
                      urlcheck.append(p[0])
              print('bài post:', len(urlcheck), flush=True)

              posts={}
              for i,u in enumerate(urlcheck,1):
                  slug=u.rstrip('/').split('/')[-1].replace('.html','')
                  st,h=get(u)
                  if st!=200 or not h:
                      posts[slug]={'url':u,'status':st,'error':'fetch'}; continue
                  titles=[clean(x) for x in re.findall(r'<h2[^>]*class="[^"]*chapter-title[^"]*"[^>]*>(.*?)</h2>', h, re.S)]
                  titles=[t for t in titles if t]
                  blocks=len(re.findall(r'class="[^"]*chapter-page', h))
                  em=len(re.findall(r'<img', h))
                  # tình trạng/tác giả ghi ngay trong bài (nếu có)
                  stx=None
                  m=re.search(r'Tình trạng\s*:?\s*([^<\n]{0,60})', clean(h[:400000]))
                  if m: stx=clean(m.group(1))[:40]
                  posts[slug]={'url':u,'blocks':blocks,'nTitles':len(titles),'titles':titles,
                               'first':titles[0] if titles else None,'last':titles[-1] if titles else None,
                               'imgs':em,'statusRaw':stx,'bytes':len(h)}
                  print(' %2d/%d %-46s blocks=%-3d titles=%-3d' % (i,len(urlcheck),slug[:46],blocks,len(titles)), flush=True)
                  json.dump(posts, open(os.path.join(OUT,'posts.json'),'w'), ensure_ascii=False, indent=1)   # ghi dần
              json.dump(posts, open(os.path.join(OUT,'posts.json'),'w'), ensure_ascii=False, indent=1)

              # ---- 2. Firebase: thử đọc số liệu thật ----
              fb={}
              base='https://firestore.googleapis.com/v1/projects/chuseoz-library/databases/(default)/documents/'
              for name,url in [('novelData_list', base+'novelData?pageSize=5'),
                               ('voters_count',  base+'voters?pageSize=1'),
                               ('users_probe',   base+'users?pageSize=1')]:
                  st,body=get(url)
                  fb[name]={'http':st,'sample':body[:400] if st!=200 else 'OK'}
                  if st==200:
                      try:
                          d=json.loads(body); fb[name]['count']=len(d.get('documents',[])); fb[name]['sample']=d.get('documents',[])[:1]
                      except Exception as e: fb[name]['err']=str(e)
                  print(name, st, flush=True)
              json.dump(fb, open(os.path.join(OUT,'firebase.json'),'w'), ensure_ascii=False, indent=1)
              print('DONE', flush=True)

          except Exception:
              open('_inbox/real2/error.txt','w').write(traceback.format_exc())
              raise

          PYEOF
          python3 /tmp/collect2.py
      - name: Commit
        if: always()
        run: |
          set -eux
          git config user.email "bot@chuseoz.local"; git config user.name "chuseoz bot"
          mkdir -p _inbox/real2; touch _inbox/real2/.keep
          git add -A _inbox/real2 || true
          git commit -m "tmp: real post + firebase data (2)" || echo "nothing"
          git push
