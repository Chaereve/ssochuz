name: tmp-fetch-live
on:
  push:
    branches: [arena/01a0968c-ssochuz]
    paths: ['.github/workflows/tmp-fetch-live.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0968c-ssochuz
      - name: Fetch live pages
        run: |
          mkdir -p _inbox/live
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127 Safari/537.36"
          curl -sSL --retry 2 -A "$UA" -o _inbox/live/home.html -w "home %{http_code} %{size_download} %{url_effective}\n" "https://chuseoz.blogspot.com/"
          curl -sSL --retry 2 -A "$UA" -o _inbox/live/list-novel.html -w "list %{http_code} %{size_download}\n" "https://chuseoz.blogspot.com/p/list-novel.html"
          curl -sSL --retry 2 -A "$UA" -o _inbox/live/post.html -w "post %{http_code} %{size_download}\n" "https://chuseoz.blogspot.com/2026/05/lunar-secret.html"
          curl -sSL --retry 2 -A "$UA" -o _inbox/live/bookpage.html -w "bookpage %{http_code} %{size_download}\n" "https://chuseoz.blogspot.com/p/lunar-secret.html"
          ls -la _inbox/live
      - name: Push back
        run: |
          git config user.name "arena-bot"
          git config user.email "bot@users.noreply.github.com"
          git add _inbox/live
          git commit -m "tmp: fetched live pages" || echo "no change"
          git push origin HEAD:arena/01a0968c-ssochuz
