<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tác giả · lưới bìa + thanh lọc gọn (r105) · ssochuz library</title>
<meta name="description" content="Đề xuất trang Tác giả: lưới bìa, thanh tìm và lọc dồn thành một hàng gọn — r105.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/site/ssochuz.png">
<link rel="stylesheet" href="/site/cz.css">
<link rel="stylesheet" href="pp.css">
<script>try{var t=localStorage.getItem('ssochuz-theme')||localStorage.getItem('chuseoz-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-personal-follow-only>
<header id="hdr"></header>

<main class="ta">
  <nav class="ta-crumb"><a href="/site/">Trang chủ</a><span>›</span><a href="/site/#thu-vien">Thư viện</a><span>›</span><b>Tác giả</b></nav>

  <header class="ta-head">
    <h1>Tác giả</h1>
    <p class="ta-sub" id="taSub">Đang tải…</p>
  </header>

  <div class="ta-bar">
    <label class="ta-search" id="taSearch">
      <span data-ic="search"></span>
      <input id="taQ" type="search" placeholder="Tìm tác giả" autocomplete="off" spellcheck="false" aria-label="Tìm tác giả theo tên">
      <button type="button" class="clr" id="taClr" aria-label="Xoá từ khoá">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </label>

    <div class="ta-seg" id="taSeg" role="group" aria-label="Lọc theo trạng thái"></div>

    <div class="ta-sort" id="taSortBox">
      <button type="button" id="taSortBtn" aria-expanded="false" aria-haspopup="true" aria-label="Sắp xếp">
        <span id="taSortLabel">A–Z</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu" id="taSortMenu" role="menu" aria-label="Cách sắp xếp">
        <button type="button" role="menuitemradio" data-sort="az" aria-checked="true">Tên A–Z <span class="ck">✓</span></button>
        <button type="button" role="menuitemradio" data-sort="count" aria-checked="false">Nhiều truyện <span class="ck">✓</span></button>
        <button type="button" role="menuitemradio" data-sort="new" aria-checked="false">Mới cập nhật <span class="ck">✓</span></button>
      </div>
    </div>
  </div>

  <div class="ta-out" id="taOut"></div>
</main>

<footer id="ftr"></footer>
<script src="/site/cz-config.js"></script>
<script src="/site/cz-app.js"></script>
<script src="data.js"></script>
<script src="pp.js"></script>
<script>
try {
  if (window.CZ && CZ.mountShell) CZ.mountShell({ active: 'authors' });
  document.querySelectorAll('[data-ic]').forEach(function (el) {
    if (window.CZ && CZ.icon) el.outerHTML = CZ.icon(el.dataset.ic);
  });
} catch (e) {}
</script>
</body>
</html>
