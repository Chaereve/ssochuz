/* ============================================================================
   VÒNG 17 · TRỢ THỦ CHO TRANG CHỦ
   ----------------------------------------------------------------------------
   HP_DAYS: đúng 7 token mà cz-home.js `parseDays()` sinh ra và so với
   WD = ['T2'…'T7','CN'] — lưu xuống KV vẫn là chuỗi "Thứ 2, Thứ 5" như cũ,
   chỉ khác là người dùng bấm chip thay vì gõ.
   ========================================================================== */
var HP_DAYS=[['T2','Thứ 2'],['T3','Thứ 3'],['T4','Thứ 4'],['T5','Thứ 5'],['T6','Thứ 6'],['T7','Thứ 7'],['CN','Chủ nhật']];
function hpDaysOf(s){
  return String(s||'').split(/[,/–—]+/).map(function(p){
    p=p.trim();if(!p)return '';
    if(/^\d+$/.test(p))return 'T'+p;
    if(/chủ|chunhat|^cn$/i.test(p))return 'CN';
    var m=p.match(/(\d+)/);return m?('T'+m[1]):p;
  }).filter(Boolean);
}
/* Dùng cùng thứ tự cho dòng sửa, chỉ số data-idx, xem trước và bản lưu.
   Dòng nhiều thứ lấy thứ sớm nhất; chưa chọn thứ thì nằm cuối. */
function hpFirstDay(s){
  var tokens=hpDaysOf(s);
  var rank=HP_DAYS.findIndex(function(day){return tokens.indexOf(day[0])>=0;});
  return rank<0?HP_DAYS.length:rank;
}
function hpSortSchedule(rows){
  return rows.sort(function(a,b){return hpFirstDay(a.d)-hpFirstDay(b.d);});
}
/* Tên để ghi ra KV: đọc lại đúng dạng "Thứ 2, Thứ 5" mà syncBlogger/CMS quen. */
function hpDaysText(tokens){
  var out=[];
  HP_DAYS.forEach(function(d){if(tokens.indexOf(d[0])>=0)out.push(d[1]);});
  tokens.forEach(function(t){if(!HP_DAYS.some(function(d){return d[0]===t;}))out.push(t);});
  return out.join(', ');
}
function hpBook(slug){return state.books.find(function(b){return b.id===slug;})||null;}
function hpSnapshotObj(){
  return {
    s:(state.slides||[]).map(function(x){return [x.b,x.r];}),
    p:(state.picked||[]).slice(),c:(state.schedule||[]).map(function(x){return [x.d,x.b,x.c,x.t||''];}),
    n:state.models['hp-note']!=null?state.models['hp-note']:(state.hpNote||''),
    b:!!state.models['hp-banner'],
    t:state.models['hp-text']||'',h:state.models['hp-href']||''
  };
}
function hpSnapshot(){return JSON.stringify(hpSnapshotObj());}
/* Lần render ĐẦU sau khi hydrate (hoặc sau khi lưu) là mốc sạch: state.hpBase
   do lớp KV đặt, thiếu thì tự lấy chính dữ liệu đang có — và giữ luôn một bản
   sao trong state.hpKeep để nút Hoàn tác quay về đúng dữ liệu đã lưu. */
function hpDirty(){
  var cur=hpSnapshot();
  if(state.hpBase==null){
    state.hpBase=cur;
    state.hpKeep=JSON.parse(cur);
    return false;
  }
  return cur!==state.hpBase;
}
/* Đặt lại mốc: dùng khi nạp lại dữ liệu (Đọc lại / resetDemo của prototype) để
   lần render sau lấy dữ liệu mới làm mốc “đã lưu”, không báo Chưa lưu oan. */
function hpClear(){state.hpBase=null;state.hpKeep=null;}
function hpBanner(){
  var on=!!state.models['hp-banner'],tx=String(state.models['hp-text']||'').trim();
  return (on&&tx)?tx:'';
}
/* Danh sách lên hero — PHẢI khớp src/cz-home.js:
     có slides  → đúng thứ tự slides[] (tối đa 5)
     không có   → 5 bộ mới cập nhật nhất (sắp theo ngày, KHÔNG theo thứ tự lib)
   Bản trước gán đè bằng `state.books.slice(0,5)` nên preview hiện 5 bộ đầu
   registry trong khi trang thật hiện 5 bộ mới nhất — preview nói dối. */
function hpHeroList(){
  var list=(state.slides||[]).map(function(x){return hpBook(x.b);}).filter(Boolean);
  if(!list.length){
    list=state.books.slice().filter(function(b){return b.ch>0;})
      .sort(function(a,b){return String(b.d||'').localeCompare(String(a.d||''));});
  }
  return list.slice(0,5);
}
/* Cột “Xem trước”: dựng từ CHÍNH state đang sửa, không phải ảnh chụp tay. */
function hpPvHTML(){
  var mob=state.hpPreview==='mobile';
  var banner=hpBanner();
  var series=(state.picked||[]).map(hpBook).filter(Boolean).slice(0,8);
  var sched=(state.schedule||[]).filter(function(x){return x&&x.b;}).slice(0,4);
  var hero=hpHeroList();
  var main=hero[0];
  var rail=state.books.slice().filter(function(b){return b.ch>0;})
    .sort(function(a,b){return String(b.d||'').localeCompare(String(a.d||''));}).slice(0,4);
  var heroHTML=!hero.length
    ? '<div class="hp-pv-empty">Chưa có bộ nào để dựng hero.</div>'
    : '<div class="hp-pv-hero">'+
        (main?cover(main,'hp-pv-big'):'')+
        '<div class="hp-pv-herot">'+
          '<span class="hp-pv-k">Nổi bật hôm nay</span>'+
          '<b>'+esc(main?main.t:'—')+'</b>'+
          (main&&main.a?'<span class="hp-pv-a">'+esc(main.a)+'</span>':'')+
          (main&&main.syn?'<span class="hp-pv-s">'+esc(String(main.syn).slice(0,110))+(String(main.syn).length>110?'…':'')+'</span>':'')+
        '</div>'+
      '</div>'+
      (hero.length>1?'<div class="hp-pv-fan">'+hero.slice(1).map(function(b){
        return '<span class="hp-pv-fan-i'+(b.id===(main&&main.id)?' on':'')+'" title="'+esc(b.t)+'">'+cover(b,'hp-pv-thumb')+'</span>';
      }).join('')+'</div>':'');
  return '<div class="hp-pv'+(mob?' mob':'')+'" aria-label="Xem trước trang chủ">'+
    '<div class="hp-pv-bar"><span class="hp-pv-url">ssochuz.pages.dev</span><span class="hp-pv-dot"></span></div>'+
    '<div class="hp-pv-scroll">'+
      (banner?'<div class="hp-pv-ann">'+icon('bell','xs')+'<span>'+esc(banner)+'</span></div>':'')+
      heroHTML+
      '<div class="hp-pv-sec"><span class="hp-pv-h">Mới cập nhật</span>'+
        (rail.length?rail.map(function(b){
          return '<span class="hp-pv-rail">'+cover(b,'hp-pv-mini')+'<span class="hp-pv-railt"><b>'+esc(b.t)+'</b><i>'+esc(b.a||'')+'</i></span></span>';
        }).join(''):'<span class="hp-pv-none">Chưa có chương nào.</span>')+
      '</div>'+
      (series.length?'<div class="hp-pv-sec"><span class="hp-pv-h">Chuyển thể Series<span class="hp-pv-n">'+series.length+' bộ đã chọn · web hiện 8</span></span>'+
        '<div class="hp-pv-grid">'+series.slice(0,3).map(function(b){
          return '<span class="hp-pv-cell">'+cover(b,'hp-pv-thumb')+'<b>'+esc(b.t)+'</b></span>';
        }).join('')+'</div></div>':'')+
      (sched.length?'<div class="hp-pv-sec"><span class="hp-pv-h">Lịch ra chương</span>'+
        sched.map(function(x){
          var b=hpBook(x.b),day=HP_DAYS[hpFirstDay(x.d)];
          return '<span class="hp-pv-rail"><span class="hp-pv-day">'+esc(day?day[0]:'—')+'</span><span class="hp-pv-railt"><b>'+esc(b?b.t:'—')+'</b><i>'+esc(x.c||x.d)+'</i></span></span>';
        }).join('')+'</div>':'')+
    '</div></div>';
}

function hpSyncLive(){

  if(pv)pv.innerHTML=hpPvHTML();

  if(ann)ann.innerHTML=hpAnnStatus();

/* Bật/tắt một thứ cho dòng lịch. Ghi ra KV vẫn là chuỗi "Thứ 2, Thứ 5" nên
   `CZ.schedule()` và cz-home.js không phải đổi gì. */
function hpToggleDay(idx,day){
  var it=state.schedule[idx];if(!it)return;
  var cur=hpDaysOf(it.d),at=cur.indexOf(day);
  if(at>=0)cur.splice(at,1);else cur.push(day);
  cur.sort(function(a,b){
    var ia=HP_DAYS.findIndex(function(d){return d[0]===a;}),ib=HP_DAYS.findIndex(function(d){return d[0]===b;});
    return (ia<0?9:ia)-(ib<0?9:ib);
  });
  it.d=hpDaysText(cur);
}
/* Hoàn tác: đọc lại đúng mốc đã lưu. Giữ object cũ trong state.hpKeep để bấm
   Hoàn tác nhiều lần vẫn quay về dữ liệu KV, không quay về bản vừa sửa. */
function hpResetAll(){
  var snap=state.hpKeep||null;
  if(!snap){state.hpBase=null;hpDirty();hpSyncLive();return;}
  state.slides=snap.s.map(function(x){return {b:x[0],r:x[1]};});
  state.picked=snap.p.slice();
  state.schedule=snap.c.map(function(x){return {d:x[0],b:x[1],c:x[2],t:x[3]};});
  state.hpNote=snap.n;state.models['hp-note']=snap.n;
  state.models['hp-banner']=snap.b;
  state.models['hp-text']=snap.t;state.models['hp-href']=snap.h;
  state.hpBase=hpSnapshot();
  hpSyncLive();
}
/* Lọc tại chỗ danh sách bộ trong ô "Thêm slide": chỉ ẩn/hiện <option>, KHÔNG
   render lại — render lại là mất focus và mất chữ đang gõ. */
function hpSlideFilter(q){
  var sel=document.getElementById('addSlideSel');if(!sel)return;
  var kw=String(q||'').toLowerCase().trim(),first='';
  Array.prototype.forEach.call(sel.options,function(o){
    if(!o.value){o.hidden=false;return;}
    var b=hpBook(o.value);
    var hay=String(o.textContent+' '+(b?b.a+' '+b.id:'')).toLowerCase();
    var hit=!kw||hay.indexOf(kw)>=0;
    o.hidden=!hit;o.disabled=!hit;
    if(hit&&!first)first=o.value;
  });
  sel.value=first;
}

    ['hpSumSched',(state.schedule||[]).length]];
  map.forEach(function(p){var e=document.getElementById(p[0]);if(e)e.textContent=String(p[1]);});
  hpSyncLive();
}

function settingsHTML(){
  var m=state.models;
  /* Vòng 18c — ba lỗi của tab này:
       · “Khôi phục” ghi “Ghi đè gõ KHÔI PHỤC” nhưng KHÔNG có ô nào để gõ
         (khoá xác nhận nằm trong hộp thoại) ⇒ câu hướng dẫn chỉ sai địa chỉ;
       · “Bảo trì số liệu” không cho thấy tình trạng kho KV dù mọi dữ liệu đều
         nằm ở đó ⇒ thêm khối Sức khoẻ KV (đọc /api/admin/kv qua window.__czKv);
       · hai cột không nói được bản backup chứa gì. */
  var kv = (window.__czKv && window.__czKv()) || null;
  var groups = (kv && Array.isArray(kv.groups)) ? kv.groups : [];

const DOCS_HTML = '';
var DOCS_CACHE = DOCS_HTML;

/* ============================================================

state.confirmValue='';
state.modalJustOpened=false;
state.lastFocus=null;


function renderModal(){
  var root=document.getElementById('modalRoot'),c=state.modal;
  if(!c){root.innerHTML='';return;}
  var inner;
  if(c.kind==='docs'){
    inner='<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="docsTitle">'+
      '<div class="modal-hd"><h3 id="docsTitle">Tài liệu bàn giao · Quản trị ssochuz</h3><button class="btn icon ghost sm" data-act="close-modal" aria-label="Đóng">'+icon('x','s')+'</button></div>'+
      '<div class="modal-bd" style="display:block"><div id="docsContent">'+(DOCS_HTML||'<p class="sm mut">Đang tải tài liệu…</p>')+'</div></div>'+
      '<div class="modal-ft"><span class="xs dim">DỮ LIỆU THẬT</span><button class="btn sm" data-act="close-modal">Đóng</button></div></div>';
  }else if(c.kind==='strong'){
    var ok=(state.confirmValue||'').trim()===c.phrase;
    inner='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">'+
      '<div class="modal-hd">'+icon('alert','s')+'<h3 id="modalTitle">'+esc(c.title)+'</h3></div>'+
      '<div class="modal-bd"><div class="warnbox">'+icon('alert','s')+'<span>'+esc(c.desc)+'</span></div>'+
      '<div class="field"><label>Gõ chính xác để xác nhận</label>'+
      '<input class="inp" id="confirmPhrase" data-role="confirm-input" autocomplete="off" spellcheck="false" value="'+esc(state.confirmValue||'')+'" placeholder="Gõ theo cụm bên dưới">'+
      '<span class="hint">Cụm cần gõ: <span class="confirm-phrase">'+esc(c.phrase)+'</span></span></div>'+
      '<p class="xs dim">Thao tác này ghi trực tiếp lên Cloudflare KV.</p></div>'+
      '<div class="modal-ft"><button class="btn" data-act="close-modal">Huỷ</button><button class="btn danger pri" id="confirmOk" data-act="confirm-ok"'+(ok?'':' disabled')+'>'+esc(c.confirmLabel||'Xác nhận')+'</button></div></div>';
  }else{
    inner='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">'+
      '<div class="modal-hd">'+icon('info','s')+'<h3 id="modalTitle">'+esc(c.title)+'</h3></div>'+
      '<div class="modal-bd"><p class="sm mut">'+esc(c.desc)+'</p></div>'+
      '<div class="modal-ft"><button class="btn" data-act="close-modal">Huỷ</button><button class="btn '+(c.danger?'danger pri':'pri')+'" data-act="confirm-ok">'+esc(c.confirmLabel||'Tiếp tục')+'</button></div></div>';
  }
  root.innerHTML='<div class="modal-scrim" data-act="close-modal">'+inner+'</div>';
  hydrateIcons(root);
  if(state.modalJustOpened){
    state.modalJustOpened=false;
    var f=root.querySelector('#confirmPhrase')||root.querySelector('[data-act="confirm-ok"]')||root.querySelector('[data-act="close-modal"]');
    if(f) f.focus();
  }
}
function openModal(cfg){
  state.lastFocus=document.activeElement;
  state.modal=cfg;state.confirmValue='';state.modalJustOpened=true;
  renderModal();
}
function openStrong(title,desc,phrase,onConfirm,label){
  openModal({kind:'strong',title:title,desc:desc,phrase:phrase,onConfirm:onConfirm,confirmLabel:label||'Xác nhận'});
}
function openSimple(title,desc,onConfirm,label,danger){
  openModal({kind:'simple',title:title,desc:desc,onConfirm:onConfirm,confirmLabel:label||'Tiếp tục',danger:!!danger});
}
function closeModal(){
  var f=state.lastFocus;
  state.modal=null;state.confirmValue='';
  renderModal();render();
  if(f&&f.focus)try{f.focus();}catch(e){}
}
function applyConfirm(){
  var c=state.modal;if(!c)return;
  if(c.kind==='strong'){
    if((state.confirmValue||'').trim()!==c.phrase){
      toast('Cụm xác nhận chưa đúng. Gõ chính xác cụm hiển thị.','bad');
      var el=document.getElementById('confirmPhrase');if(el)el.focus();
      return;
    }
  }
  var fn=c.onConfirm;
  closeModal();
  if(fn)fn();
}
function openDocs(){
  openModal({kind:'docs',title:'Tài liệu bàn giao'});
  /* Mockup giữ DOCS_HTML nhúng để mở offline; bản phát hành build DOCS_HTML
     rỗng và chỉ tải khối lịch sử này khi admin chủ động mở tài liệu. */
  if(DOCS_HTML)return;
  var host=document.getElementById('docsContent');
  if(!host)return;
  if(DOCS_CACHE){host.innerHTML=DOCS_CACHE;return;}
  fetch('/admin-docs',{credentials:'same-origin',cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(markup){
      if(!state.modal||state.modal.kind!=='docs')return;
      DOCS_CACHE=markup;
      var target=document.getElementById('docsContent');
      if(target)target.innerHTML=markup;
    })
    .catch(function(){
      var target=document.getElementById('docsContent');
      if(target&&state.modal&&state.modal.kind==='docs')target.innerHTML='<p class="sm mut" role="alert">Không tải được tài liệu. Đóng cửa sổ rồi thử mở lại.</p>';
    });
}

function slugify(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function val(id){var el=document.getElementById(id);return el?el.value.trim():String(state.models[id]||'').trim();}

  var arr=filteredBooks(),per=20,page=Math.min(state.lib.page,Math.max(1,Math.ceil(arr.length/per)));

}

function saveEdit(){
  var ids=['eb-t','eb-slug','eb-a'];clearErrors(ids);

  if(sl!==slugOf(b)) openStrong('Xác nhận đổi slug',slugOf(b)+' → '+sl+' · liên kết cũ sẽ hỏng.','ĐỔI SLUG',commitEdit,'Lưu và đổi slug');

}

function exportBooks(type){

  if(!arr.length){toast('Chọn ít nhất một bộ để xuất.','warn');return;}

/* ---------- Đổi case: CHỈ áp dụng cho Tên chương ---------- */
function transformCase(text,mode){
  var t=String(text||'');
  if(mode==='upper')return t.toLocaleUpperCase('vi');
  if(mode==='lower')return t.toLocaleLowerCase('vi');
  if(mode==='title')return t.toLocaleLowerCase('vi').replace(/(^|\s)(\S)/g,function(m,p,c){return p+c.toLocaleUpperCase('vi');});
  if(mode==='sentence')return t.toLocaleLowerCase('vi').replace(/(^|[.!?]\s+)([^\s])/g,function(m,p,c){return p+c.toLocaleUpperCase('vi');});
  return t;
}
function applyCase(mode){
  var ti=document.getElementById('chapterTitle');
  if(!ti){toast('Đổi case chỉ dành cho tên chương.','info');return;}
  var t=transformCase(ti.value,mode);
  ti.value=t;
  var c=state.chapters[state.activeChapter];if(c)c.t=t;
  var lab=document.querySelector('[data-act="chapter-select"][data-idx="'+state.activeChapter+'"] span');
  if(lab)lab.textContent=t||'Chương';
  state.savedAt=timeNow();
  var n=document.getElementById('saveNote');
  if(n)n.innerHTML=icon('check','xs')+' Đã lưu lúc '+esc(state.savedAt)+'';
  toast('Đã đổi case tên chương.');
}
/* Dấu ngăn cách nội dung: chèn tại con trỏ, hoặc cuối chương nếu chưa có caret */
function insertSeparator(){
  var sep='<p class="ch-sep">•••</p><p><br></p>';
  var ed=document.getElementById('editor');
  if(!ed){
    state.editorPreview=false;state.editorSeed=sanitizeEditorHtml(state.editorSeed+sep);render();
    toast('Đã chèn dấu ngăn cách.');return;
  }
  ed.focus();
  var sel=window.getSelection&&window.getSelection();
  if(sel&&(!sel.rangeCount||!ed.contains(sel.anchorNode))){
    var r=document.createRange();r.selectNodeContents(ed);r.collapse(false);
    sel.removeAllRanges();sel.addRange(r);
  }
  var before=ed.innerHTML,done=false;
  try{done=document.execCommand('insertHTML',false,sep);}catch(e){}
  if(!done||ed.innerHTML===before)ed.insertAdjacentHTML('beforeend',sep);
  state.editorSeed=sanitizeEditorHtml(ed.innerHTML);
  state.savedAt=timeNow();
  var n=document.getElementById('saveNote');
  if(n)n.innerHTML=icon('check','xs')+' Đã lưu lúc '+esc(state.savedAt)+'';
  toast('Đã chèn dấu ngăn cách.');
}

    case 'toggle-account':state.accountOpen=!state.accountOpen;state.notifOpen=false;renderTopbar();break;

       ô nhập) nên nút “Mở bộ” trên dòng báo lỗi bấm KHÔNG có gì xảy ra. */
    case 'open-report-book':{
      var bid=el.dataset.id;
      if(!bid)break;
      if(!(state.books||[]).some(function(b){return b.id===bid;})){
        toast('Bộ “'+bid+'” không còn trong registry — mở Thư viện để kiểm tra.','warn');

      }

    case 'blogger-sync':openStrong('Đồng bộ metadata Blogger','Cập nhật registry từ list-novel; KV vẫn là nguồn thắng.','ĐỒNG BỘ',function(){toast('Đã đồng bộ metadata Blogger.');},'Đồng bộ');break;
    case 'login-supabase':delete state.models['gate-key'];toast('Đăng nhập Supabase · DỮ LIỆU THẬT.');navigate('dashboard');break;
    case 'static-mode':delete state.models['gate-key'];state.conn='static';toast('Chế độ dữ liệu tĩnh, chỉ đọc.');navigate('dashboard');break;
    case 'connect':connect();break;
    default:break;
  }
});

/* ---------- CHANGE / INPUT ---------- */
document.addEventListener('change',function(e){
  var el=e.target;if(!el||!el.dataset)return;
  if(el.dataset.model){
    state.models[el.id]=(el.type==='checkbox')?el.checked:el.value;
    if(String(el.id).indexOf('hp-')===0)hpSyncLive();
    if(state.errors[el.id])setErr(el.id,'');
  }
  var r=el.dataset.role;if(!r)return;
  switch(r){
    /* Ô chọn bộ ở tab Phiếu bầu: trước đây case này nằm nhầm trong listener
       'click' nên đổi bộ KHÔNG lọc lại bảng — bảng vẫn hiện phiếu của bộ
       cũ trong khi nút Gỡ/Reset lại đọc đúng bộ mới ⇒ dễ gỡ nhầm phiếu. */
    /* Hai ô <select> này trước chỉ có case trong listener 'input' — trình duyệt
       thật có bắn 'input' cho select nên vẫn chạy, nhưng mọi bài kiểm và môi
       trường không bắn 'input' thì ô lọc im lặng. Đặt ở 'change' cho đúng chuẩn. */
    case 'issue-filter':state.issueLv=el.value;render();break;
    case 'rep-book':state.repBook=el.value;render();break;
    case 'vote-book':state.voteBook=el.value;state.votePage=1;state.voteSel.clear();render();break;
    case 'mode':state.modes[state.route]=el.value;render();break;
    case 'conn':state.conn=el.value;render();break;
    case 'quota':state.quota=el.value;render();break;
    case 'collapsed':state.collapsed=el.checked;render();break;
    case 'forceDrawer':state.forceDrawer=el.checked;render();break;
    case 'sim360':state.sim360=el.checked;render();break;
    case 'gate-static':state.models['gate-static']=el.checked;break;
    case 'nb-first':state.models['nb-first']=el.checked;break;
    case 'lib-status':state.lib.status=el.value;state.lib.page=1;render();break;
    case 'lib-pub':state.lib.pub=el.value;state.lib.page=1;render();break;
    case 'lib-vis':state.lib.vis=el.value;state.lib.page=1;render();break;
    case 'lib-adult':state.lib.adult=el.value;state.lib.page=1;render();break;
    case 'lib-lock':state.lib.lock=el.value;state.lib.page=1;render();break;
    case 'lib-sort':state.lib.sort=el.value;state.lib.page=1;render();break;
    case 'cmt-book':state.cmtBook=el.value;render();break;
    case 'vote-sel':
      if(el.checked)state.voteSel.add(Number(el.dataset.idx));else state.voteSel.delete(Number(el.dataset.idx));
      var vc=document.querySelector('.card-hd .right');if(vc)vc.textContent=state.voteSel.size+' phiếu được chọn';break;
    case 'bulk-action':state.bulkAction=el.value;break;
    case 'case-mode':if(el.value){applyCase(el.value);el.value='';}break;
    case 'chapter-status':state.chapterStatus=el.value;render();break;
    case 'chapter-book':state.chapterBook=el.value;break;
    case 'sel-all':
      currentPageBooks().forEach(function(b){if(el.checked)state.sel.add(b.id);else state.sel.delete(b.id);});
      render();break;
    case 'sel-row':
      if(el.checked)state.sel.add(el.dataset.id);else state.sel.delete(el.dataset.id);
      render();break;
    case 'switch-book':selectBook(el.value);render();break;
    case 'lock-switch':setLock(el.checked?1:0);break;
    case 'picked':
      var pid=el.dataset.id,at=state.picked.indexOf(pid);
      if(el.checked&&at<0)state.picked.push(pid);
      if(!el.checked&&at>=0)state.picked.splice(at,1);
      break;
    case 'slide-book':state.slides[Number(el.dataset.idx)].b=el.value;render();break;
    case 'sched-book':state.schedule[Number(el.dataset.idx)].b=el.value;hpSyncLive();break;
    case 'restore-file':
      if(el.files&&el.files.length){
        openStrong('Khôi phục từ JSON','Ghi đè registry và book · không hoàn tác.','KHÔI PHỤC',function(){
          toast('Đã khôi phục backup.');render();
        },'Khôi phục');
        el.value='';
      }break;
    case 'import-file':
      if(el.files&&el.files.length){
        var kind=el.dataset.kind,name=el.files[0].name;
        if(kind==='multi'){
          for(var i=0;i<3;i++)/* bản phát hành: import-file do admin-real.js xử lý, ghi KV thật */
          toast('Đã nhập chương từ '+name+'.');
        }else toast('Đã nạp '+kind.toUpperCase()+': '+name+'.','info');
        el.value='';render();
      }break;
    case 'chapter-image':
      if(el.files&&el.files.length){
        state.editorPreview=false;
        state.editorSeed+='<div class="file" style="margin:10px 0">'+icon('image','s')+' Ảnh trong chương: '+esc(el.files[0].name)+' (DỮ LIỆU THẬT)</div>';
        el.value='';toast('Đã chèn ô ảnh vào chương.');render();
      }break;
    case 'cover-upload':
      if(el.files&&el.files.length){
        var t=document.getElementById(el.dataset.target);
        if(t)t.innerHTML='<span class="cover cv-3 lg" aria-label="Ảnh bìa đã tải">ẢNH<br>MỚI</span>';
        toast('Đã tải ảnh bìa: '+el.files[0].name+'.','info');
        el.value='';
      }break;
  }
});
let saveTimer=null;
let sT=null,sC=false;
document.addEventListener('compositionstart',function(){sC=true;});
document.addEventListener('compositionend',function(){sC=false;});
function scheduleSearchRender(r,p){
  clearTimeout(sT);
  sT=setTimeout(function(){
    if(sC){scheduleSearchRender(r,p);return;}
    var f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.role===r;
    render();
    if(f){var n=document.querySelector('[data-role="'+r+'"]');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}}
  },160);
}
/* Dán vào trình soạn: chỉ chèn text thường. Nếu để trình duyệt tự dán HTML,
   onerror của <img> chạy ngay trong DOM sống trước khi sự kiện input kịp lọc. */
document.addEventListener('paste',function(e){
  if(window.__CZ_REAL_EDITOR__)return;
  var t=e.target;
  if(!t||!t.closest||!t.closest('#editor'))return;
  e.preventDefault();
  var cd=e.clipboardData||window.clipboardData;
  var text=cd?String(cd.getData('text/plain')||''):'';
  if(document.execCommand)document.execCommand('insertText',false,text);
  sanitizeEditorDom();
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el||!el.dataset)return;
  var mid=el.dataset.model;
  if(mid){
    state.models[mid]=el.value;
    if(mid.indexOf('hp-')===0)hpSyncLive();
    if(state.errors[mid])setErr(mid,'');
    if(mid==='nb-t'){
      var sl=document.getElementById('nb-slug');
      if(sl&&!sl.value){var auto=slugify(el.value);state.models['nb-slug']=auto;sl.value=auto;}
    }
    if(mid==='eb-slug'){
      var b=getBook(state.selectedBook),orig=slugOf(b),w=document.getElementById('slugWarn'),wt=document.getElementById('slugWarnText');
      if(w)w.hidden=(el.value===orig);
      if(wt)wt.innerHTML='<b>Cảnh báo đổi slug:</b> '+esc(orig)+' → '+esc(el.value)+'. Liên kết cũ sẽ hỏng; cần xác nhận khi lưu.';
    }
  }
  var r=el.dataset.role;if(!r)return;
  switch(r){
    case 'cmt-q':
      state.cmtQ=el.value;
      scheduleSearchRender('cmt-q',el.value.length);
      break;
    case 'lib-q':
      state.lib.q=el.value;state.lib.page=1;
      scheduleSearchRender('lib-q',el.value.length);
      break;
    case 'suggest-input':
      state.suggestQuery=el.value;state.suggestOpen=true;
      var wrap=el.closest('.search'),old=wrap?wrap.querySelector('.suggest'):null;
      if(old)old.remove();
      if(wrap){wrap.insertAdjacentHTML('beforeend',suggestList(state.suggestQuery,'suggest'));hydrateIcons(wrap);}
      el.setAttribute('aria-expanded','true');break;
    case 'palette-input':
      state.paletteQuery=el.value;state.paletteIndex=0;updatePaletteList();break;
    case 'confirm-input':
      state.confirmValue=el.value;
      var ok=document.getElementById('confirmOk');
      if(ok&&state.modal&&state.modal.kind==='strong')ok.disabled=(el.value.trim()!==state.modal.phrase);
      break;
    case 'editor':
      if(window.__CZ_REAL_EDITOR__)break;
      sanitizeEditorDom();
      clearTimeout(saveTimer);
      saveTimer=setTimeout(function(){
        state.savedAt=timeNow();
        var n=document.getElementById('saveNote');
        if(n)n.innerHTML=icon('check','xs')+' Đã lưu lúc '+esc(state.savedAt)+'';
      },700);
      break;
    case 'chapter-title':
      var ct=state.chapters[state.activeChapter];if(ct)ct.t=el.value;
      var ctb=document.querySelector('[data-act="chapter-select"][data-idx="'+state.activeChapter+'"] span');
      if(ctb)ctb.textContent=el.value||'Chương';
      break;
    case 'chapter-at':state.chapterAt=el.value;break;
    case 'couple-row':
      var cf3=el.dataset.form;state.couples[cf3][Number(el.dataset.idx)]=el.value;syncCouples(cf3);break;
    case 'hp-note':state.hpNote=el.value;state.models['hp-note']=el.value;hpSyncLive();break;
    case 'slide-reason':state.slides[Number(el.dataset.idx)].r=el.value;hpSyncLive();break;
    case 'sched-date':state.schedule[Number(el.dataset.idx)].d=el.value;hpSyncLive();break;
    case 'sched-ch':state.schedule[Number(el.dataset.idx)].c=el.value;hpSyncLive();break;
    case 'hp-slide-q':hpSlideFilter(el.value);break;
    case 'issue-q':state.issueQ=el.value;render();break;
  }
});

/* ---------- BÀN PHÍM ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.role==='couple-row'){
    e.preventDefault();
    var cf4=e.target.dataset.form;state.couples[cf4].push('');syncCouples(cf4);render();
    var er=document.querySelectorAll('[data-role="couple-row"][data-form="'+cf4+'"]');
    if(er.length)er[er.length-1].focus();return;
  }
  if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){
    e.preventDefault();
    if(state.modal)return;
    state.paletteOpen?closePalette():openPalette();return;
  }
  var mod=e.ctrlKey||e.metaKey;
  if(mod){
    var kk=String(e.key||'').toLowerCase();
    if(kk==='s'){
      e.preventDefault();
      if(state.modal||state.paletteOpen)return;
      shortcutSave();return;
    }
    if(kk==='n'||e.code==='KeyN'){
      if(state.modal||state.paletteOpen)return;
      if(state.route==='chuong'||state.route==='sua-bo'){
        e.preventDefault();shortcutNewChapter();
      }
      return;
    }
  }
  if(e.key==='Escape'){
    if(state.modal){closeModal();return;}
    if(state.paletteOpen){closePalette();return;}
    if(state.drawer||state.forceDrawer){state.drawer=false;state.forceDrawer=false;render();return;}
    if(state.notifOpen||state.accountOpen||state.suggestOpen){
      state.notifOpen=false;state.accountOpen=false;state.suggestOpen=false;renderTopbar();return;
    }
  }
  if(state.paletteOpen&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();
    var n=searchData(state.paletteQuery).length;
    if(n){state.paletteIndex=(state.paletteIndex+(e.key==='ArrowDown'?1:-1)+n)%n;updatePaletteList();}
    return;
  }
  if(state.paletteOpen&&e.key==='Enter'&&e.target&&e.target.id==='paletteInput'){
    e.preventDefault();
    var list=searchData(state.paletteQuery),hit=list[state.paletteIndex];
    if(hit)pickSearch(hit.type,hit.id,'palette');
    return;
  }
  if((state.modal||state.paletteOpen)&&e.key==='Tab'){
    var root=state.modal?document.querySelector('.modal'):document.querySelector('.palette-box');
    if(!root)return;
    var f=Array.prototype.slice.call(root.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])'))
      .filter(function(x){return x.offsetParent!==null;});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
