<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/ssochuz.png?v=1">
<link rel="apple-touch-icon" href="/ssochuz.png?v=1">
<link rel="manifest" href="/manifest.webmanifest">
<title>ssochuz library · Quản trị · Cloudflare KV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PHASE 2 · HỆ THỐNG THIẾT KẾ
   Mọi màu dùng trong giao diện được khai báo một lần tại :root.
   Tên token đúng yêu cầu để thay bằng token thật khi chuyển code.
   ============================================================ */
:root{
  --bg:#14110E;          /* nền chính, tối ấm */
  --bg2:#100D0B;         /* sidebar sâu hơn một bậc */
  --surf:#1C1814;        /* mặt thẻ */
  --surf2:#241F19;       /* mặt nâng / input / thead */
  --surf3:#2E2720;       /* hover, chip, cột biểu đồ */
  --txt:#F2ECE4;         /* chữ chính */
  --mut:#B8AC9E;         /* chữ phụ */
  --dim:#A79B8D;         /* nhãn nhỏ, vẫn >= 4.5:1 trên mọi mặt */
  --acc:#F291B4;         /* HỒNG — giá trị tạm, chỉ dùng có chủ đích */
  --acc-soft:#3A2230;    /* nền hồng nhạt cho tab chọn */
  --bd:#332C25;          /* vạch tóc */
  --bd2:#4A4036;         /* viền điều khiển */
  --ok:#86D9AA;
  --warn:#EFC281;
  --bad:#FF9A97;
  --ring:#F7BBD1;        /* focus ring */

  /* Màu phái sinh — vẫn là biến, không có literal rải rác */
  --ink:#1B1114;          /* chữ trên nền --acc */
  --ok-bg:#173326;  --warn-bg:#3A2D18;  --bad-bg:#3C2022;
  --info:#9CC4F5;   --info-bg:#1C2B3C;
  --violet:#C6AEFF; --violet-bg:#2A2340;
  --slate:#C3B9AE;  --slate-bg:#2A2621;
  --neutral-bg:#2B251F;
  --cover-1:#3A2D3C; --cover-2:#2B3A38; --cover-3:#3A3227;
  --cover-4:#33273A; --cover-5:#2D323F; --cover-6:#3B2B2B;
  --scrim:#0A0807D9;

  /* Quy mô: lưới 8px, bo 6/8/12px, điều khiển 36–42px */
  --side:248px; --top:60px; --h:38px; --h-lg:42px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px;
  --r6:6px; --r8:8px; --r12:12px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --head:'Fraunces','Iowan Old Style',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:400 14px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-family:var(--head);font-weight:600;line-height:1.2;letter-spacing:-.012em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r6)}
::selection{background:var(--acc);color:var(--ink)}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;padding:10px 14px;border:1px solid var(--acc);border-radius:var(--r6);background:var(--surf)}
.skip:focus{left:12px}
.ic{width:24px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.ic.s{width:18px;height:18px}
.ic.xs{width:15px;height:15px}
.mono{font-family:var(--mono)}
.lb{font:600 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.eyebrow{font:600 10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.mut{color:var(--mut)} .dim{color:var(--dim)}
.sm{font-size:12.5px} .xs{font-size:11.5px}
.grow{flex:1 1 auto;min-width:0}
.row{display:flex;align-items:center;gap:var(--s1);min-width:0}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.hr{height:1px;background:var(--bd);border:0;margin:var(--s2) 0}
.mt{margin-top:var(--s2)} .mb{margin-bottom:var(--s2)}
.nowrap{white-space:nowrap}
.num{font-family:var(--head);font-variant-numeric:tabular-nums}

/* ---------- Khung ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.app.collapsed{--side:76px}
.frame{grid-column:2;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.sidebar{position:sticky;top:0;grid-column:1;grid-row:1;z-index:45;height:100vh;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;height:var(--top);flex:none;padding:0 14px 0 18px;border-bottom:1px solid var(--bd)}
.brand .dot{width:9px;height:9px;flex:none;border:1px solid var(--acc);border-radius:99px}
.brand .logo{font:600 18px/1 var(--head);letter-spacing:-.02em}
.brand .logo i{font:600 10px/1 var(--mono);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:6px}
.brand .collapse-btn{margin-left:auto;flex:none}
.side-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 10px 18px;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group+.nav-group{margin-top:18px}
.nav-group>.lb{padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:var(--r6);color:var(--mut);font:500 13px/1 var(--font);text-align:left;position:relative;white-space:nowrap}
.nav-item:hover{background:var(--surf2);color:var(--txt)}
.nav-item .ic{width:18px;height:18px}
.nav-item.on{background:var(--acc-soft);color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}
.nav-item .ct{margin-left:auto;min-width:20px;height:18px;padding:0 5px;border-radius:99px;background:var(--surf3);color:var(--mut);font:600 10px/18px var(--mono);text-align:center}
.nav-item.on .ct,.nav-item .ct.hot{background:var(--acc);color:var(--ink)}
.nav-item.gated{color:var(--dim)}
.nav-item>.tx{overflow:hidden;text-overflow:ellipsis}
.app.collapsed .brand{padding:0;justify-content:center}
/* Khi thu gọn chỉ còn ĐÚNG MỘT biểu tượng ở đầu rail (nút thu gọn) và 13 icon
   nav, tất cả canh giữa cùng một trục. Chấm thương hiệu + chữ logo phải ẩn hẳn,
   nếu không chúng bị đẩy về 2 mép do margin-left:auto ⇒ "lệch icon". */
.app.collapsed .brand .dot,.app.collapsed .brand .logo,.app.collapsed .brand .tx,.app.collapsed .brand .logo i,.app.collapsed .nav-group>.lb,.app.collapsed .nav-item>.tx,.app.collapsed .nav-item>.ct,.app.collapsed .side-foot{display:none}
.app.collapsed .brand .collapse-btn{margin:0 auto}
/* Thanh cuộn kiểu Windows chiếm ~15px làm lệch trục icon sang trái. Rail icon
   không cần thanh cuộn lộ ra: vẫn cuộn được bằng wheel/cảm ứng, nhưng không ăn
   chiều rộng. Thu nhỏ nhịp một chút để 13 tab vừa màn hình laptop. */
.app.collapsed .side-scroll{padding:10px;scrollbar-width:none;-ms-overflow-style:none}
.app.collapsed .side-scroll::-webkit-scrollbar{width:0;height:0;display:none}
.app.collapsed .nav-item{justify-content:center;padding:0;min-height:36px}
.app.collapsed .nav-group+.nav-group{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.side-foot{flex:none;border-top:1px solid var(--bd);padding:12px 14px 16px;display:grid;gap:8px}
.side-foot .note{font-size:11.5px;line-height:1.5;color:var(--dim)}
.side-foot button{font:500 12px/1.4 var(--mono);color:var(--mut);text-align:left;text-decoration:underline;text-underline-offset:3px}
.side-foot button:hover{color:var(--acc)}
.side-foot a{font:500 12px/1.4 var(--mono);color:var(--acc);text-align:left;text-decoration:underline;text-underline-offset:3px}
.side-foot a:hover{color:var(--txt)}
.scrim{position:fixed;inset:0;z-index:42;background:var(--scrim);display:none}
.app.drawer .scrim{display:block}

/* ---------- Thanh trên ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:var(--top);padding:0 var(--s3);background:var(--bg);border-bottom:1px solid var(--bd)}
.burger{display:none;width:var(--h);height:var(--h);align-items:center;justify-content:center;border:1px solid var(--bd2);border-radius:var(--r6);color:var(--mut)}
.search{position:relative;flex:0 1 300px;min-width:150px}
.search>.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim);pointer-events:none}
.search .inp{padding-left:34px}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:20px;padding:0 6px;border:1px solid var(--bd2);border-radius:4px;background:var(--surf2);color:var(--mut);font:600 10px/18px var(--mono);pointer-events:none}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;max-height:300px;overflow:auto;padding:6px;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.suggest button{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border-radius:var(--r6);color:var(--txt);font-size:13px;text-align:left}
.suggest button:hover,.suggest button.cur{background:var(--surf2)}
.suggest .k{margin-left:auto;font:600 10px/1 var(--mono);letter-spacing:.08em;color:var(--dim)}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:nowrap}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--h);padding:0 10px;border:1px solid transparent;border-radius:var(--r6);color:var(--mut);font:600 12.5px/1 var(--font);white-space:nowrap}
.tool:hover{background:var(--surf2);color:var(--txt)}
.tool.icon{width:var(--h);padding:0;position:relative}
.tool .ic{width:17px;height:17px}
.tool .ndot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:var(--ink);font:700 10px/16px var(--mono);text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--bd2);border-radius:99px;background:var(--surf);font:600 11px/1 var(--mono);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none;align-self:center;margin:0}
.chip>b{font-weight:700;letter-spacing:.06em;align-self:center;line-height:1}
.chip .chip-num{color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:0;align-self:center;line-height:1}
.chip .chip-state{opacity:.82;letter-spacing:0;align-self:center;line-height:1}
.chip.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.chip.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.chip.t-bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.chip.t-info{color:var(--info);background:var(--info-bg);border-color:var(--info)}
.chip.t-slate{color:var(--slate);background:var(--slate-bg);border-color:var(--slate)}
.popover{position:absolute;right:0;top:calc(100% + 6px);z-index:65;min-width:260px;padding:6px;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.popover .ph{padding:8px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.popover button{display:block;width:100%;min-height:38px;padding:8px 10px;border-radius:var(--r6);color:var(--txt);font-size:13px;text-align:left}
.popover button:hover{background:var(--surf2)}
.popover .row-item{display:block;padding:9px 10px;border-bottom:1px solid var(--bd);font-size:12.5px;color:var(--mut)}
.popover .row-item b{display:block;color:var(--txt);font-weight:600}
.banner{display:flex;align-items:center;gap:10px;padding:10px var(--s3);border-bottom:1px solid var(--warn);background:var(--warn-bg);color:var(--txt);font-size:13px}
.banner.danger{border-bottom-color:var(--bad);background:var(--bad-bg)}
.banner .ic{width:18px;height:18px;color:var(--warn)} .banner.danger .ic{color:var(--bad)}

/* ---------- Điều khiển ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 14px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);color:var(--txt);font:600 13px/1 var(--font);white-space:nowrap;transition:background-color .15s ease}
.btn:hover{background:var(--surf2)}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.pri:hover{background:var(--ring);border-color:var(--ring)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--surf2);color:var(--txt)}
.btn.danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:var(--ink)}
.btn.danger.pri{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.btn.icon{width:var(--h);padding:0}
.btn.sm{min-height:36px;padding:0 10px;font-size:12px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn:disabled:hover{background:var(--surf)}
.inp{width:100%;height:var(--h);padding:0 12px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);color:var(--txt);outline:none;font-size:13px}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;line-height:1.6;resize:vertical}
.inp::placeholder{color:var(--dim);opacity:1}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.inp.invalid{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
select.inp{appearance:none;padding-right:32px;cursor:pointer}
.sel{position:relative;min-width:0}
.sel::after{content:"";position:absolute;right:13px;top:44%;width:7px;height:7px;border-right:1.75px solid var(--mut);border-bottom:1.75px solid var(--mut);transform:rotate(45deg);pointer-events:none}
.field{display:grid;gap:6px;min-width:0}
.field>label{font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.field .err{font-size:11.5px;color:var(--bad);min-height:0}
.field .hint{font-size:11.5px;color:var(--dim)}
.chk{display:inline-flex;align-items:center;gap:9px;min-height:38px;color:var(--mut);font-size:13px;cursor:pointer;position:relative}
.chk input,.sw input{position:absolute;opacity:0;width:18px;height:18px;margin:0;cursor:pointer}
.chk .box{width:18px;height:18px;flex:none;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);display:grid;place-items:center}
.chk input:checked+.box{background:var(--acc);border-color:var(--acc)}
.chk input:checked+.box::after{content:"";width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.chk input:focus-visible+.box,.sw input:focus-visible+.track{outline:2px solid var(--ring);outline-offset:2px}
.sw{display:inline-flex;align-items:center;gap:9px;min-height:38px;color:var(--mut);font-size:13px;cursor:pointer;position:relative}
.sw .track{width:36px;height:20px;flex:none;border:1px solid var(--bd2);border-radius:99px;background:var(--surf2);position:relative;transition:background-color .15s ease}
.sw .track::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:99px;background:var(--mut);transition:transform .15s ease}
.sw input:checked+.track{background:var(--acc);border-color:var(--acc)}
.sw input:checked+.track::after{transform:translateX(16px);background:var(--ink)}
.tabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf);max-width:100%;overflow:auto}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:var(--r6);color:var(--mut);font:600 12.5px/1 var(--font);white-space:nowrap}
.tab:hover{background:var(--surf2);color:var(--txt)}
.tab.on{background:var(--acc-soft);color:var(--acc)}
.pg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg button{min-width:36px;height:36px;padding:0 8px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf);color:var(--mut);font:600 12px/1 var(--mono)}
.pg button:hover{background:var(--surf2);color:var(--txt)}
.pg button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.pg button:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;width:auto;max-width:100%;height:22px;padding:0 8px;border:1px solid var(--bd2);border-radius:var(--r6);font:600 10.5px/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.badge .ic{width:12px;height:12px}
.tone-ok{background:var(--ok-bg);color:var(--ok)}
.tone-warn{background:var(--warn-bg);color:var(--warn)}
.tone-bad{background:var(--bad-bg);color:var(--bad)}
.tone-info{background:var(--info-bg);color:var(--info)}
.tone-violet{background:var(--violet-bg);color:var(--violet)}
.tone-slate{background:var(--slate-bg);color:var(--slate)}
.tone-neutral{background:var(--neutral-bg);color:var(--mut)}
.tone-acc{background:var(--acc-soft);color:var(--acc)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:1px solid var(--bd);border-radius:99px;background:var(--surf2);color:var(--mut);font-size:11px;white-space:nowrap}
.badges{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;vertical-align:middle;max-width:100%}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:70;white-space:nowrap;padding:6px 9px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf3);color:var(--txt);font:500 11px/1.3 var(--mono);pointer-events:none}
.file{display:flex;align-items:center;gap:10px;min-height:var(--h);padding:0 12px;border:1px dashed var(--bd2);border-radius:var(--r6);background:var(--surf2);color:var(--mut);font-size:12.5px}
.file input{width:100%;font-size:12px;color:var(--mut)}
.file input::file-selector-button{height:28px;margin-right:10px;padding:0 10px;border:1px solid var(--bd2);border-radius:var(--r6);background:var(--surf3);color:var(--txt);font:600 11px/1 var(--mono);cursor:pointer}

/* ---------- Nội dung trang ---------- */
.view{width:100%;max-width:1480px;padding:var(--s3) var(--s4) 120px;min-width:0}
.pagehead{display:flex;align-items:flex-start;gap:var(--s2);margin-bottom:var(--s3);flex-wrap:wrap}
.pagehead .hh{min-width:0;flex:1 1 320px}
.pagehead .eyebrow{font:600 10px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.pagehead h2{font-size:28px}
.pagehead .desc{color:var(--mut);font-size:13.5px;margin-top:6px;max-width:76ch}
.pagehead .meta{font:500 10.5px/1.5 var(--mono);letter-spacing:.04em;color:var(--dim);margin-top:8px}
.pagehead .actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.sample-note{margin-top:var(--s4);padding-top:12px;border-top:1px solid var(--bd);font:500 11px/1.6 var(--mono);letter-spacing:.03em;color:var(--dim)}
.card{border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);min-width:0}
.card-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.card-hd h3{font-size:17px}
.card-hd .right{margin-left:auto;font:500 11px/1.4 var(--mono);color:var(--dim)}
.card-bd{padding:18px}
.card-bd.tight{padding:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2);align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);align-items:start}
.stack{display:grid;gap:var(--s2);min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s2);align-items:start}
.section-title{font:600 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}

/* Dải số liệu: không bọc card */
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:var(--s3)}
.metric{padding:18px 16px;border-right:1px solid var(--bd);min-width:0}
.metric:last-child{border-right:0}
.metric .n{font:600 30px/1.1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric .k{display:block;margin-top:8px;font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.metric .sub{display:block;margin-top:3px;font-size:11px;color:var(--dim)}
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.todo button{display:grid;gap:6px;align-content:center;padding:14px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf2);text-align:left;min-height:96px}
.todo button:hover{border-color:var(--acc);background:var(--acc-soft)}
.todo .n{font:600 26px/1 var(--head)}
.todo .k{font-size:12.5px;color:var(--mut)}
.list{display:grid;gap:0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);min-width:0}
.list-item:last-child{border-bottom:0}
.list-item .t{flex:1 1 auto;min-width:0}
.list-item .t b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .t>span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Hàng danh sách có cột cố định: badge / nút không bị đẩy lệch giữa các dòng */
.list-item.rep{display:grid;grid-template-columns:minmax(0,1fr) auto 168px 152px;align-items:center;gap:12px}
.list-item.rep>.t{grid-column:1}
.list-item.rep>.badge{grid-column:2;justify-self:start}
.list-item.rep>.row{grid-column:4;justify-self:stretch;justify-content:flex-end}
.list-item.rep>[data-act=toggle-report]{grid-column:4;justify-self:stretch;width:100%}
/* Vòng 18d: báo lỗi dài phải đọc được hết, không cắt bằng dấu “…” một dòng. */
.list-item.rep .rep-txt{display:block;font-size:12.5px;color:var(--txt);white-space:normal;overflow-wrap:anywhere}
.list-item .t>span.rep-txt{white-space:normal}
.list-item.cmt{display:grid;grid-template-columns:minmax(0,1fr) 92px 128px;align-items:center;gap:12px}
.list-item.cmt>.t{grid-column:1}
.list-item.cmt>.badge{grid-column:2;justify-self:start}
.list-item.cmt>[data-act=delete-comment]{grid-column:3;justify-self:stretch;width:100%}
.list-item.q{display:grid;grid-template-columns:minmax(0,1fr) 88px;align-items:center;gap:12px}
.list-item.q>.badge{grid-column:2;justify-self:start}
.list-item.ch{display:grid;grid-template-columns:minmax(0,1fr) var(--h) var(--h) var(--h);align-items:center;gap:6px}
.list-item.ch>[data-act=chapter-select]{width:100%}
.list-item.ch>.btn.icon{width:100%}
@media (max-width:600px){
  /* hẹp: chữ chiếm cả hàng, badge + nút xuống dưới, không tràn ngang */
  .list-item.rep{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .list-item.rep>.row{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .list-item.cmt{grid-template-columns:minmax(0,1fr) 128px;gap:8px}
  .list-item.rep>.t,.list-item.cmt>.t{grid-column:1/-1}
  .list-item.rep>.badge,.list-item.cmt>.badge{grid-column:1}
  .list-item.rep>[data-act=toggle-report],.list-item.cmt>[data-act=delete-comment]{grid-column:2;width:100%;justify-self:end}
  .list-item.q{grid-template-columns:minmax(0,1fr) 88px;gap:8px}
}
/* Tên chương + đổi case cùng một hàng */
.title-case{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title-case>.inp{flex:1 1 220px;width:auto;min-width:0}
.title-case>.sel{flex:0 0 168px;min-width:0}
@media (max-width:600px){.title-case>.inp,.title-case>.sel{flex:1 1 100%}}
.ch-sep,#editor p.ch-sep,#editor .ch-sep,.rtext p.ch-sep,.rtext .ch-sep{display:flex;align-items:center;justify-content:center;gap:14px;width:min(64%,240px);margin:2.15em auto;color:var(--acc);font-family:var(--head);font-size:12.5px;font-weight:400;line-height:1;letter-spacing:0;text-indent:0;text-align:center}
.rtext .ch-sep{user-select:none}
.ch-sep::before,.ch-sep::after,.rtext .ch-sep::before,.rtext .ch-sep::after{content:"";flex:1 1 0;height:1px;opacity:.48}
.ch-sep::before,.rtext .ch-sep::before{background:linear-gradient(90deg,transparent,currentColor)}
.ch-sep::after,.rtext .ch-sep::after{background:linear-gradient(270deg,transparent,currentColor)}
.ed-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf2)}
.ed-toolbar .ed-sep{width:1px;height:20px;background:var(--bd2);margin:0 3px;flex:none}
.ed-toolbar .btn.on,.ed-toolbar .btn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.ch-list-scroll{max-height:300px;overflow-y:auto}
.list-item.ch.active{background:var(--acc-soft);border-radius:var(--r6)}
.list-item.q.clickable{cursor:pointer;border-radius:var(--r6);padding-left:8px;padding-right:8px}
.list-item.q.clickable:hover{background:var(--surf2)}
#editor.inp{min-height:380px;max-height:68vh;overflow-y:auto;padding:20px 24px;height:auto;line-height:1.85;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;font-size:17.5px;color:var(--txt);background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r8);overflow-wrap:break-word}
#editor.inp[hidden]{display:none}
#editor:empty::before{content:attr(data-placeholder);color:var(--dim);pointer-events:none}
#editor>*:first-child,.rtext>*:first-child{margin-top:0}
#editor p,#editor div:not(.chat-container):not(.msg),.rtext p{margin:0 0 1.05em}
#editor p:empty,.rtext p:empty{margin:0}
#editor p:last-child,#editor div:last-child,.rtext p:last-child{margin-bottom:0}
#editor h1,#editor h2,.rtext h1,.rtext h2{font-family:var(--head);font-size:22px;font-weight:700;margin:1.5em 0 .55em;line-height:1.3}
#editor h3,.rtext h3{font-family:var(--head);font-size:18.5px;font-weight:700;margin:1.3em 0 .45em;line-height:1.35}
#editor h4,.rtext h4{font-family:var(--head);font-size:16.5px;font-weight:700;margin:1.15em 0 .4em;line-height:1.35}
#editor blockquote{margin:1.25em 0;padding:6px 16px;border-left:3px solid var(--acc);color:var(--mut);background:var(--surf2);font-style:italic;border-radius:0 var(--r6) var(--r6) 0}
#editor hr,.rtext hr{border:0;height:1px;width:min(52%,220px);margin:2.15em auto;background:linear-gradient(90deg,transparent,var(--bd2),transparent)}
#editor ul,#editor ol,.rtext ul,.rtext ol{margin:0 0 1em 1.2em;padding-left:.5em}
#editor ul,.rtext ul{list-style:disc}
#editor ol,.rtext ol{list-style:decimal}
#editor li,.rtext li{margin-bottom:.35em}
#editor img,#editor video,.rtext img,.rtext video{max-width:100%;height:auto;border-radius:var(--r8);margin:12px auto;display:block}
#editor figure,.rtext figure{margin:1.3em 0;text-align:center}
#editor figcaption,.rtext figcaption{font-size:13px;color:var(--mut);margin-top:6px}
#editor a,.rtext a{color:var(--acc);text-decoration:underline;text-underline-offset:2px}
#editor u,.rtext u{text-decoration:underline}
#editor s,#editor strike,#editor del,.rtext s,.rtext strike,.rtext del{text-decoration:line-through}
#editor pre,#editor code,.rtext pre,.rtext code{font-family:var(--mono);font-size:.88em;background:var(--surf2);border-radius:var(--r6)}
#editor pre,.rtext pre{padding:12px 14px;overflow-x:auto;margin:1.1em 0;white-space:pre-wrap}
#editor code,.rtext code{padding:1px 5px}
#editor table,.rtext table{width:100%;border-collapse:collapse;margin:1.1em 0;font-size:15px}
#editor th,#editor td,.rtext th,.rtext td{border:1px solid var(--bd2);padding:7px 10px}
#editor .chat-container,.rtext .chat-container{display:flex;flex-direction:column;gap:6px;margin:1.1em 0}
#editor .msg,.rtext .msg{max-width:76%;padding:8px 13px;border-radius:14px;font-family:var(--font);font-size:14.5px;line-height:1.45;border:1px solid var(--bd2);background:var(--surf2);color:var(--txt);margin:0;text-align:left}
#editor .msg.left,.rtext .msg.left{align-self:flex-start;border-bottom-left-radius:4px}
#editor .msg.right,.rtext .msg.right{align-self:flex-end;background:var(--acc-soft);border-color:var(--acc);border-bottom-right-radius:4px}
#editor .msg b,#editor .msg strong,.rtext .msg b,.rtext .msg strong{display:block;font-size:11px;margin-bottom:2px;color:var(--acc)}
.reader-preview{border:1px solid var(--bd2);border-radius:var(--r12);background:var(--bg);overflow:hidden}
.rd-preview-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;border-bottom:1px solid var(--bd);background:var(--surf2);flex-wrap:wrap}
.rd-stage{max-width:768px;margin:0 auto;padding:28px 24px 36px;max-height:70vh;overflow-y:auto}
.rdhead{max-width:720px;margin:0 auto 22px;padding-bottom:18px;border-bottom:1px solid var(--bd)}
.rdhead .rd-crumb{font-size:12px;color:var(--mut);margin-bottom:8px}
.rdhead .rd-title{font-family:var(--head);font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.2;letter-spacing:-.01em;color:var(--txt);margin:0 0 10px}
.rdhead .rd-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.rtext{max-width:720px;margin:0 auto;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;font-size:18px;line-height:1.85;color:var(--txt);overflow-wrap:break-word}
.rtext blockquote{margin:1.4em 0;padding:2px 0 2px 18px;border-left:2px solid var(--acc);color:var(--mut);font-style:italic}
@media(max-width:600px){#editor.inp{padding:16px}.rd-stage{padding:20px 16px 26px}.rtext{font-size:17px}}
.sysrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.sysrow:last-child{border-bottom:0}
.sysrow .dot{width:8px;height:8px;border-radius:99px;flex:none;margin-top:6px;background:var(--ok)}
.sysrow .dot.warn{background:var(--warn)} .sysrow .dot.bad{background:var(--bad)}
.sysrow b{display:block;font-size:13px;font-weight:600}
.sysrow span{display:block;font-size:12px;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:5px;height:142px;padding-top:10px}
.chart .bar{flex:1 1 0;min-width:6px;min-height:6px;border-radius:var(--r6) var(--r6) 0 0;background:var(--surf3)}
.chart .bar.last{background:var(--acc)}
.chart-labels{display:flex;justify-content:space-between;margin-top:8px;font:500 10px/1 var(--mono);color:var(--dim)}
.barline{display:grid;grid-template-columns:minmax(0,1fr) 56px 44px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.barline:last-child{border-bottom:0}
.barline .track{height:6px;border-radius:99px;background:var(--surf3);overflow:hidden}
.barline .track i{display:block;height:100%;background:var(--acc);border-radius:99px}
.barline .v{text-align:right;font:600 11px/1 var(--mono);color:var(--mut)}

/* Bảng */
.table-wrap{overflow:auto;max-height:540px;border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);min-width:0}
table{width:100%;min-width:820px;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;z-index:3;padding:11px 14px;background:var(--surf2);border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--bd);vertical-align:middle;color:var(--txt)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surf2)}
td .sub{display:block;font-size:11.5px;color:var(--dim)}
td .strong{font-weight:600}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.cover{width:42px;height:58px;flex:none;border:1px solid var(--bd2);border-radius:var(--r6);display:grid;place-items:center;text-align:center;padding:4px;color:var(--txt);font:600 11px/1.2 var(--head);overflow:hidden}
.cover.lg{width:76px;height:104px;font-size:14px}
.cover.sq{width:72px;height:72px}
/* Vòng 15 · TRANG "Chuyển thể Series": overlay toàn màn hình, không thêm tab
   vào NAV (vẫn 13 tab / 5 nhóm). Dùng đúng token :root, không màu literal. */
.series-page-open{overflow:hidden}
.series-page{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;font-family:var(--font)}
.series-page-hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--bd2);background:var(--surf)}
.series-page-hd h2{margin:0;font:600 22px/1.2 var(--head);color:var(--txt)}
.series-page-hd .sub{color:var(--dim);font-size:12px;margin-top:4px}
.series-page-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--bd2);background:var(--surf2)}
.series-page-tools .search{flex:1 1 260px;max-width:420px}
.series-page-body{flex:1 1 auto;overflow:auto;padding:20px 24px}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.series-card{border:1px solid var(--bd2);border-radius:var(--r8);background:var(--surf);padding:12px;display:flex;gap:12px;align-items:flex-start}
.series-card .cover{flex:none}
.series-card .meta{min-width:0;flex:1}
.series-card .meta b{display:block;font:600 13px/1.35 var(--head);color:var(--txt);overflow:hidden;text-overflow:ellipsis}
.series-card .meta .mono{color:var(--dim);font-size:10px;word-break:break-all;margin-top:4px}
.series-card .meta .chk{margin-top:8px;min-height:30px;font-size:12px}
.series-page-ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--bd2);background:var(--surf)}
@media(max-width:640px){.series-page-hd,.series-page-tools,.series-page-body,.series-page-ft{padding-left:14px;padding-right:14px}.series-grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}}

/* ============================================================================
   VÒNG 17 · TRANG CHỦ: hai cột (sửa ↔ xem trước), thanh tóm tắt dính, chip thứ.
   Toàn bộ màu lấy từ token :root ở trên — không có mã màu literal.
   ========================================================================== */
.hp-wrap{display:grid;gap:var(--s2);min-width:0}
.hp-sum{position:sticky;top:calc(var(--top) + 4px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf);box-shadow:0 2px 0 var(--bg)}
.hp-sum-txt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.hp-sum-txt>.lb{flex:none}
.hp-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hp-pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border:1px solid var(--bd);
  border-radius:99px;background:var(--surf2);color:var(--mut);font:500 11px/1 var(--mono);white-space:nowrap}
.hp-pill b{color:var(--txt);font-weight:600}
.hp-dirty{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--acc);
  border-radius:99px;background:var(--acc-soft);color:var(--acc);font:600 11px/1 var(--mono);white-space:nowrap}
.hp-dirty .ic{width:13px;height:13px}
.hp-dirty::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--acc);flex:none}

.hp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:var(--s2);align-items:start;min-width:0}
.hp-main{display:grid;gap:var(--s2);min-width:0}
.hp-block>.card-hd h3{display:flex;align-items:center;gap:8px}
.hp-block>.card-hd h3 .ic{width:17px;height:17px;color:var(--dim)}
.hp-block>.card-hd .right b{color:var(--txt);font-weight:600}
.hp-hint{margin:0 0 12px;font-size:12.5px;line-height:1.55;color:var(--dim);max-width:78ch}
.hp-hint-tight{margin:10px 0 0}

/* ---- danh sách slide ---- */
.hp-list{display:grid;gap:8px}
.hp-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;min-width:0;
  padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf2)}
.hp-row:hover{border-color:var(--bd2)}
.hp-row-n{font:600 12px/1 var(--mono);color:var(--dim);min-width:18px;text-align:right}
.hp-row-bd{min-width:0;display:grid;gap:5px}
.hp-row-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.hp-row-t>b{font:600 13.5px/1.3 var(--head);color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hp-row-m{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-row-in{height:32px;font-size:12.5px;background:var(--surf)}
.hp-row-f{display:flex;align-items:center;gap:8px;min-width:0}
.hp-row-lb{flex:none;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.hp-row-f .hp-row-in{flex:1 1 auto;min-width:0}
.hp-row-act{display:flex;align-items:center;gap:4px;flex:none}
.hp-row-act .btn.icon{width:32px;min-height:32px}
.hp-row-act .btn.icon .ic{width:15px;height:15px}

/* ---- ô thêm bộ (tìm + chọn + nút) ---- */
.hp-add{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.hp-add-end{border-top:1px solid var(--bd)}
.hp-add .search{flex:1 1 200px;max-width:none}
.hp-add-sel{flex:1 1 240px;min-width:0}
.hp-add>.btn{flex:none}

/* ---- trạng rỗng gọn (không chiếm 260px như .state) ---- */
.hp-empty{display:flex;align-items:flex-start;gap:12px;padding:16px;border:1px dashed var(--bd2);border-radius:var(--r8);background:var(--surf2)}
.hp-empty>.ic{width:20px;height:20px;color:var(--dim);flex:none;margin-top:2px}
.hp-empty b{display:block;font-size:13px;color:var(--txt)}
.hp-empty p{margin:3px 0 0;font-size:12px;line-height:1.5;color:var(--mut)}

/* ---- Series: lưới 2 cột, có bìa thật ---- */
.hp-series{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hp-series-row{min-height:0;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--r6);background:var(--surf2);
  align-items:center;gap:9px;font-size:12.5px;color:var(--txt);min-width:0}
.hp-series-row:hover{border-color:var(--bd2)}
.hp-series-row>.ic,.hp-series-cv{flex:none}
.hp-series-cv{width:28px;height:38px;font-size:8px;border-radius:4px}
.hp-series-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- lịch: thẻ riêng + chip thứ ---- */
.hp-sched{padding:12px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf2);display:grid;gap:10px}
.hp-sched .inp{height:32px}
.hp-sched+.hp-sched{margin-top:8px}
.hp-sched-top{display:flex;align-items:center;gap:10px;min-width:0}
.hp-sched-sel{flex:1 1 auto;min-width:0}
.hp-sched-note{height:32px;font-size:12.5px;background:var(--surf)}
.hp-warn{display:flex;align-items:center;gap:6px;margin:0;font-size:11.5px;color:var(--warn)}
.hp-warn-block{align-items:flex-start;margin:0 0 10px;padding:9px 11px;border:1px solid var(--warn);border-radius:var(--r6);background:var(--warn-bg);line-height:1.45}
.hp-warn .ic{width:14px;height:14px;flex:none}
.hp-days{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hp-days-lb{flex:none;margin-right:3px;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.hp-day{height:30px;min-width:40px;padding:0 10px;border:1px solid var(--bd2);border-radius:99px;background:var(--surf);
  color:var(--mut);font:600 11.5px/1 var(--mono);transition:background-color .12s ease}
.hp-day:hover{background:var(--surf3);color:var(--txt)}
.hp-day.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
/* Vòng 19 · đăng nhiều bộ trong một ngày: chip thứ mang số bộ đang ra ngày đó,
   bảng đếm theo ngày ở đầu card. Số >1 phải NỔI LÊN vì đó là ca cần để ý. */
.hp-day{position:relative;display:inline-flex;align-items:center;gap:5px}
.hp-day-n{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 4px;
  border-radius:99px;background:var(--surf3);color:var(--mut);font:700 9.5px/1 var(--mono)}
.hp-day.on .hp-day-n{background:color-mix(in srgb,var(--ink) 22%,transparent);color:var(--ink)}
.hp-day[data-track]>span:not(.hp-day-n){white-space:nowrap}
.hp-dayboard{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.hp-dcount{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--bd);
  border-radius:99px;background:var(--surf);font:600 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--dim)}
.hp-dcount b{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.hp-dcount.none{opacity:.6}
.hp-dcount.multi{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.hp-dcount.multi b{color:var(--warn)}
.hp-share{margin:8px 0 0;font-size:11.5px;line-height:1.5;color:var(--warn);display:flex;gap:6px;align-items:flex-start}

/* ---- thông báo ---- */
.hp-form{display:grid;gap:12px;margin-top:6px;max-width:560px}
.hp-ann-pv{padding:8px 11px;border:1px solid var(--bd);border-radius:var(--r6);background:var(--surf2);font-size:12px}
.hp-ann-on{display:flex;align-items:center;gap:7px;color:var(--ok)}
.hp-ann-off{display:flex;align-items:center;gap:7px;color:var(--dim)}
.hp-ann-warn{display:flex;align-items:flex-start;gap:7px;color:var(--warn);line-height:1.45}
/* Biểu đồ xu hướng tab Thống kê: cột cao theo tỉ lệ, không canvas. */
.hp-trend{display:flex;align-items:flex-end;gap:4px;height:80px}
.hp-trend-b{flex:1 1 0;min-width:4px;border-radius:3px 3px 0 0;background:var(--acc-soft);border:1px solid var(--acc);border-bottom:0}
.hp-trend-b:hover{background:var(--acc);}
.hp-trend-x{display:flex;justify-content:space-between;margin-top:6px;font:500 10px/1 var(--mono);color:var(--dim)}
.hp-ann-pv .ic{width:14px;height:14px;flex:none}

/* ---- cột xem trước ---- */
.hp-side{display:grid;gap:10px;min-width:0;position:sticky;top:calc(var(--top) + 64px);max-height:calc(100vh - var(--top) - 76px)}
.hp-pv-card .card-hd{padding:10px 12px}
.hp-pv-card .card-hd h3{font-size:14px}
.hp-seg{display:inline-flex;gap:2px;margin-left:auto;padding:2px;border:1px solid var(--bd);border-radius:var(--r8);background:var(--surf2)}
.hp-seg .btn.icon{width:30px;min-height:30px;border:0;background:transparent;color:var(--mut)}
.hp-seg .btn.icon.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.hp-pv-bd{padding:0}
.hp-pv{background:var(--bg2);border-radius:0 0 var(--r12) var(--r12);overflow:hidden;transition:max-width .15s ease}
/* Cột xem trước dính theo cuộn: chỉ dính khi thẻ cao hơn màn hình. Bản real
   thêm [data-own-scroll] (admin-real.js đo chiều cao) — không đoán bằng CSS. */
.hp-pv-card{display:flex;flex-direction:column;min-width:0}
.hp-pv-card[data-own-scroll] .hp-pv-scroll{max-height:52vh}
.hp-pv.mob{max-width:300px;margin:0 auto}
.hp-pv-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--bd);background:var(--surf2)}
.hp-pv-url{font:500 10px/1 var(--mono);color:var(--dim);padding:3px 8px;border:1px solid var(--bd);border-radius:99px;background:var(--bg2)}
.hp-pv-dot{width:8px;height:8px;border-radius:99px;border:1px solid var(--acc);margin-left:auto}
.hp-pv-scroll{display:grid;gap:14px;padding:12px;max-height:min(62vh,560px);overflow:auto;scrollbar-width:thin}
.hp-pv-ann{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r6);
  background:var(--surf2);color:var(--mut);font-size:11.5px;line-height:1.4}
.hp-pv-ann .ic{width:13px;height:13px;color:var(--acc);flex:none}
.hp-pv-hero{display:flex;gap:11px;min-width:0}
.hp-pv-big{flex:none;width:84px;height:116px;border-radius:var(--r8)}
img.hp-pv-big,img.hp-pv-thumb,img.hp-pv-mini,img.hp-series-cv{object-fit:cover;display:block;padding:0;border:1px solid var(--bd2)}
.hp-pv-herot{min-width:0;display:grid;gap:4px;align-content:start}
.hp-pv-k{font:600 9.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.hp-pv-herot b{font:600 15px/1.25 var(--head);color:var(--txt)}
.hp-pv-a{font-size:10.5px;color:var(--dim)}
.hp-pv-s{font-size:10.5px;line-height:1.45;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp-pv-fan{display:flex;gap:6px;padding-top:2px}
.hp-pv-fan-i{opacity:.55}
.hp-pv-fan-i.on{opacity:1}
.hp-pv-thumb{width:34px;height:46px;font-size:7px;border-radius:4px}
.hp-pv-mini{width:26px;height:36px;font-size:6px;border-radius:4px}
.hp-pv-sec{display:grid;gap:7px}
.hp-pv-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:600 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hp-pv-n{font:500 9.5px/1.3 var(--mono);letter-spacing:0;text-transform:none;color:var(--dim);opacity:.85}
.hp-pv-rail{display:flex;align-items:center;gap:8px;min-width:0}
.hp-pv-railt{min-width:0;display:grid;gap:1px}
.hp-pv-railt b{font-size:11px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-pv-railt i{font-style:normal;font-size:9.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-pv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hp-pv-cell{display:grid;gap:3px;min-width:0}
.hp-pv-cell b{font-size:9.5px;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp-pv-day{flex:none;min-width:26px;font:600 10px/1 var(--mono);color:var(--acc);text-align:center;padding:4px 0;border:1px solid var(--bd2);border-radius:var(--r6)}
.hp-pv-none{font-size:10.5px;color:var(--dim)}
.hp-pv-empty{padding:14px;border:1px dashed var(--bd2);border-radius:var(--r8);font-size:11px;color:var(--dim);text-align:center}
.hp-pv-note{margin:0;line-height:1.5}

@media (max-width:1240px){
  .hp-cols{grid-template-columns:minmax(0,1fr)}
  .hp-side{position:static;grid-row:1}
  .hp-pv-scroll{max-height:none}
}
@media (max-width:640px){
  .hp-row-lb,.hp-days-lb{display:none}
  .hp-series{grid-template-columns:minmax(0,1fr)}
  .hp-row{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
  .hp-row-n{display:none}
  .hp-row-act{grid-column:1 / -1;justify-content:flex-end}
  .hp-sum{position:static}
  .hp-sum>.btn{flex:1 1 auto}
  .hp-pv-hero{flex-wrap:wrap}
}
.cv-1{background:var(--cover-1)} .cv-2{background:var(--cover-2)} .cv-3{background:var(--cover-3)}
.cv-4{background:var(--cover-4)} .cv-5{background:var(--cover-5)} .cv-6{background:var(--cover-6)}
.cv-miss{background:var(--neutral-bg);color:var(--dim);border-style:dashed;font-family:var(--mono);font-size:9px}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border:1px solid var(--acc);border-radius:var(--r8);background:var(--acc-soft);color:var(--txt)}
.bulkbar .n{font:700 12px/1 var(--mono);color:var(--acc)}
.bulkbar .sel{min-width:170px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{flex:1 1 220px;max-width:340px}
.toolbar .sel{flex:0 1 180px}
.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.pager .pg{margin-left:auto}

/* Trạng thái rỗng / tải / lỗi */
.state{min-height:260px;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;padding:var(--s4);border:1px dashed var(--bd2);border-radius:var(--r12);background:var(--surf)}
.state .ic{width:32px;height:32px;color:var(--dim)}
.state.bad .ic{color:var(--bad)}
.state h3{font-size:19px}
.state p{color:var(--mut);font-size:13px;max-width:52ch}
.sk{background:var(--surf2);border-radius:var(--r6);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
.sk-line{height:12px;margin-bottom:10px}
.sk-card{border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);padding:18px}
.sk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.sk-block{height:104px}
.state-note{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--r6);background:var(--surf2);font:500 11px/1.5 var(--mono);color:var(--dim)}

/* Modal / toast / command palette */
.modal-scrim{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.modal{width:min(520px,100%);max-height:min(88vh,780px);overflow:auto;border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf)}
.modal.wide{width:min(900px,100%)}
.modal-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.modal-hd h3{font-size:19px;flex:1 1 auto}
.modal-bd{padding:20px;display:grid;gap:14px}
.modal-ft{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bd);flex-wrap:wrap}
.modal .warnbox{display:flex;gap:10px;padding:12px;border:1px solid var(--bad);border-radius:var(--r8);background:var(--bad-bg);font-size:12.5px;color:var(--txt)}
.modal .warnbox .ic{width:18px;height:18px;color:var(--bad);flex:none}
.confirm-phrase{font:700 12px/1.5 var(--mono);color:var(--bad);background:var(--surf2);padding:6px 9px;border-radius:var(--r6);display:inline-block;word-break:break-all}
#toasts{position:fixed;left:16px;bottom:16px;z-index:140;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1px solid var(--bd2);border-left:3px solid var(--ok);border-radius:var(--r8);background:var(--surf2);color:var(--txt);font-size:12.5px;line-height:1.5}
.toast .ic{width:17px;height:17px;color:var(--ok);flex:none}
.toast.t-bad{border-left-color:var(--bad)} .toast.t-bad .ic{color:var(--bad)}
.toast.t-warn{border-left-color:var(--warn)} .toast.t-warn .ic{color:var(--warn)}
.toast.t-info{border-left-color:var(--info)} .toast.t-info .ic{color:var(--info)}
.palette{position:fixed;inset:0;z-index:120;display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px;background:var(--scrim)}
.palette-box{width:min(560px,100%);border:1px solid var(--bd2);border-radius:var(--r12);background:var(--surf);overflow:hidden}
.palette-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.palette-top .ic{width:18px;height:18px;color:var(--dim)}
.palette-top input{flex:1 1 auto;border:0;background:transparent;outline:none;font-size:14px}
.palette-list{max-height:320px;overflow:auto;padding:6px}
.palette-list button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:8px 10px;border-radius:var(--r6);text-align:left;font-size:13px}
.palette-list button:hover,.palette-list button.cur{background:var(--surf2)}
.palette-list .k{margin-left:auto;font:600 10px/1 var(--mono);color:var(--dim)}
.palette-ft{padding:8px 14px;border-top:1px solid var(--bd);font:500 10.5px/1.4 var(--mono);color:var(--dim)}

/* Thư viện component */
.spec{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spec .sep{width:100%;height:1px;background:var(--bd)}

/* Tài liệu bàn giao trong modal */
.docs h4{font-size:15px;margin:18px 0 8px}
.docs h4:first-child{margin-top:0}
.docs p,.docs li{font-size:12.5px;color:var(--mut);line-height:1.65}
.docs ul{list-style:disc;padding-left:18px;display:grid;gap:4px}
.docs table{width:100%;min-width:0;font-size:11.5px;margin:8px 0}
.docs th,.docs td{padding:7px 9px;border:1px solid var(--bd);text-align:left;vertical-align:top}
.docs th{color:var(--txt);font:600 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;background:var(--surf2)}
.docs td{color:var(--mut)}
.docs .token{font:600 11px/1.5 var(--mono);color:var(--txt)}
.docs .swatch{display:inline-block;width:12px;height:12px;border:1px solid var(--bd2);border-radius:3px;margin-right:6px;vertical-align:-2px}

/* Đăng nhập / nối Worker */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.gate-brand{display:flex;flex-direction:column;gap:var(--s4);padding:48px;background:var(--bg2);border-right:1px solid var(--bd)}
.gate-brand .logo{font:600 26px/1 var(--head)}
.gate-brand .logo .dot{display:inline-block;width:10px;height:10px;border:1px solid var(--acc);border-radius:99px;margin-right:10px}
.gate-brand h1{font-size:36px;max-width:12ch}
.gate-brand p{color:var(--mut);max-width:44ch;font-size:14px}
.gate-features{display:grid;gap:12px}
.gate-features li{display:grid;gap:3px;padding-left:14px;border-left:2px solid var(--bd2)}
.gate-features b{font-size:13px} .gate-features span{font-size:12px;color:var(--mut)}
.gate-panel{display:grid;place-items:center;padding:48px 24px;min-width:0}
.gate-card{width:min(430px,100%);border:1px solid var(--bd);border-radius:var(--r12);background:var(--surf);padding:28px;display:grid;gap:16px}
.gate-card h2{font-size:24px}
.gate-card .sep{display:flex;align-items:center;gap:10px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.gate-card .sep::before,.gate-card .sep::after{content:"";flex:1 1 auto;height:1px;background:var(--bd)}
.gate-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gate-foot{font:500 10.5px/1.6 var(--mono);color:var(--dim);border-top:1px solid var(--bd);padding-top:12px}

/* ---------- Responsive: drawer 360px, không tràn ngang ---------- */
@media (max-width:1100px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric:nth-child(3){border-right:0}
  .metric:nth-child(-n+3){border-bottom:1px solid var(--bd)}
  .view{padding:var(--s3) var(--s2) 120px}
  .topbar{padding:0 var(--s2)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .frame{grid-column:1}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(360px,100vw);transform:translateX(-101%);transition:transform .2s ease;z-index:46}
  .app.drawer .sidebar{transform:none}
  .app.drawer .scrim{display:block}
  .scrim{display:none}
  .burger{display:inline-flex}
  .app.collapsed{--side:76px}
  .app.collapsed .brand{justify-content:flex-start;padding:0 14px}
  .app.collapsed .brand .logo{font-size:18px}
  .app.collapsed .brand .dot{display:block}
  .app.collapsed .brand .collapse-btn{margin-left:auto}
  .app.collapsed .brand .tx,.app.collapsed .brand .logo,.app.collapsed .brand .logo i,.app.collapsed .nav-group>.lb,.app.collapsed .nav-item>.tx,.app.collapsed .nav-item>.ct,.app.collapsed .side-foot{display:initial}
  .app.collapsed .side-scroll{padding:14px 10px 18px;scrollbar-width:thin}
  .app.collapsed .nav-item{justify-content:flex-start;padding:0 10px;min-height:38px}
  .app.collapsed .nav-group+.nav-group{margin-top:18px;padding-top:0;border-top:0}
  .app.collapsed .side-foot{display:grid}
  .topbar{flex-wrap:wrap;row-gap:8px;padding:8px var(--s2);min-height:0}
  .topbar .search{order:5;flex:1 1 100%;max-width:none}
  .tools{margin-left:auto}
  .tools .lbl{display:none}
  .gate{grid-template-columns:minmax(0,1fr)}
  .gate-brand{display:none}
}
/* Thu gọn / drawer trên màn nhỏ */
body.force-drawer .sidebar{position:fixed;inset:0 auto 0 0;width:360px;max-width:100vw;transform:none;z-index:47;display:flex}
body.force-drawer .scrim{display:block;z-index:46}
body.force-drawer .app.collapsed .brand{justify-content:flex-start;padding:0 14px}
body.force-drawer .app.collapsed .brand .logo{font-size:18px}
body.force-drawer .app.collapsed .brand .dot{display:block}
body.force-drawer .app.collapsed .brand .collapse-btn{margin-left:auto}
body.force-drawer .app.collapsed .brand .tx,body.force-drawer .app.collapsed .brand .logo,body.force-drawer .app.collapsed .brand .logo i,body.force-drawer .app.collapsed .nav-group>.lb,body.force-drawer .app.collapsed .nav-item>.tx,body.force-drawer .app.collapsed .nav-item>.ct,body.force-drawer .app.collapsed .side-foot{display:initial}
body.force-drawer .app.collapsed .side-scroll{padding:14px 10px 18px;scrollbar-width:thin}
body.force-drawer .app.collapsed .nav-item{justify-content:flex-start;padding:0 10px;min-height:38px}
body.force-drawer .app.collapsed .nav-group+.nav-group{margin-top:18px;padding-top:0;border-top:0}
body.force-drawer .app.collapsed .side-foot{display:grid}
@media (max-width:600px){
  :root{--h:44px;--h-lg:44px;--top:56px}
  .btn{min-height:44px;padding:0 14px} .btn.sm{min-height:44px}
  .btn.icon{width:44px}
  .inp,select.inp{height:44px} .tool,.tool.icon{height:44px;width:44px}
  .tool:not(.icon){width:auto;padding:0 10px}
  .tab,.pg button{min-height:44px;height:44px}
  .chip{height:30px}
  .nav-item{min-height:44px}
  .view{padding:var(--s2) 14px 120px}
  .pagehead{gap:12px;margin-bottom:18px}
  .pagehead h2{font-size:24px}
  .pagehead .actions{width:100%;margin-left:0;justify-content:flex-start}
  .pagehead .actions .btn{flex:1 1 auto}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{padding:12px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd)}
  .metric:nth-child(2n){border-right:0}

function toast(msg,tone){
  var box=document.createElement('div');
  box.className='toast '+(tone?'t-'+tone:'');
  box.innerHTML=icon(tone==='bad'?'alert':tone==='warn'?'alert':tone==='info'?'info':'check')+'<span>'+esc(msg)+'</span>';
  var host=document.getElementById('toasts');
  host.appendChild(box);
  while(host.children.length>3)host.removeChild(host.firstElementChild);
  setTimeout(function(){box.remove();},4200);
}

function download(name,text,type){
  var blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  var a=document.createElement('a'),url=URL.createObjectURL(blob);
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function pagination(total,page,pages,act,per){
  per=Math.max(1,Number(per)||Math.ceil(total/Math.max(1,pages)));
  var from=total?((page-1)*per+1):0, to=Math.min(total,page*per);
  var h='<div class="pager"><span>'+(total?('mục '+from+'–'+to+' / '+total):'0 mục')+'</span><div class="pg">';
  h+='<button data-act="'+act+'" data-page="'+(page-1)+'"'+(page<=1?' disabled':'')+' aria-label="Trang trước">'+icon('left','s')+'</button>';
  for(var i=1;i<=pages;i++) h+='<button data-act="'+act+'" data-page="'+i+'" class="'+(i===page?'on':'')+'"'+(i===page?' aria-current="page"':'')+'>'+i+'</button>';
  h+='<button data-act="'+act+'" data-page="'+(page+1)+'"'+(page>=pages?' disabled':'')+' aria-label="Trang sau">'+icon('right','s')+'</button>';
  return h+'</div></div>';
}

function searchData(q){
  var out=[];

  state.books.forEach(function(b){if(!q||[b.t,b.a,b.id,b.c].some(function(x){return String(x||'').toLowerCase().indexOf(q.toLowerCase())>=0;}))out.push({type:'Bộ',label:b.t,id:b.id,sub:b.a});});

}

/* ---------- 2 · Thư viện ---------- */
function filteredBooks(){
  var q=state.lib.q.trim().toLowerCase(),st=state.lib.status;
  var arr=state.books.filter(function(b){
    var okq=!q||(b.t+' '+b.a+' '+b.c+' '+slugOf(b)).toLowerCase().indexOf(q)>=0;
    var oks=st==='all'||st==='18+'&&b.adult||st==='locked'&&b.lock||b.st===st;
    if(state.lib.pub&&b.pub!==state.lib.pub)return false;
    if(state.lib.vis&&(b.vis||'public')!==state.lib.vis)return false;
    if(state.lib.lock==='1'&&!b.lock)return false;
    if(state.lib.lock==='0'&&b.lock)return false;
    if(state.lib.adult==='1'&&!b.adult)return false;
    if(state.lib.adult==='0'&&b.adult)return false;
    return okq&&oks;
  });
  if(state.lib.sort==='az') arr.sort(function(a,b){return a.t.localeCompare(b.t,'vi');});
  else if(state.lib.sort==='ch-desc') arr.sort(function(a,b){return b.ch-a.ch;});
  else if(state.lib.sort==='ch-asc') arr.sort(function(a,b){return a.ch-b.ch;});
  else arr.sort(function(a,b){return state.books.indexOf(a)-state.books.indexOf(b);});
  return arr;
}

/* Chặn HTML độc hại trước khi đưa nội dung chương vào innerHTML (kể cả
   nội dung dán vào contenteditable). render() vẫn
   dựng lại editorSeed, nên lọc 2 lớp: regex chặn handler/script TRƯỚC khi
   parse, rồi DOM bỏ thẻ không cho phép và URL javascript:/data:/blob:. */
function sanitizeEditorHtml(input){return window.__CZ_SANITIZE__?window.__CZ_SANITIZE__(input):String(input==null?'':input).replace(/<(?:script|iframe|object|embed|style|svg|math|template|form)[\s\S]*?>/gi,'');}
function editorHtml(){return sanitizeEditorHtml(state.editorSeed);}
function sanitizeEditorDom(){
  var el=document.getElementById('editor');
  if(!el)return state.editorSeed;
  var clean=sanitizeEditorHtml(el.innerHTML);
  if(clean!==el.innerHTML)el.innerHTML=clean;
  state.editorSeed=clean;
  return clean;
}
function plainText(html){var d=document.createElement('div');d.innerHTML=sanitizeEditorHtml(html);return d.textContent||'';}

     báo lỗi, và nội dung dài bị cắt mất. Nay: ô lọc theo bộ (chỉ bộ có báo
     lỗi), nút mở bộ, nội dung hiện đủ và có nút “Sửa bộ” trên từng dòng. */
  var pending=state.reports.filter(function(r){return !r.done;}).length;
  var tabs=[['all','Tất cả · '+state.reports.length],['open','Chưa xử lý · '+pending],['done','Đã xử lý']];
  var arr=state.reports.filter(function(r){
    if(state.reportTab==='open'&&r.done)return false;
    if(state.reportTab==='done'&&!r.done)return false;
    if(state.repBook&&r.b!==state.repBook)return false;

  var bookNames=[];state.reports.forEach(function(r){if(r.b&&bookNames.indexOf(r.b)<0)bookNames.push(r.b);});

      bookNames.sort(function(a,b){return String(a).localeCompare(String(b),'vi');}).map(function(t){
        return '<option value="'+esc(t)+'"'+(state.repBook===t?' selected':'')+'>'+esc(t)+' · '+state.reports.filter(function(r){return r.b===t;}).length+'</option>';
      }).join('')+'</select></span>'+
      (state.repBook?'<button class="btn sm" data-act="clear-rep-book">Bỏ lọc</button>':'')+'</div>';
  return '<div class="card"><div class="card-hd"><div class="tabs">'+tabs.map(function(t){
    return '<button class="tab'+(state.reportTab===t[0]?' on':'')+'" data-act="report-tab" data-tab="'+t[0]+'">'+esc(t[1])+'</button>';
  }).join('')+'</div><span class="right">DỮ LIỆU THẬT</span></div>'+
    '<div class="card-bd">'+bar+
    '<div class="tight" style="padding:0">'+
    (arr.length?arr.map(function(r){
      return '<div class="list-item rep"><div class="t"><b>'+esc(r.b)+' · '+esc(r.ch)+'</b>'+
        '<span class="rep-txt">'+esc(r.txt)+'</span>'+

/* ---------- 8 · Phiếu bầu ---------- */
function votesHTML(){
  /* Vòng 18d — bảng này phải TỰ NÓI nó đang thao tác trên bộ nào. Ba lỗi cũ:
       · “Reset phiếu bộ này” / “Gỡ phiếu đã chọn” lấy bộ đang chọn ở tab SỬA
         BỘ ⇒ reset/gỡ phiếu của sai bộ (selectedBook rỗng = reset MỌI BỘ);
       · dòng phiếu không cho biết phiếu của chương nào;
       · số phiếu đang chọn hiện ở góc card nhưng không có nút thao tác nào gắn
         với vùng chọn.
     Nay có ô chọn BỘ (mặc định bộ của dòng đầu), chip cho biết đang thao tác
     trên bộ nào, và cột “Phạm vi” (Cả bộ / Chương n). */
  var all=state.votes||[];
  var bookOf=function(v){return (v&&(v.s||v.slug))||'';};
  var names=[];
  all.forEach(function(v){var sl=bookOf(v);if(sl&&names.indexOf(sl)<0)names.push(sl);});
  if(state.voteBook&&names.indexOf(state.voteBook)<0)names.push(state.voteBook);
  var cur=state.voteBook||names[0]||'';
  var list=cur?all.filter(function(v){return bookOf(v)===cur;}):all;
  var per=6,pages=Math.max(1,Math.ceil(list.length/per)),page=Math.min(state.votePage||1,pages);
  state.votePage=page;
  var rows=list.slice((page-1)*per,page*per);
  var bookName=function(sl){var b=state.books.filter(function(x){return x.id===sl;})[0];return b?b.t:sl;};
  var tiles=[
    ['Phiếu đang hiện',all.length],
    ['Bộ có phiếu',names.length],
    ['Chương có phiếu',(function(){var n=0;all.forEach(function(v){if(Number(v.ch)>0)n++;});return n;})()],
    ['Phiếu cả bộ',(function(){var n=0;all.forEach(function(v){if(!(Number(v.ch)>0))n++;});return n;})()]
  ];
  var kpis='<div class="grid3 mb">'+tiles.map(function(x){return '<div class="card"><div class="card-bd"><div class="num" style="font-size:28px">'+x[1]+'</div><span class="lb">'+esc(x[0])+'</span></div></div>';}).join('')+'</div>';
  if(!all.length)return kpis+'<div class="state">'+icon('inbox')+'<h3>Chưa có phiếu bầu</h3><p>Chưa có phiếu nào trong KV. Bấm Đọc lại để nạp dữ liệu mới nhất.</p><button class="btn sm" data-act="vote-reload">Đọc lại KV</button></div>';
  var bookSel='<div class="row wrap mb" style="gap:8px"><span class="sel" style="flex:1 1 240px"><select class="inp" data-role="vote-book" aria-label="Chọn bộ để thao tác phiếu">'+
    names.map(function(sl){return '<option value="'+esc(sl)+'"'+(cur===sl?' selected':'')+'>'+esc(bookName(sl))+' · '+all.filter(function(v){return bookOf(v)===sl;}).length+' phiếu</option>';}).join('')+
    '</select></span>'+
    '<span class="tag" title="Mọi nút bên dưới chỉ tác động bộ này"><b>Đang thao tác</b> '+esc(bookName(cur))+'</span></div>';
  return kpis+'<div class="card"><div class="card-hd"><h3>Phiếu theo người đọc</h3><span class="right">'+state.voteSel.size+' phiếu được chọn · '+list.length+'/ '+all.length+' phiếu</span></div><div class="card-bd tight">'+
    '<div style="padding:0 16px">'+bookSel+'</div>'+
    (rows.length?'<div class="table-wrap" style="border:0;border-radius:0"><table><thead><tr><th style="width:44px">Chọn</th><th>Khóa người đọc</th><th>Bộ được bầu</th><th>Phạm vi</th><th>Ngày</th></tr></thead><tbody>'+
    rows.map(function(v,i){var gi=(page-1)*per+i;return '<tr><td><label class="chk"><input type="checkbox" data-role="vote-sel" data-idx="'+gi+'"'+(state.voteSel.has(gi)?' checked':'')+' aria-label="Chọn phiếu '+esc(v.k)+'"><span class="box"></span></label></td>'+
      '<td><span class="mono sm">'+esc(v.k)+'</span>'+(v.kind?'<div class="xs dim">'+esc(v.kind)+'</div>':'')+'</td>'+
      '<td>'+esc(v.b)+'</td>'+
      '<td class="sm mut">'+(Number(v.ch)>0?('Chương '+esc(String(v.ch))):'Cả bộ')+'</td>'+
      '<td class="sm mut">'+esc(v.d||'—')+'</td></tr>';}).join('')+
    '</tbody></table></div>':'<div class="state" style="min-height:120px;border:0"><h3>Bộ này không còn phiếu</h3><p>Chọn bộ khác ở ô phía trên.</p></div>')+
    '<div class="row wrap mt" style="gap:8px;padding:0 16px 14px"><button class="btn danger sm" data-act="remove-votes">'+icon('trash','s')+'Gỡ phiếu đã chọn</button><span class="grow"></span>'+
      '<input class="inp sm" style="width:150px;max-width:100%" data-role="reset-ch" placeholder="chương? (trống = cả bộ)" aria-label="Số chương cần reset phiếu">'+
      '<button class="btn danger sm" data-act="reset-votes">Reset phiếu bộ đang chọn</button></div>'+
    '</div></div>'+pagination(list.length,page,pages,'page-votes',6);
}

/* ---------------------------------------------------------------------------
   Vòng 15 · TRANG "CHUYỂN THỂ SERIES"
   Card trên Homepage CMS chỉ hiện TỐI ĐA 12 bộ (đã chọn trước, fills by other
   books). Số lượng ĐƯỢC CHỌN KHÔNG BỊ GIỚI HẠN 12 nữa — mọi thao tác thêm/bớt
   thật sự diễn ra ở trang này, nơi liệt kê TOÀN BỘ registry KV. Overlay nằm
   ngoài #view nên không bị render() ghi đè, không thêm route/tab vào NAV.
   ------------------------------------------------------------------------- */
function syncSeriesCount(){
  var n=String(state.picked.length);
  ['hpPickedCount','seriesPageCount','seriesPageFootCount'].forEach(function(id){
    var e=document.getElementById(id);if(e)e.textContent=n;
  });
}
function seriesPageFilter(q){
  var host=document.getElementById('seriesPage');if(!host)return;
  var kw=String(q||'').toLowerCase().trim(),vis=0;
  host.querySelectorAll('[data-series-item]').forEach(function(el){
    var hit=(!kw||String(el.getAttribute('data-s-text')||'').indexOf(kw)>=0);
    el.style.display=hit?'':'none';if(hit)vis++;
  });
  var t=host.querySelector('[data-series-visible]');if(t)t.textContent=String(vis);
}
function closeSeriesPage(){
  var host=document.getElementById('seriesPage');if(host&&host.remove)host.remove();
  document.body.classList.remove('series-page-open');
  render();
}
function openSeriesPage(){
  var host=document.getElementById('seriesPage');
  if(!host){
    host=document.createElement('div');host.id='seriesPage';host.className='series-page';
    host.setAttribute('role','dialog');host.setAttribute('aria-label','Tất cả bộ Chuyển thể Series');
    document.body.appendChild(host);
    host.addEventListener('click',function(e){
      var el=e.target.closest?e.target.closest('[data-act]'):null;
      if(!el)return;
      var a=el.dataset.act;
      if(a!=='series-close'&&a!=='series-save'&&a!=='series-all'&&a!=='series-none')return;
      e.stopPropagation();
      if(a==='series-close'){closeSeriesPage();return;}
      if(a==='series-save'){
        syncSeriesCount();
        try{saveHomepage();}catch(err){toast('Không lưu được lựa chọn.','bad');}
        closeSeriesPage();return;
      }
      var on=(a==='series-all');
      host.querySelectorAll('[data-role="picked"]').forEach(function(cb){cb.checked=on;});
      state.picked=on?state.books.map(function(b){return b.id;}):[];
      syncSeriesCount();
    });
    host.addEventListener('input',function(e){
      if(e.target&&e.target.dataset&&e.target.dataset.role==='series-q')seriesPageFilter(e.target.value);
    });
    host.addEventListener('keydown',function(e){if(e.key==='Escape')closeSeriesPage();});
  }
  document.body.classList.add('series-page-open');
  var list=state.books.slice().sort(function(a,b){return String(a.t||'').localeCompare(String(b.t||''),'vi');});
  host.innerHTML=
    '<div class="series-page-hd"><button class="btn sm" data-act="series-close">← Quay lại Homepage CMS</button>'+
    '<div><h2>Chuyển thể Series</h2><div class="sub">Toàn bộ bộ trong KV · chọn bao nhiêu cũng được · đang chọn <b id="seriesPageCount">'+state.picked.length+'</b> / '+state.books.length+' bộ</div></div></div>'+
    '<div class="series-page-tools"><span class="search"><input class="inp" data-role="series-q" placeholder="Tìm tên bộ, tác giả, slug…" aria-label="Tìm bộ chuyển thể"></span>'+
    '<button class="btn sm" data-act="series-all">Chọn tất cả</button><button class="btn sm" data-act="series-none">Bỏ chọn tất cả</button>'+
    '<span class="xs dim">Đang hiện <b data-series-visible>'+state.books.length+'</b> / '+state.books.length+' bộ</span></div>'+
    '<div class="series-page-body">'+
    (list.length?'<div class="series-grid">'+list.map(function(b){
      var st=String(b.t+' '+b.a+' '+b.id).toLowerCase();
      return '<div class="series-card" data-series-item data-s-text="'+esc(st)+'">'+cover(b,'lg')+
        '<div class="meta"><b>'+esc(b.t)+'</b><div class="mono">'+esc(b.id)+'</div><div class="xs dim">'+esc(b.a)+'</div>'+
        '<label class="chk"><input type="checkbox" data-role="picked" data-id="'+esc(b.id)+'"'+(state.picked.indexOf(b.id)>=0?' checked':'')+
        ' aria-label="Chọn '+esc(b.t)+'"><span class="box"></span><span>Chuyển thể</span></label></div></div>';
    }).join('')+'</div>':'<div class="state"><h3>Chưa có bộ nào trong KV</h3><p>Nối Worker có dữ liệu để chọn bộ chuyển thể.</p></div>')+
    '</div>'+
    '<div class="series-page-ft"><span class="xs dim">Đã chọn <b id="seriesPageFootCount">'+state.picked.length+'</b> / '+state.books.length+' bộ · card Homepage CMS hiện tối đa 12.</span>'+
    '<span class="grow"></span><button class="btn sm" data-act="series-close">Đóng</button>'+
    '<button class="btn sm pri" data-act="series-save">Lưu lựa chọn lên KV</button></div>';
  var q=host.querySelector('[data-role="series-q"]');if(q&&q.focus)try{q.focus();}catch(e){}
}

function homepageHTML(){

     lần. Thao tác chỉ đổi state (bản cũ ghi KV sau từng cú bấm và bị hydrate

     editorChoice, schedule{items[{days,slug,title,detail}],note},
     settings.announcement. */

  /* ---------- 1 · hero ---------- */

          '<input class="inp hp-row-in" data-role="slide-reason" data-idx="'+i+'" value="'+esc(x.r)+'" placeholder="Lý do chọn slide" aria-label="Lý do chọn slide '+(i+1)+'"></span>'+

  /* ---------- 3 · Lịch ra chương ----------

  var dayCount={};

        '<button class="btn icon ghost sm" type="button" data-act="sched-remove" data-idx="'+i+'" aria-label="Xoá dòng lịch '+(i+1)+'" title="Xoá dòng">'+icon('trash','s')+'</button>'+
      '</div>'+
      (!b&&x.t?'<p class="hp-warn">'+icon('alert','xs')+'Dòng cũ chỉ còn tên “'+esc(x.t)+'” — chọn lại bộ để chắc chắn đúng truyện.</p>':'')+
      '<div class="hp-days" role="group" aria-label="Thứ ra chương của dòng '+(i+1)+'"><span class="hp-days-lb">Ra chương vào</span>'+chips+'</div>'+
      '<input class="inp hp-sched-note" data-role="sched-ch" data-idx="'+i+'" value="'+esc(x.c)+'" placeholder="Ghi chú (tuỳ chọn) — vd: ra chương 19" aria-label="Ghi chú lịch dòng '+(i+1)+'">'+
      (days.length?'':'<p class="hp-warn">'+icon('alert','xs')+'Chưa chọn thứ — bấm ít nhất một chip ở trên.</p>')+
      (shared.length?'<p class="hp-share">'+icon('info','xs')+'Trùng lịch: '+esc(shared.join(', '))+' đã có dòng khác — ngày đó sẽ ra '+shared.map(function(d){return dayCount[d]+' bộ';}).join(', ')+'.</p>':'')+

  /* Bảng đếm theo ngày: nhìn một chỗ là biết ngày nào 2 bộ. */

  var dupB={},dup=[];

    (SC.length?SC.map(rowOf2).join(''):'<div class="hp-empty">'+icon('clock')+'<div><b>Chưa có lịch ra chương</b><p>Trang chủ sẽ ẩn khối này. Thêm dòng để báo lịch cho người đọc.</p></div></div>')+
    '<div class="hp-add hp-add-end"><button class="btn sm" type="button" data-act="sched-add">'+icon('plus','s')+'Thêm dòng lịch</button></div>'+
    '<div class="mt">'+field('Ghi chú lịch','hp-note',state.models['hp-note']||state.hpNote||'',{ph:'Ghi chú lịch'})+'</div>'+
    '</div></section>';

  /* ---------- 4 · thông báo ---------- */
  var announce='<section class="card hp-block"><div class="card-hd"><h3>'+icon('bell','s')+'Thông báo trang chủ</h3>'+

      '<div class="hp-seg" role="group" aria-label="Khung xem trước">'+
        '<button class="btn icon sm'+(state.hpPreview==='mobile'?'':' pri')+'" type="button" data-act="hp-preview" data-v="desktop" aria-pressed="'+(state.hpPreview!=='mobile')+'" title="Khung máy tính" aria-label="Xem trước khung máy tính">'+icon('grid','s')+'</button>'+
        '<button class="btn icon sm'+(state.hpPreview==='mobile'?' pri':'')+'" type="button" data-act="hp-preview" data-v="mobile" aria-pressed="'+(state.hpPreview==='mobile')+'" title="Khung điện thoại" aria-label="Xem trước khung điện thoại">'+icon('chapter','s')+'</button>'+
      '</div></div>'+

  '</aside>';

  return '<div class="hp-wrap">'+sum+
    '<div class="hp-cols"><div class="hp-main">'+slides+picked+sched+announce+'</div>'+side+'</div>'+
  '</div>';
