<style>
/* ============================================================================
   TRANG TÁC GIẢ (r98) — một danh mục có trật tự
   ----------------------------------------------------------------------------
   Bỏ hết thứ gây rối của bản trước: không khối "nổi bật" lệch lưới, không
   quầng hồng, không huy hiệu nhiều màu, không dải chữ cái to như nút bấm.
   Còn lại một cột thông tin thẳng hàng như một danh mục thư viện: bìa nhỏ ·
   tên · số truyện · ngày cập nhật · trạng thái. Chỉ một màu nhấn, chỉ một
   cỡ chữ cho mỗi cấp thông tin, mọi khoảng cách là bội số của 4.

   Chỉ áp cho /tac-gia/; /couple/ giữ danh sách cũ trong cz.css.
   Hợp đồng giữ nguyên: .pacard trong #ppGrid, ?q=, ?s=, ?sort=, ?st=.
   ========================================================================== */
.people{max-width:1060px;margin:0 auto;padding:0 32px 96px}

/* ---- đầu trang ---------------------------------------------------------- */
.ppcrumb{display:flex;align-items:center;gap:8px;margin:28px 0 0;
  font:400 12px/1.4 var(--font);color:var(--dim)}
.ppcrumb a{color:var(--dim)}
.ppcrumb a:hover{color:var(--txt)}
.ppcrumb b{color:var(--mut);font-weight:500}
.ppcrumb i,.ppcrumb span{font-style:normal;opacity:.55}

.pphead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;
  flex-wrap:wrap;margin:14px 0 0;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.pphead h1{margin:0;font-family:var(--font-head);font-weight:600;font-size:clamp(27px,3.4vw,35px);
  line-height:1.04;letter-spacing:-.02em}
.pphead .ppmeta{margin:0 0 4px;font-size:12.5px;line-height:1.5;color:var(--mut);
  font-variant-numeric:tabular-nums}

/* ---- thanh công cụ: 1 ô tìm + 2 ô chọn ---------------------------------- */
.ppbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0}
.ppbar[hidden]{display:none}
.ppsearch{position:relative;display:flex;align-items:center;gap:8px;flex:0 1 264px;min-width:0;
  height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--surf);
  color:var(--dim);transition:border-color .15s var(--ease)}
.ppsearch:focus-within{border-color:var(--bd2)}
.ppsearch svg{width:15px;height:15px;flex:none}
.ppsearch input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--txt);
  font:400 14px/1.4 var(--font)}
.ppsearch input::placeholder{color:var(--dim)}
.ppsearch input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

.ppsel{position:relative;flex:none}
.ppsel select{appearance:none;-webkit-appearance:none;height:40px;padding:0 32px 0 12px;
  border:1px solid var(--bd);border-radius:8px;background:var(--surf);color:var(--txt);
  font:500 13px/1 var(--font);cursor:pointer;transition:border-color .15s var(--ease)}
.ppsel select:hover{border-color:var(--bd2)}
.ppsel select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ppsel svg{position:absolute;right:11px;top:50%;width:12px;height:12px;margin-top:-6px;
  color:var(--dim);pointer-events:none}

.pplink{margin-left:auto;padding:8px 2px;border:0;background:none;color:var(--mut);
  font:500 12.5px/1 var(--font);cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--bd2)}
.pplink:hover{color:var(--txt)}
.pplink[hidden]{display:none}

/* ---- chỉ mục chữ cái: chữ, không phải nút ------------------------------- */
.ppaz{position:sticky;top:0;z-index:30;margin:4px 0 0;padding:2px 0;background:var(--bg);
  border-bottom:1px solid var(--bd)}
.ppaz[hidden]{display:none}
.ppazin{display:flex;overflow-x:auto;scrollbar-width:none}
.ppazin::-webkit-scrollbar{display:none}
.ppazin button{flex:1 1 0;min-width:30px;max-width:38px;height:42px;padding:0;border:0;
  border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--mut);
  font:600 12.5px/1 var(--font);
  transition:color .15s var(--ease),border-color .15s var(--ease)}
.ppazin button:hover{color:var(--txt)}
.ppazin button[aria-current="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.ppazin button.off{color:var(--dim);opacity:.32;pointer-events:none}
.ppazin button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

/* ---- danh mục ---------------------------------------------------------- */
.ppnote{margin:0;padding:10px 8px 0;font-size:12.5px;line-height:1.5;color:var(--mut)}
.ppcol{display:grid;grid-template-columns:36px minmax(0,1fr) 76px 92px 124px;gap:14px;
  align-items:center;padding:14px 8px 9px;border-bottom:1px solid var(--bd);
  font:700 9.5px/1 var(--font);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.ppcol[hidden]{display:none}
.ppcol span:nth-child(3),.ppcol span:nth-child(4){text-align:right}

.ppg{display:flex;align-items:center;gap:12px;padding:24px 8px 10px}
.ppg .l{min-width:14px;font-family:var(--font-head);font-weight:600;font-size:17px;line-height:1}
.ppg .c{font-size:11.5px;line-height:1;color:var(--dim);font-variant-numeric:tabular-nums}
.ppg .r{flex:1;height:1px;background:var(--bd)}

.ppr{display:grid;grid-template-columns:36px minmax(0,1fr) 76px 92px 124px;gap:14px;
  align-items:center;padding:6px 8px;border-bottom:1px solid var(--bd);border-radius:6px;
  color:inherit;text-decoration:none;transition:background-color .14s var(--ease)}
.ppr:hover{background:var(--surf)}
.ppr:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}

/* bìa: 34×49, gáy tối bên trái, mép giấy 2px bên phải — gợi ý "cuốn sách",
   không dựng khối 3D. Ảnh hỏng thì để nền --surf2, không hiện ô đen. */
.ppcv{position:relative;width:36px;height:52px}
.ppcv img{display:block;width:36px;height:52px;object-fit:cover;border-radius:3px;
  background:var(--surf2);box-shadow:0 1px 2px #0000009e,inset 0 0 0 1px #ffffff14}


.ppn{overflow:hidden;font-size:14.5px;font-weight:600;line-height:1.35;letter-spacing:-.005em;
  white-space:nowrap;text-overflow:ellipsis;transition:color .14s var(--ease)}
.ppr:hover .ppn{color:var(--acc)}
.ppsm{display:contents}
.ppc,.ppd{font-size:12px;line-height:1.4;color:var(--mut);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pps{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;
  line-height:1.4;white-space:nowrap;color:var(--mut)}
.pps i{flex:none;width:5px;height:5px;border-radius:50%}
.pps.run i{background:#ddba74}
.pps.soon i{background:#dba5b5}
.pps.done i{background:#8cc7a5}

#ppGrid[data-mode="pp"]{display:block}
#ppGrid[data-mode="one"]{display:grid}

/* ---- rỗng -------------------------------------------------------------- */
.ppempty{padding:64px 8px;text-align:center}
.ppempty b{display:block;margin-bottom:8px;font-family:var(--font-head);font-weight:600;font-size:19px}
.ppempty p{margin:0 0 18px;font-size:13px;line-height:1.6;color:var(--mut)}
.ppempty button{height:40px;padding:0 18px;border:1px solid var(--acc);border-radius:8px;
  background:var(--acc);color:#2a1119;font:600 13px/1 var(--font);cursor:pointer}

/* ---- 640–1023: bớt một cột ngày, giữ nhịp hàng ------------------------- */
@media (max-width:1023px){
  .people{padding:0 24px 84px}
  .ppcol,.ppr{grid-template-columns:36px minmax(0,1fr) 72px 108px}
  .ppcol span:nth-child(4){display:none}
  .ppd{display:none}
  .ppsearch{flex:0 1 236px}
  /* chỉ từ đây dải chữ cái mới phải cuộn → mờ mép phải để thấy còn nữa */
  .ppazin{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent)}
}

/* ---- điện thoại -------------------------------------------------------- */
@media (max-width:719px){
  .people{padding:0 20px 76px}
  .ppcrumb{margin-top:18px}
  .pphead{flex-direction:column;align-items:flex-start;margin-top:10px;padding-bottom:12px;gap:6px}
  .pphead .ppmeta{margin:0}
  .ppbar{padding:12px 0;gap:8px}
  .ppsearch{flex:1 1 100%;height:44px}
  .ppsel{flex:1 1 0}
  .ppsel select{width:100%;height:44px}
  .pplink{margin-left:0;order:3;padding:10px 2px}
  .ppaz{margin:0 -20px;padding:0 10px}
  .ppazin button{flex:none;width:40px;min-width:40px;max-width:none;height:44px;font-size:13px}

  .ppcol{display:none}
  .ppg{padding:22px 0 6px;gap:10px}
  .ppr{grid-template-columns:34px minmax(0,1fr);grid-template-areas:"c n" "c m";
    gap:2px 12px;padding:11px 0}
  .ppcv{grid-area:c;width:34px;height:49px}
  .ppcv img{width:34px;height:49px}
  .ppn{grid-area:n;font-size:15px;white-space:normal;overflow:visible}
  .ppsm{grid-area:m;display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px}
  .ppc,.ppd{display:inline;font-size:12px;text-align:left}
  .ppd::before{content:"·";margin-right:6px;color:var(--dim)}
  .ppempty{padding:48px 4px}
}

@media (prefers-reduced-motion:reduce){
  .ppr,.ppn,.ppazin button,.ppsearch,.ppsel select{transition:none}
}
</style>
</head>
<body data-personal-follow-only>
<header id="hdr"></header>
<main class="people">
  <nav class="ppcrumb" id="crumb" aria-label="Bạn đang ở"><a href="/">Trang chủ</a><i aria-hidden="true">›</i><b>Tác giả</b></nav>

  <header class="pphead">
    <h1 id="ppTitle">Tác giả</h1>
    <p class="ppmeta" id="ppSub">Đang tải…</p>
  </header>

  <div class="ppbar" id="ppTools" hidden>
    <label class="ppsearch" id="ppQWrap" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
      <input id="ppQ" type="search" placeholder="Tìm tác giả…" aria-label="Tìm tác giả"
             autocomplete="off" spellcheck="false">
    </label>

    <div class="ppsel">
      <select id="ppSort" aria-label="Sắp xếp danh sách">
        <option value="az">A–Z</option>
        <option value="count">Nhiều truyện</option>
        <option value="new">Mới cập nhật</option>
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </div>

    <div class="ppsel">
      <select id="ppSt" aria-label="Lọc theo trạng thái">
        <option value="">Mọi trạng thái</option>
        <option value="run">Đang cập nhật</option>
        <option value="soon">Sắp ra mắt</option>
        <option value="done">Hoàn thành</option>
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </div>

    <button type="button" class="pplink" id="ppClear" hidden>Xoá bộ lọc</button>
  </div>

  <nav class="ppaz" id="ppAZ" aria-label="Chỉ mục theo chữ cái" hidden>
    <div class="ppazin" id="ppAZin"></div>
  </nav>

  <div class="ppcol" id="ppCols" hidden aria-hidden="true">
    <span></span><span>Tác giả</span><span>Truyện</span><span>Cập nhật</span><span>Trạng thái</span>
  </div>

  <div class="grid" id="ppGrid"></div>
</main>
<footer id="ftr"></footer>
