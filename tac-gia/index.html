<head>
<meta charset="utf-8">

<style>
/* ============================================================================
   TRANG DANH SÁCH TÁC GIẢ — "kệ sách tác giả" (r95)
   Chỉ áp cho /tac-gia/ (trang /couple/ giữ nguyên danh sách cũ).
   Dùng token của site (nền tối duy nhất) để không lệch bảng màu; chỉ thêm đúng
   hai thứ của bản thiết kế: quầng hồng rất nhạt ở đỉnh trang và bộ màu badge.
   ========================================================================== */
.people{max-width:1200px;margin:0 auto;padding:0 32px 72px;position:relative}
.people::before{content:"";position:absolute;left:50%;top:-100px;width:min(1200px,100vw);height:400px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(900px 360px at 50% 0,#3a2229aa,#14101000 70%)}
.people > *{position:relative}
.people .crumb{margin:26px 0 0;padding:0;font-size:12.5px;color:var(--mut);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.people .crumb a{color:var(--mut)}
.people .crumb b{color:var(--txt);font-weight:600}
.pphead{margin:12px 0 24px;position:relative}
.pphead h1{font-family:var(--font-head);font-size:clamp(30px,4.4vw,40px);line-height:1.08;
  letter-spacing:-.02em;margin:0 0 6px}
.pphead .sub{margin:0;color:var(--mut);font-size:14px}

/* ---- thanh công cụ: tìm + chip sắp xếp + chip trạng thái ---------------- */
.pptools{display:flex;flex-direction:column;gap:14px;margin:0 0 28px}
.ppsearch{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;max-width:420px;
  border:1px solid var(--bd);border-radius:999px;background:var(--surf);color:var(--mut);
  transition:border-color .16s var(--ease)}
.ppsearch:focus-within{border-color:var(--acc)}
.ppsearch .i{width:16px;height:16px;flex:none}
.ppsearch input{flex:1;min-width:0;border:0;background:none;color:var(--txt);outline:none;
  font:400 15px/1.4 var(--font)}
.ppsearch input::placeholder{color:var(--dim)}
.pprow{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center}
.ppchips{display:flex;align-items:center;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;padding:1px}
.ppchips::-webkit-scrollbar{display:none}
.pplab{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ppchip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--bd);
  background:transparent;color:var(--mut);font:600 13px/1 var(--font);cursor:pointer;
  transition:color .16s var(--ease),border-color .16s var(--ease),background-color .16s var(--ease)}
.ppchip:hover{color:var(--txt);border-color:var(--bd2)}
.ppchip[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 16%,transparent);
  border-color:color-mix(in srgb,var(--acc) 58%,transparent);color:var(--acc)}

/* ---- tác giả nổi bật ---------------------------------------------------- */
.ppfeat{margin:0 0 34px}
.pph2{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;
  font-family:var(--font-head);font-size:20px;font-weight:600}
.pph2 span{font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--dim)}
.ppfgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pafeat{min-height:136px;padding:16px;border-radius:16px;overflow:hidden;position:relative}
.pafeat::before{content:"";position:absolute;left:-30px;top:50%;transform:translateY(-50%);
  width:240px;height:240px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#e8a0b242,#e8a0b218 46%,transparent 72%)}
.pafeat > *{position:relative}

/* ---- thanh A–Z --------------------------------------------------------- */
.ppaz{position:sticky;top:0;z-index:20;margin:0 0 22px;padding:10px 0;
  background:var(--bg);border-bottom:1px solid var(--bd)}
.ppaz[hidden]{display:none}
.ppazin{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ppazin::-webkit-scrollbar{display:none}
.ppaz button{flex:none;width:34px;height:34px;padding:0;margin:0;display:grid;place-items:center;
  font:700 12.5px/1 var(--font);color:var(--acc);background:transparent;cursor:pointer;
  border:1px solid transparent;border-radius:9px;
  transition:background-color .16s var(--ease),border-color .16s var(--ease)}
.ppaz button:hover{background:var(--surf2);border-color:var(--bd)}
.ppaz button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ppaz button.off{color:#8a7e79;pointer-events:none}

/* ---- nhóm chữ cái + lưới thẻ ------------------------------------------- */
.pgrid{display:block}
.ppgrp{margin:0 0 30px;scroll-margin-top:70px}
.ppghead{display:flex;align-items:baseline;gap:10px;margin:0 0 16px;padding:0 0 9px;
  border-bottom:1px solid var(--bd)}
.ppghead b{font-family:var(--font-head);font-size:26px;font-weight:600;line-height:1}
.ppghead span{font-size:12.5px;color:var(--dim)}
.pplist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pnote{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;padding:12px 14px;
  border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:var(--r);
  background:var(--surf);color:var(--mut);font-size:13.5px}
.pacard{display:flex;align-items:center;gap:14px;min-width:0;padding:14px 16px;
  border:1px solid var(--bd);border-radius:14px;background:var(--surf);color:inherit;
  box-shadow:0 8px 24px #0005;
  transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease)}
.pacard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 55%,var(--bd))}
.pacard:hover .pbody b{color:var(--acc)}
.pacard:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pbody{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pbody b{font-size:16px;font-weight:600;line-height:1.32;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;
  transition:color .18s var(--ease)}
.pcount{font-size:12.5px;color:var(--mut)}
.pbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.pbadge{font-size:11.5px;font-weight:650;line-height:1.5;padding:2px 8px;border-radius:6px;white-space:nowrap}
.pbadge.done{background:#1f2e25;color:#8fd3a5}
.pbadge.run{background:#33291a;color:#e8c46a}
.pbadge.soon{background:#36202a;color:#e3a0b4}

/* ---- sách 3D (CSS thuần, không thư viện) ------------------------------- */
.stack{position:relative;width:88px;height:64px;flex:none;perspective:520px;--t:10px}
.stack i{position:absolute;left:0;bottom:0;width:44px;height:64px;display:block;
  border-radius:2px 5px 5px 2px;transform-style:preserve-3d;transform:rotateY(26deg);
  transition:transform .3s var(--ease);box-shadow:inset 0 0 0 1px #ffffff22;
  background:var(--c,#3a2a2e)}
.stack i img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  border-radius:2px 5px 5px 2px}
/* lớp gloss phủ lên bìa (translateZ để nằm trước ảnh khi preserve-3d) */
.stack i::after{content:"";position:absolute;inset:0;border-radius:2px 5px 5px 2px;
  pointer-events:none;transform:translateZ(1px);
  background:linear-gradient(110deg,#ffffff3a,#ffffff00 38%,#00000000 62%,#00000055)}
/* gáy sách */
.stack i::before{content:"";position:absolute;left:0;top:0;width:var(--t);height:100%;
  transform-origin:left center;transform:rotateY(90deg);
  background:linear-gradient(#0008,#0008),linear-gradient(var(--c,#3a2a2e),var(--c,#3a2a2e))}
/* bóng đổ dưới sách */
.stack::after{content:"";position:absolute;left:4px;right:-6px;bottom:-7px;height:10px;z-index:-1;
  background:radial-gradient(ellipse at center,#000b,#0000 70%)}
.stack i:nth-child(2){left:20px}
.stack i:nth-child(3){left:40px}
.pacard:hover .stack i{transform:rotateY(14deg) translateY(-4px)}
.pmore{position:absolute;right:-4px;top:-6px;z-index:2;font-size:10.5px;font-weight:700;
  color:var(--mut);background:var(--surf2);border:1px solid var(--bd);border-radius:999px;
  padding:1px 6px;line-height:1.5}
.stack.lg{width:176px;height:104px;--t:16px}
.stack.lg i{width:72px;height:104px}
.stack.lg i:nth-child(2){left:36px}
.stack.lg i:nth-child(3){left:72px}
/* tác giả chưa có bìa: avatar chữ cái, KHÔNG phải ô đen */
.pava{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:50%;
  background:#261e20;border:1.5px dashed #4d3d40;color:#d3aeb8;
  font-family:var(--font-head);font-size:19px;font-weight:700;letter-spacing:.02em}
.pafeat .pava{width:96px;height:96px;font-size:26px}

/* ---- trạng thái rỗng --------------------------------------------------- */
.ppempty{grid-column:1/-1;padding:44px 20px;text-align:center;border:1px dashed var(--bd);
  border-radius:var(--r-lg);color:var(--mut)}
.ppempty b{display:block;font-family:var(--font-head);font-size:19px;color:var(--txt);
  font-weight:600;margin-bottom:6px}
.ppempty .btn{margin-top:16px}

/* ---- responsive -------------------------------------------------------- */
@media (max-width:1023px){
  .ppfgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .pplist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pafeat{min-height:0;padding:14px;gap:12px}
  .pafeat .pbody b{font-size:16px}
  .stack.lg{width:124px;height:78px;--t:12px}
  .stack.lg i{width:54px;height:78px}
  .stack.lg i:nth-child(2){left:27px}
  .stack.lg i:nth-child(3){left:54px}
  /* chip + thanh A–Z cuộn ngang: mép phải mờ để thấy còn nữa */
  .ppchips,.ppaz{position:relative}
  .ppchips::after,.ppaz::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;
    pointer-events:none;background:linear-gradient(90deg,#14101000,var(--bg))}
  .ppazin{position:relative}
}
@media (max-width:639px){
  .people{padding:0 16px 56px}
  .ppfgrid{grid-template-columns:minmax(0,1fr)}
  .pphead{margin:10px 0 18px}
  .ppsearch{max-width:none;height:44px}
  .ppchip{height:44px;padding:0 16px}
  .pprow{gap:10px;flex-direction:column;align-items:stretch}
  .pplist{grid-template-columns:minmax(0,1fr);gap:0}
  .pacard{border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;
    box-shadow:none;padding:12px 2px;gap:12px}
  .pacard:hover{transform:none}
  .pafeat{border:1px solid var(--bd);border-radius:16px;background:var(--surf);
    box-shadow:0 8px 24px #0005;padding:14px}
  .stack{width:64px;height:46px;--t:8px}
  .stack i{width:32px;height:46px}
  .stack i:nth-child(2){left:15px}
  .stack i:nth-child(3){left:30px}
  .stack.lg{width:104px;height:66px;--t:11px}
  .stack.lg i{width:46px;height:66px}
  .stack.lg i:nth-child(2){left:23px}
  .stack.lg i:nth-child(3){left:46px}
  .pafeat{min-height:0;align-items:center}
  .pafeat .pava{width:72px;height:72px;font-size:21px}
  .ppaz{margin:0 -16px 18px;padding:8px 16px}
  .ppaz button{width:44px;height:44px;font-size:13px}
  .ppazin{gap:2px}
}
@media (prefers-reduced-motion:reduce){
  .stack i,.pacard,.ppchip{transition:none}
  .pacard:hover{transform:none}
  .pacard:hover .stack i{transform:rotateY(26deg)}
}
</style>
</head>
<body data-personal-follow-only>
<header id="hdr"></header>
<main class="people">
  <nav class="crumb" id="crumb"><a href="/">Trang chủ</a> <span>›</span> <b>Tác giả</b></nav>

  <div class="pphead">
    <h1 id="ppTitle">Tác giả</h1>
    <p class="sub" id="ppSub">Đang tải…</p>
  </div>

  <div class="pptools" id="ppTools" hidden>
    <label class="ppsearch" id="ppQWrap" hidden>
      <span data-ic="search"></span>
      <input id="ppQ" type="search" placeholder="Tìm tác giả…" aria-label="Tìm tác giả"
             autocomplete="off" spellcheck="false">
    </label>
    <div class="pprow">
      <div class="ppchips" role="group" aria-label="Sắp xếp">
        <span class="pplab" aria-hidden="true">Sắp xếp</span>
        <button type="button" class="ppchip" data-sort="az" aria-pressed="true">A–Z</button>
        <button type="button" class="ppchip" data-sort="count" aria-pressed="false">Nhiều truyện nhất</button>
        <button type="button" class="ppchip" data-sort="new" aria-pressed="false">Mới cập nhật</button>
      </div>
      <div class="ppchips" role="group" aria-label="Lọc theo trạng thái">
        <span class="pplab" aria-hidden="true">Trạng thái</span>
        <button type="button" class="ppchip" data-st="run" aria-pressed="false">Đang cập nhật</button>
        <button type="button" class="ppchip" data-st="soon" aria-pressed="false">Sắp ra mắt</button>
        <button type="button" class="ppchip" data-st="done" aria-pressed="false">Hoàn thành</button>
      </div>
    </div>
  </div>

  <section class="ppfeat" id="ppFeat" aria-labelledby="ppFeatH" hidden>
    <h2 class="pph2" id="ppFeatH">Tác giả nổi bật <span>nhiều truyện nhất</span></h2>
    <div class="ppfgrid" id="ppFeatGrid"></div>
  </section>

  <nav class="ppaz" id="ppAZ" aria-label="Chỉ mục tác giả theo chữ cái" hidden><div class="ppazin" id="ppAZin"></div></nav>

  <div class="grid pgrid" id="ppGrid"></div>
</main>
<footer id="ftr"></footer><button id="toTop" aria-label="Lên đầu trang"></button>
