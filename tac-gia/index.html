<style>
/* ============================================================================
   TRANG TÁC GIẢ — "kệ sách tác giả" (r97)
   Chỉ áp cho /tac-gia/; /couple/ vẫn dùng danh sách cũ trong cz.css.
   Mọi lớp ở đây có tiền tố pp-/p… để không đụng quy tắc cũ (.people .pcard,
   .note, .empty, .search…) — đây là lý do lớp thẻ là .pca/.pcf, không phải .pcard.
   ========================================================================== */
.people{max-width:1180px;margin:0 auto;padding:0 32px 88px;position:relative}
.people::before{content:"";position:absolute;left:50%;top:-90px;width:min(1180px,100vw);height:400px;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(880px 340px at 50% -50px,#3a2229b3,#14110e00 72%)}
.people > *{position:relative}

/* ---- đầu trang ---------------------------------------------------------- */
.people .crumb{margin:24px 0 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  font:400 12.5px/1.4 var(--font);color:var(--mut)}
.people .crumb a{color:var(--mut)}
.people .crumb a:hover{color:var(--txt)}
.people .crumb b{color:var(--txt);font-weight:600}
.pphead{margin:10px 0 20px}
.pphead h1{font-family:var(--font-head);font-size:clamp(30px,4.2vw,40px);line-height:1.06;
  letter-spacing:-.022em;margin:0 0 5px}
.pphead .sub{margin:0;color:var(--mut);font-size:13.5px;line-height:1.5}

/* ---- công cụ ------------------------------------------------------------ */
.pptools{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.pptools[hidden]{display:none}
.pprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ppsearch{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 13px;
  flex:0 1 320px;min-width:0;border:1px solid var(--bd);border-radius:99px;background:var(--surf);
  color:var(--dim);transition:border-color .16s var(--ease),background-color .16s var(--ease)}
.ppsearch:focus-within{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--surf2)}
.ppsearch .i{width:15px;height:15px;flex:none}
.ppsearch input{flex:1;min-width:0;border:0;background:none;color:var(--txt);outline:none;
  font:400 14.5px/1.4 var(--font)}
.ppsearch input::placeholder{color:var(--dim)}
.ppsearch input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

.ppseg{display:inline-flex;align-items:center;gap:2px;padding:3px;flex:none;
  border:1px solid var(--bd);border-radius:99px;background:var(--surf)}
.ppseg button{height:38px;padding:0 13px;border:0;border-radius:99px;background:transparent;color:var(--mut);
  font:600 12.5px/1 var(--font);cursor:pointer;white-space:nowrap;
  transition:color .16s var(--ease),background-color .16s var(--ease)}
.ppseg button:hover{color:var(--txt)}
.ppseg button[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.ppseg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

.ppstwrap{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.pplab{flex:none;font-size:9.5px;line-height:1;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.ppchips{display:flex;align-items:center;gap:7px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:1px}
.ppchips::-webkit-scrollbar{display:none}
.ppchip{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border:1px solid var(--bd);border-radius:99px;background:transparent;color:var(--mut);
  font:500 12.5px/1 var(--font);cursor:pointer;
  transition:color .16s var(--ease),border-color .16s var(--ease),background-color .16s var(--ease)}
.ppchip .dot{width:6px;height:6px;border-radius:50%;flex:none}
.ppchip:hover{color:var(--txt);border-color:var(--bd2)}
.ppchip[aria-pressed="true"]{color:var(--txt);border-color:color-mix(in srgb,var(--acc) 45%,transparent);
  background:color-mix(in srgb,var(--acc) 10%,transparent)}
.ppchip:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.dot.done{background:#8fd3a5}
.dot.run{background:#e8c46a}
.dot.soon{background:#e3a0b4}

.ppfilt{display:none;align-items:center;gap:7px;height:42px;padding:0 13px;flex:none;
  border:1px solid var(--bd);border-radius:99px;background:var(--surf);color:var(--txt);
  font:600 12.5px/1 var(--font);cursor:pointer}
.ppfilt .i{width:14px;height:14px}
.ppfilt .n{min-width:17px;height:17px;padding:0 4px;border-radius:99px;display:grid;place-items:center;
  background:var(--acc);color:#2a1119;font:700 10.5px/1 var(--font)}
.ppfilt .n[hidden]{display:none}

.ppact{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.ppact.on{display:flex;margin-top:-2px}
.ppact .a{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:99px;
  border:1px solid color-mix(in srgb,var(--acc) 36%,transparent);
  background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--txt);font:500 12px/1 var(--font)}
.ppact .a button{width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:50%;
  background:transparent;color:var(--mut);cursor:pointer}
.ppact .a button:hover{background:#00000040;color:var(--txt)}
.ppact .a svg{width:11px;height:11px}
.ppact .all{border:0;background:transparent;color:var(--mut);font:600 12px/1 var(--font);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px}
.ppact .all:hover{color:var(--txt)}

/* ---- khối sách 3D -------------------------------------------------------
   Bìa thật đứng trước (luôn đọc được), phía sau là 1–2 "block giấy" lệch
   phải–xuống: đường gân giấy, mép bìa tối phía trên, bóng đổ giữa các lớp.
   ------------------------------------------------------------------------ */
.pbook{position:relative;flex:none;display:block;
  width:calc(var(--cw) + var(--lay,0) * var(--p) + 2px);
  height:calc(var(--ch) + var(--lay,0) * 3px);
  --cw:44px;--ch:64px;--p:7px;--lay:0}
.pbook::after{content:"";position:absolute;left:0;right:-2px;bottom:-6px;height:10px;z-index:0;
  background:radial-gradient(ellipse at 38% 50%,#000000d4,transparent 74%)}
.pbook .pg{position:absolute;top:calc(var(--i) * 3px + 3px);left:calc(var(--i) * var(--p) + 2px);
  width:calc(var(--cw) - 2px);height:calc(var(--ch) - 5px);border-radius:1px 2px 2px 1px;
  background:
    linear-gradient(90deg,#00000030,transparent 30%),
    repeating-linear-gradient(180deg,#ece1c6 0 3px,#c3b596 3px 4px);
  box-shadow:inset -1.5px 0 0 #7c7160,inset 0 2px 0 #2f2629,inset 0 0 0 1px #fffaf01f,2px 2px 5px #000000b8;
  z-index:calc(3 - var(--i))}
.pbook .bk{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);border-radius:2px 3px 3px 2px;
  overflow:hidden;background:#241c1e;z-index:5;
  box-shadow:0 2px 5px #000c,7px 8px 14px -8px #000000d6,inset 0 0 0 1px #ffffff2e;
  transition:transform .3s var(--ease)}
.pbook .bk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pbook .bk::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(90deg,#000000b8 0,#0000003d 6%,#00000000 15%),
    linear-gradient(270deg,#f1e6cf 0 2px,#00000000 2px),
    linear-gradient(270deg,#00000000 2px,#00000055 4px,#00000000 7%)}
.pbook.lg{--cw:76px;--ch:108px;--p:13px}
.pcf .pbook{transform-origin:left center;transition:transform .34s var(--ease)}
.pcf:hover .pbook{transform:perspective(760px) rotateY(-6deg)}
@media (prefers-reduced-motion:reduce){.pcf:hover .pbook{transform:none}}

/* tác giả chưa có bìa: avatar tròn chữ cái, không phải ô đen */
.pava{flex:none;display:grid;place-items:center;border-radius:50%;width:44px;height:44px;
  background:#261e20;border:1.5px dashed #4d3d40;color:#d3aeb8;
  font-family:var(--font-head);font-weight:700;font-size:15px}
.pava.lg{width:68px;height:68px;font-size:21px}

/* ---- thẻ ---------------------------------------------------------------- */
.pca,.pcf{position:relative;display:flex;align-items:center;text-decoration:none;color:inherit;
  border:1px solid var(--bd);border-radius:14px;background:var(--surf);
  transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.pca:hover,.pcf:hover{border-color:var(--bd2);transform:translateY(-2px);box-shadow:0 16px 30px -22px #000e}
.pca:hover b,.pcf:hover b{color:var(--acc)}
.pca:focus-visible,.pcf:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pca:hover .pbook .bk{transform:translateY(-2px)}
.pct{min-width:0;display:flex;flex-direction:column;justify-content:center}
.pct b{font-weight:600;letter-spacing:-.005em;overflow-wrap:anywhere;transition:color .16s var(--ease);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcm{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcb{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.pbadge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;
  font:600 11px/1 var(--font);letter-spacing:.005em}
.pbadge.done{background:#1f2e25;color:#8fd3a5}
.pbadge.run{background:#33291a;color:#e8c46a}
.pbadge.soon{background:#36202a;color:#e3a0b4}

/* thẻ danh sách */
.pca{gap:13px;padding:12px 14px;min-height:92px}
.pca .pct{gap:3px}
.pca b{font-size:15px;line-height:1.32}
.pca .pcm{font-size:12.5px;line-height:1.4;color:var(--mut)}
.pca .pcb{margin-top:2px}

/* thẻ nổi bật */
.ppfeat{margin:0 0 30px}
.ppfeat[hidden]{display:none}
.ppsechead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.ppover{font-size:9.5px;line-height:1;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.ppnote{font-size:12.5px;line-height:1.4;color:var(--dim)}
.ppfgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcf{gap:15px;padding:16px;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#221b1d,#1b1617);border-color:#3a2b2f}
.pcf::before{content:"";position:absolute;left:-40px;top:50%;transform:translateY(-50%);
  width:250px;height:250px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#e8a0b24f,#e8a0b218 48%,transparent 74%)}
.pcf .pbook,.pcf .pct,.pcf .pava{position:relative}
.pcf .pct{gap:4px}
.pcf b{font-size:17px;line-height:1.28}
.pcf .pcm{font-size:12.5px;line-height:1.4;color:var(--mut)}
.pcf .pcl{font-size:12px;line-height:1.4;color:var(--dim)}
.pcf .pcb{margin-top:2px}

/* ---- thanh A–Z ---------------------------------------------------------- */
.ppaz{position:sticky;top:0;z-index:20;margin:0 0 4px;padding:3px 0;
  background:var(--bg);border-bottom:1px solid var(--bd)}
.ppaz[hidden]{display:none}
.ppazin{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ppazin::-webkit-scrollbar{display:none}
.ppazin button{flex:1 1 0;min-width:0;max-width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;
  border-radius:9px;background:transparent;color:var(--txt);cursor:pointer;font:600 12.5px/1 var(--font);
  transition:background-color .16s var(--ease),color .16s var(--ease)}
.ppazin button:hover{background:var(--surf2);color:var(--acc)}
.ppazin button[aria-current="true"]{background:var(--acc);color:#2a1119}
.ppazin button.off{color:var(--dim);opacity:.34;pointer-events:none}
.ppazin button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* ---- nhóm chữ cái + lưới ------------------------------------------------ */
.ppgrp{padding-top:14px;scroll-margin-top:66px}
.ppgh{display:flex;align-items:center;gap:11px;margin:8px 0 12px}
.ppgh .l{font-family:var(--font-head);font-weight:600;font-size:20px;line-height:1;min-width:17px}
.ppgh .c{font-size:12px;line-height:1;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.ppgh .r{flex:1;height:1px;background:var(--bd)}
.pplist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#ppGrid{display:block}
#ppGrid[data-mode="one"]{display:grid}

/* ---- thông báo / rỗng --------------------------------------------------- */
.ppmiss{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:10px 14px;border:1px solid var(--bd);
  border-radius:10px;background:var(--surf2);color:var(--mut);font-size:12.5px;line-height:1.5}
.ppempty{padding:48px 20px;text-align:center;border:1px dashed var(--bd);border-radius:14px}
.ppempty b{display:block;font-family:var(--font-head);font-weight:600;font-size:19px;margin-bottom:6px}
.ppempty p{margin:0 0 16px;color:var(--mut);font-size:13px;line-height:1.5}
.ppempty button{height:40px;padding:0 18px;border-radius:99px;border:0;cursor:pointer;
  background:var(--acc);color:#2a1119;font:600 13px/1 var(--font)}

/* ---- màn hình vừa (640–1023) -------------------------------------------- */
@media (max-width:1023px){
  .people{padding:0 22px 76px}
  .pplist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ppsearch{flex:0 1 300px}
  .pcf{gap:13px;padding:14px}
  .pcf .pbook.lg{--cw:60px;--ch:86px;--p:11px}
  .pcf b{font-size:15.5px}
  .ppseg button{height:38px}
  .ppchip{height:38px}
  .ppfgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ppstwrap{flex:1 1 100%;margin-left:0;order:3}
  .ppazin button{flex:none;width:44px;max-width:none}
  .ppazin,.ppchips{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
}

/* ---- điện thoại (<640) -------------------------------------------------- */
@media (max-width:639px){
  .people{padding:0 16px 68px}
  .people .crumb{margin-top:16px}
  .pphead{margin:8px 0 16px}
  .pprow{gap:10px}
  .ppsearch{flex:1 1 auto;height:44px}
  .ppfilt{display:inline-flex;height:44px;margin-left:auto}
  .ppseg{order:3;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
  .ppseg::-webkit-scrollbar{display:none}
  .ppseg button{flex:1 1 0;height:44px;padding:0 6px}
  .ppstwrap{display:none;order:4;margin:0}
  .ppstwrap.on{display:flex;flex:1 1 100%}
  .ppstwrap .pplab{display:none}
  .ppchip{height:44px;padding:0 15px;font-size:13px}
  .ppfgrid{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:0 -16px;padding:0 16px 6px;scroll-padding-left:16px;scrollbar-width:none}
  .ppfgrid::-webkit-scrollbar{display:none}
  .pcf{flex:0 0 86%;scroll-snap-align:start;padding:13px;gap:12px}
  .pcf .pbook.lg{--cw:54px;--ch:78px;--p:8px}
  .pcf b{font-size:15.5px}
  .pcf .pcl{display:none}
  .ppfeat{margin-bottom:22px}
  .pplist{grid-template-columns:minmax(0,1fr);gap:0}
  .pca{border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;
    padding:12px 2px;min-height:0;gap:13px}
  .pca:hover{transform:none;box-shadow:none}
  .pca{padding:12px 2px 14px}
  .pca .pbook{--cw:38px;--ch:56px;--p:6px}
  .ppaz{margin:0 -16px 2px;padding:7px 16px}
  .ppazin{gap:1px}
  .ppazin button{flex:none;width:44px;max-width:none;font-size:13px}
  .ppgrp{padding-top:12px;scroll-margin-top:64px}
  .ppgh{margin:4px 0 8px}
}

@media (prefers-reduced-motion:reduce){
  .pca,.pcf,.pbook .bk,.ppazin button,.ppchip,.ppseg button,.ppsearch{transition:none}
  .pca:hover,.pcf:hover{transform:none}
  .pca:hover .pbook .bk{transform:none}
}
</style>
</head>
<body data-personal-follow-only>
<header id="hdr"></header>
<main class="people">
  <nav class="crumb" id="crumb"><a href="/">Trang chủ</a> <span aria-hidden="true">›</span> <b>Tác giả</b></nav>

  <div class="pphead">
    <h1 id="ppTitle">Tác giả</h1>
    <p class="sub" id="ppSub">Đang tải…</p>
  </div>

  <div class="pptools" id="ppTools" hidden>
    <div class="pprow">
      <label class="ppsearch" id="ppQWrap" hidden>
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
        <input id="ppQ" type="search" placeholder="Tìm tác giả…" aria-label="Tìm tác giả"
               autocomplete="off" spellcheck="false">
      </label>
      <div class="ppseg" role="group" aria-label="Sắp xếp danh sách">
        <button type="button" data-sort="az" aria-pressed="true">A–Z</button>
        <button type="button" data-sort="count" aria-pressed="false">Nhiều truyện</button>
        <button type="button" data-sort="new" aria-pressed="false">Mới cập nhật</button>
      </div>
      <button type="button" class="ppfilt" id="ppFilt" aria-expanded="false" aria-controls="ppStWrap">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        Lọc <i class="n" id="ppFiltN" hidden>0</i>
      </button>
    </div>
    <div class="ppstwrap" id="ppStWrap">
      <span class="pplab" aria-hidden="true">Trạng thái</span>
      <div class="ppchips" id="ppSt" role="group" aria-label="Lọc theo trạng thái">
        <button type="button" class="ppchip" data-st="run" aria-pressed="false"><i class="dot run"></i>Đang cập nhật</button>
        <button type="button" class="ppchip" data-st="soon" aria-pressed="false"><i class="dot soon"></i>Sắp ra mắt</button>
        <button type="button" class="ppchip" data-st="done" aria-pressed="false"><i class="dot done"></i>Hoàn thành</button>
      </div>
    </div>
    <div class="ppact" id="ppAct"></div>
  </div>

  <section class="ppfeat" id="ppFeat" hidden aria-labelledby="ppFeatH">
    <div class="ppsechead">
      <span class="ppover" id="ppFeatH">Nổi bật</span>
      <span class="ppnote">ba tác giả nhiều truyện nhất</span>
    </div>
    <div class="ppfgrid" id="ppFeatGrid"></div>
  </section>

  <nav class="ppaz" id="ppAZ" aria-label="Chỉ mục theo chữ cái" hidden>
    <div class="ppazin" id="ppAZin"></div>
  </nav>

  <div class="grid" id="ppGrid"></div>
</main>
<footer id="ftr"></footer>
